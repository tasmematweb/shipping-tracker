<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>H.L LeVance | المتجر</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --yellow-main: #FDD95A; --yellow-light: #FDE35E; --yellow-soft: #FCD649;
      --yellow-dark: #F4C83E; --brown: #57080E; --brown-light: #6A1017;
    }
    html { scroll-behavior:smooth; }
    body { width:100%; min-height:100vh; font-family:Arial, sans-serif; background:var(--yellow-main); color:var(--brown); }
    #intro { position:fixed; inset:0; width:100vw; height:100dvh; background:var(--yellow-main); z-index:99999; display:flex; align-items:center; justify-content:center; overflow:hidden; transition:opacity .8s, visibility .8s; }
    #intro video { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; background:var(--yellow-main); }
    #intro.hide { opacity:0; visibility:hidden; pointer-events:none; }
    #store { min-height:100vh; opacity:0; transform:translateY(15px); visibility:hidden; background:var(--yellow-main); transition:opacity .8s, transform .8s; }
    #store.show { opacity:1; transform:translateY(0); visibility:visible; }
    header { position:sticky; top:0; z-index:1000; background:var(--yellow-main); border-bottom:3px solid var(--brown); }
    .top-header { min-height:70px; display:flex; align-items:center; justify-content:space-between; gap:15px; padding:10px 4%; background:var(--yellow-main); }
    .logo { color:var(--brown); text-decoration:none; font-family:Georgia,serif; font-size:clamp(28px, 5vw, 56px); font-weight:bold; white-space:nowrap; }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .login-btn, .logout-btn, .cart { background:var(--brown); border:none; color:var(--yellow-light); font-size:clamp(12px, 2vw, 16px); cursor:pointer; white-space:nowrap; padding:clamp(8px, 1.5vw, 12px) clamp(12px, 2vw, 20px); border-radius:8px; font-weight:bold; transition:background .2s; }
    .logout-btn { background:#dc3545; }
    .logout-btn:hover { background:#c82333; }
    .login-btn:hover, .cart:hover { background:var(--brown-light); }
    .login-btn.hidden { display:none; }
    .logout-btn.hidden { display:none; }
    .search-bar { padding:10px 4% 15px; background:var(--yellow-main); }
    .search-box { display:flex; height:46px; max-width:100%; border:2px solid var(--brown); border-radius:8px; overflow:hidden; background:var(--yellow-light); }
    .search-box input { width:100%; border:none; outline:none; background:var(--yellow-light); color:var(--brown); padding:0 18px; font-size:16px; direction:rtl; }
    .search-box input::placeholder { color:var(--brown); opacity:.75; }
    .search-box button { width:60px; border:none; border-right:2px solid var(--brown); background:var(--brown); color:var(--yellow-light); cursor:pointer; font-size:20px; }
    .search-box button:hover { background:var(--brown-light); }
    .offers-section { padding:clamp(25px, 5vw, 45px) 4%; background:linear-gradient(135deg,var(--yellow-light),var(--yellow-main),var(--yellow-soft)); border-bottom:3px solid var(--brown); }
    .offers-grid { display:flex; gap:clamp(12px, 2vw, 22px); overflow-x:auto; padding-bottom:20px; scroll-snap-type:x mandatory; }
    .offer-card { min-width:clamp(220px, 40vw, 280px); max-width:280px; background:var(--yellow-light); border:2px solid var(--brown); border-radius:12px; overflow:hidden; box-shadow:0 5px 0 var(--brown); transition:transform .25s, box-shadow .25s; position:relative; scroll-snap-align:start; flex-shrink:0; }
    .offer-card:hover { transform:translateY(-5px); box-shadow:0 9px 0 var(--brown); }
    .offer-image { width:100%; height:clamp(120px, 25vw, 200px); display:flex; align-items:center; justify-content:center; background:var(--yellow-main); border-bottom:2px solid var(--brown); overflow:hidden; cursor:pointer; position:relative; }
    .offer-image img { width:100%; height:100%; object-fit:cover; }
    .offer-info { padding:clamp(10px, 2vw, 18px); background:var(--yellow-light); }
    .offer-info h3 { font-size:clamp(14px, 2vw, 18px); margin-bottom:10px; color:var(--brown); }
    .offer-info p { font-size:14px; color:var(--brown); margin-bottom:10px; }
    .offer-info .offer-price { font-size:clamp(16px, 2.5vw, 22px); font-weight:bold; color:var(--brown); }
    .offer-info .offer-old-price { text-decoration:line-through; font-size:16px; opacity:.6; margin-left:10px; }
    .offer-add-cart { width:100%; padding:12px; border:2px solid var(--brown); border-radius:7px; background:var(--brown); color:var(--yellow-light); cursor:pointer; font-size:clamp(13px, 1.5vw, 15px); font-weight:bold; transition:background .2s; margin-top:10px; }
    .offer-add-cart:hover { background:var(--brown-light); }
    .offer-delete { position:absolute; top:5px; left:5px; background:var(--brown); color:var(--yellow-light); border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:16px; display:none; z-index:10; }
    .offer-delete:hover { background:var(--brown-light); }
    .products { padding:clamp(25px, 5vw, 45px) 4%; background:var(--yellow-soft); border-bottom:3px solid var(--brown); }
    .section-title { font-size:clamp(22px, 4vw, 30px); }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(150px, 25vw, 260px),1fr)); gap:clamp(10px, 2vw, 22px); }
    .product { background:var(--yellow-light); border:2px solid var(--brown); border-radius:12px; overflow:hidden; box-shadow:0 5px 0 var(--brown); transition:transform .25s, box-shadow .25s; position:relative; }
    .product:hover { transform:translateY(-5px); box-shadow:0 9px 0 var(--brown); }
    .product-image { width:100%; height:clamp(150px, 35vw, 280px); display:flex; align-items:center; justify-content:center; background:var(--yellow-main); border-bottom:2px solid var(--brown); overflow:hidden; position:relative; cursor:pointer; }
    .product-image .main-media { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    .product-image .main-media img { width:100%; height:100%; object-fit:cover; }
    .product-image .product-icon { font-size:clamp(60px, 12vw, 90px); }
    .product-image .delete-prod { position:absolute; top:5px; left:5px; background:var(--brown); color:var(--yellow-light); border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:16px; display:none; z-index:10; }
    .product-image .delete-prod:hover { background:var(--brown-light); }
    .product-image .image-gallery { display:flex; gap:5px; position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.6); padding:5px 10px; border-radius:20px; z-index:5; max-width:90%; overflow-x:auto; }
    .product-image .image-gallery img { width:clamp(25px, 5vw, 40px); height:clamp(25px, 5vw, 40px); border-radius:4px; border:2px solid var(--yellow-main); cursor:pointer; object-fit:cover; flex-shrink:0; }
    .product-image .image-gallery img.active { border-color:var(--brown); }
    .product-info { padding:clamp(10px, 2vw, 18px); background:var(--yellow-light); }
    .product-info h3 { font-size:clamp(14px, 2vw, 18px); margin-bottom:10px; color:var(--brown); }
    .price { font-size:clamp(16px, 2.5vw, 23px); font-weight:bold; color:var(--brown); margin-bottom:10px; }
    .price .original-price { text-decoration:line-through; font-size:clamp(12px, 1.5vw, 16px); opacity:.6; margin-left:10px; }
    .sizes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .sizes .size-btn { padding:5px 12px; border:2px solid var(--brown); border-radius:6px; background:var(--yellow-light); color:var(--brown); cursor:pointer; font-weight:bold; font-size:clamp(10px, 1.5vw, 13px); transition:all .2s; }
    .sizes .size-btn:hover { background:var(--brown); color:var(--yellow-light); }
    .sizes .size-btn.selected { background:var(--brown); color:var(--yellow-light); }
    .add-cart { width:100%; padding:clamp(8px, 1.5vw, 12px); border:2px solid var(--brown); border-radius:7px; background:var(--brown); color:var(--yellow-light); cursor:pointer; font-size:clamp(12px, 1.5vw, 15px); font-weight:bold; transition:background .2s; }
    .add-cart:hover { background:var(--brown-light); }
    .zoom-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:99999; align-items:center; justify-content:center; flex-direction:column; padding:20px; touch-action:pan-y; }
    .zoom-modal.active { display:flex; }
    .zoom-modal .zoom-close { position:absolute; top:20px; left:20px; background:var(--brown); color:var(--yellow-light); border:none; border-radius:50%; width:50px; height:50px; font-size:28px; cursor:pointer; z-index:10; }
    .zoom-modal .zoom-content { width:100%; max-width:900px; max-height:80vh; display:flex; align-items:center; justify-content:center; position:relative; }
    .zoom-modal .zoom-content img { max-width:100%; max-height:80vh; border-radius:12px; border:3px solid var(--yellow-main); object-fit:contain; }
    .zoom-modal .zoom-nav { display:flex; gap:15px; margin-top:20px; align-items:center; }
    .zoom-modal .zoom-nav button { background:var(--brown); color:var(--yellow-light); border:none; padding:clamp(8px, 2vw, 12px) clamp(15px, 3vw, 25px); border-radius:8px; font-size:18px; cursor:pointer; font-weight:bold; }
    .zoom-modal .zoom-nav .zoom-counter { color:var(--yellow-light); font-size:18px; font-weight:bold; padding:0 15px; }
    #orderFormPage { display:none; padding:30px 4%; background:var(--yellow-soft); min-height:100vh; }
    #orderFormPage.active { display:block; }
    .order-form-container { max-width:700px; margin:0 auto; background:var(--yellow-light); border:3px solid var(--brown); border-radius:16px; padding:clamp(20px, 4vw, 35px) clamp(15px, 3vw, 30px); }
    .order-form-container h2 { text-align:center; color:var(--brown); font-family:Georgia,serif; font-size:clamp(22px, 4vw, 28px); margin-bottom:25px; }
    .order-form-container .order-summary { background:var(--yellow-main); border:2px solid var(--brown); border-radius:10px; padding:15px; margin-bottom:20px; }
    .order-form-container .order-summary h3 { color:var(--brown); margin-bottom:10px; font-size:18px; }
    .order-form-container .order-summary .cart-items { max-height:150px; overflow-y:auto; font-size:14px; color:var(--brown); }
    .order-form-container .order-summary .cart-items .item { padding:5px 0; border-bottom:1px solid rgba(87,8,14,.1); }
    .order-form-container .order-summary .total-price { text-align:left; font-weight:bold; font-size:20px; color:var(--brown); margin-top:10px; padding-top:10px; border-top:2px solid var(--brown); }
    .order-form-container .form-group { margin-bottom:16px; }
    .order-form-container .form-group label { display:block; font-weight:700; color:var(--brown); margin-bottom:5px; font-size:15px; }
    .order-form-container .form-group label .required { color:red; }
    .order-form-container .form-group input, .order-form-container .form-group select, .order-form-container .form-group textarea { width:100%; padding:12px 15px; border:2px solid var(--brown); border-radius:8px; font-size:15px; font-family:Arial,sans-serif; background:var(--yellow-light); color:var(--brown); transition:.3s; direction:rtl; }
    .order-form-container .form-group input:focus, .order-form-container .form-group select:focus, .order-form-container .form-group textarea:focus { border-color:var(--brown-light); outline:none; box-shadow:0 0 0 3px rgba(87,8,14,.1); }
    .order-form-container .form-group input[readonly] { background:var(--yellow-main); cursor:not-allowed; }
    .order-form-container .form-group textarea { height:80px; resize:vertical; }
    .order-form-container .form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    .order-form-container .submit-order-btn { width:100%; padding:15px; background:var(--brown); color:var(--yellow-light); border:none; border-radius:8px; font-size:20px; font-weight:bold; cursor:pointer; transition:background .3s; margin-top:10px; }
    .order-form-container .submit-order-btn:hover { background:var(--brown-light); }
    .order-form-container .submit-order-btn:disabled { opacity:.6; cursor:not-allowed; }
    .order-form-container .back-to-store { display:block; text-align:center; margin-top:15px; color:var(--brown); cursor:pointer; font-weight:bold; text-decoration:underline; }
    footer { padding:45px 5%; background:var(--yellow-main); color:var(--brown); text-align:center; border-top:3px solid var(--brown); }
    footer h2 { font-family:Georgia,serif; font-size:clamp(24px, 4vw, 32px); margin-bottom:10px; }
    footer p { font-weight:bold; }
    .whatsapp-float { position:fixed; bottom:25px; right:25px; z-index:99999; background:#25D366; color:white; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.3); text-decoration:none; border:2px solid white; animation:whatsappPulse 1.5s ease-in-out infinite; }
    .whatsapp-float:hover { transform:scale(1.1); box-shadow:0 6px 16px rgba(0,0,0,.4); }
    @keyframes whatsappPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .whatsapp-float::after { content:''; position:absolute; inset:-5px; border-radius:50%; border:3px solid #25D366; animation:whatsappRing 1.5s ease-out infinite; }
    @keyframes whatsappRing { 0%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(1.5)} }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10000; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .modal-overlay.active { display:flex; }
    .modal-box { background:var(--yellow-main); border:3px solid var(--brown); border-radius:16px; padding:35px 30px; width:90%; max-width:400px; box-shadow:0 20px 40px rgba(0,0,0,.4); text-align:center; }
    .modal-box h2 { color:var(--brown); font-family:Georgia,serif; font-size:28px; margin-bottom:25px; }
    .modal-box input { width:100%; padding:14px 16px; margin-bottom:16px; border:2px solid var(--brown); border-radius:8px; background:var(--yellow-light); color:var(--brown); font-size:16px; direction:rtl; }
    .modal-box .btn-login-submit { width:100%; padding:14px; background:var(--brown); color:var(--yellow-light); border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:8px; }
    .modal-box .signup-link { display:block; margin-top:18px; color:var(--brown); font-weight:bold; cursor:pointer; text-decoration:underline; font-size:15px; }
    .modal-box .close-modal { margin-top:15px; background:transparent; border:2px solid var(--brown); color:var(--brown); padding:8px 20px; border-radius:6px; cursor:pointer; font-weight:bold; }
    .cart-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10001; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .cart-modal.active { display:flex; }
    .cart-box { background:var(--yellow-main); border:3px solid var(--brown); border-radius:16px; padding:25px; width:90%; max-width:500px; box-shadow:0 20px 40px rgba(0,0,0,.4); text-align:center; max-height:80vh; overflow-y:auto; }
    .cart-box h2 { color:var(--brown); font-family:Georgia,serif; font-size:24px; margin-bottom:20px; }
    .cart-items-list { text-align:right; margin-bottom:15px; }
    .cart-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--brown); }
    .cart-item .item-name { font-weight:bold; font-size:14px; }
    .cart-item .item-price { font-size:14px; }
    .cart-item .remove-item { background:red; color:white; border:none; border-radius:50%; width:25px; height:25px; cursor:pointer; font-size:14px; }
    .cart-total { font-size:20px; font-weight:bold; margin:15px 0; }
    .cart-checkout-btn { width:100%; padding:14px; background:var(--brown); color:var(--yellow-light); border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:10px; }
    .cart-close-btn { margin-top:10px; background:transparent; border:2px solid var(--brown); color:var(--brown); padding:8px 20px; border-radius:6px; cursor:pointer; font-weight:bold; }
    #adminPanel { display:none; padding:30px 4%; background:var(--yellow-dark); border-bottom:3px solid var(--brown); }
    #adminPanel.active { display:block; }
    #adminPanel h2 { color:var(--brown); font-family:Georgia,serif; font-size:28px; margin-bottom:20px; }
    .admin-section { background:var(--yellow-light); border:2px solid var(--brown); border-radius:12px; padding:20px; margin-bottom:20px; }
    .admin-section h3 { color:var(--brown); margin-bottom:15px; font-size:20px; }
    .admin-controls { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:15px; }
    .admin-controls input, .admin-controls select { padding:12px 16px; border:2px solid var(--brown); border-radius:8px; background:var(--yellow-light); color:var(--brown); font-size:15px; flex:1; min-width:150px; }
    .admin-controls button { background:var(--brown); color:var(--yellow-light); border:none; padding:12px 24px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px; white-space:nowrap; }
    .admin-controls .size-checkboxes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:5px 10px; background:var(--yellow-main); border-radius:8px; border:2px solid var(--brown); }
    .admin-controls .size-checkboxes label { display:flex; align-items:center; gap:4px; font-weight:bold; color:var(--brown); font-size:14px; cursor:pointer; }
    .admin-controls .size-checkboxes input[type="checkbox"] { width:16px; height:16px; accent-color:var(--brown); flex:0 0 auto; min-width:unset; padding:0; }
    .admin-list { background:var(--yellow-light); border:2px solid var(--brown); border-radius:12px; padding:15px; max-height:300px; overflow-y:auto; }
    .admin-list-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--brown); }
    .admin-list-item .item-info { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .admin-list-item .item-info img { width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--brown); }
    .admin-list-item .item-info span { font-weight:bold; color:var(--brown); }
    .admin-list-item .item-info .size-tags { display:flex; gap:4px; }
    .admin-list-item .item-info .size-tags span { background:var(--brown); color:var(--yellow-light); padding:2px 8px; border-radius:4px; font-size:11px; font-weight:bold; }
    .admin-list-item button { background:var(--brown); color:var(--yellow-light); border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:13px; }
    .upload-status { font-weight:bold; margin:10px 0; }
    .upload-preview { max-width:100px; max-height:100px; border:2px solid var(--brown); border-radius:8px; margin:5px; display:none; }
    .add-image-btn { background:var(--brown); color:var(--yellow-light); border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:14px; margin-top:10px; }
    @media (max-width:700px) {
      .top-header { gap:6px; padding:8px 2%; }
      .cart { font-size:0; padding:8px 10px; }
      .cart::after { content:"🛒"; font-size:18px; }
      .search-bar { padding:8px 2% 10px; }
      .search-box { height:40px; }
      .search-box button { width:40px; font-size:16px; }
      .search-box input { font-size:14px; padding:0 10px; }
      .offers-section { padding:25px 2%; }
      .offers-grid { gap:10px; }
      .products { padding:25px 2%; }
      .product-grid { gap:10px; }
      .zoom-modal .zoom-close { width:40px; height:40px; font-size:22px; top:10px; left:10px; }
      .order-form-container { padding:15px 10px; }
      .order-form-container .form-row { grid-template-columns:1fr; gap:0; }
      .modal-box, .cart-box { padding:15px 10px; }
      .admin-controls { flex-direction:column; }
      .admin-controls input, .admin-controls select { min-width:unset; }
      .whatsapp-float { width:50px; height:50px; bottom:15px; right:15px; }
    }
  </style>
</head>
<body>
<div id="intro"><video id="introVideo" muted playsinline><source src="intro.mp4" type="video/mp4"></video></div>
<div id="store">
  <header>
    <div class="top-header">
      <a href="#" class="logo">H.L LeVance</a>
      <div class="header-actions">
        <button class="login-btn" id="loginBtn" onclick="openLoginModal()">دخول</button>
        <button class="logout-btn hidden" id="logoutBtn" onclick="handleLogout()">خروج</button>
        <button class="cart" onclick="showCart()">🛒 <span id="cartCount">0</span></button>
      </div>
    </div>
    <div class="search-bar">
      <div class="search-box"><input type="text" id="search" placeholder="بحث..." oninput="searchProducts()"><button onclick="searchProducts()">🔍</button></div>
    </div>
  </header>
  <section class="offers-section" id="offers"><h2 class="section-title">العروض</h2><div class="offers-grid" id="offersGrid"></div></section>
  <section class="products" id="products"><h2 class="section-title">المنتجات</h2><div class="product-grid" id="productGrid"></div></section>
  <div id="adminPanel" style="display:none;"><h2>لوحة التحكم</h2>
    <div class="admin-section"><h3>إضافة عرض</h3><div class="admin-controls">
      <input type="text" id="newOfferTitle" placeholder="عنوان العرض">
      <input type="text" id="newOfferDescription" placeholder="وصف العرض">
      <input type="number" id="newOfferPrice" placeholder="السعر الجديد">
      <input type="number" id="newOfferOldPrice" placeholder="السعر القديم">
      <input type="text" id="newOfferIcon" placeholder="أيقونة العرض">
    </div>
    <div id="offerImagesContainer"></div>
    <button class="add-image-btn" onclick="addOfferImageField()">إضافة صورة</button>
    <div id="offerUploadStatus" class="upload-status"></div>
    <div id="offerImagesPreview" style="display:flex;flex-wrap:wrap;gap:5px;"></div>
    <button onclick="addOffer()" style="margin-top:15px;background:var(--brown);color:var(--yellow-light);border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer;">إضافة العرض</button>
    </div>
    <div class="admin-section"><h3>قائمة العروض</h3><div class="admin-list" id="adminOfferList"></div></div>

async function uploadOfferImages() {
  const inputs = document.querySelectorAll('.offer-image-input');
  const status = document.getElementById('offerUploadStatus');
  const previewContainer = document.getElementById('offerImagesPreview');
  offerImages = [];
  if(previewContainer) previewContainer.innerHTML = '';
  status.textContent = 'جاري رفع الصور...';
  for(let input of inputs) {
    if(input.files[0]) {
      const formData = new FormData();
      formData.append('image', input.files[0]);
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {method:'POST', body:formData});
      const result = await response.json();
      if(result.success && result.data) {
        offerImages.push(result.data.url);
        const img = document.createElement('img');
        img.src = result.data.url;
        img.style.cssText = 'width:70px;height:70px;object-fit:cover;margin:5px;border-radius:5px;';
        previewContainer.appendChild(img);
      }
    }
  }
  status.textContent = `تم رفع ${offerImages.length} صورة بنجاح`;
}

async function uploadProductImages() {
  const inputs = document.querySelectorAll('.product-image-input');

  if(!inputs.length) return;

  if(previewContainer) previewContainer.innerHTML = '';

      const formData = new FormData();
      formData.append('image', inputs[i].files[0]);

        img.style.cssText = 'width:70px;height:70px;object-fit:cover;margin:5px;border-radius:5px;';
        previewContainer.appendChild(img);
      }
    }
  }
  status.textContent = `تم رفع ${uploadedImages.length} صورة بنجاح`;
}

function saveCart() { localStorage.setItem(CONFIG.STORAGE_KEY_CART, JSON.stringify(cart)); updateCartCount(); }
function updateCartCount() { const count = cart.reduce((sum,item)=>sum+item.quantity,0); const cartCount = document.getElementById('cartCount'); if(cartCount) cartCount.textContent = count; }
function addToCart(name, price, size, event) {
  const selectedSize = size || (event?.target?.parentElement?.querySelector('.size-btn.selected')?.textContent) || '';
  const existingItem = cart.find(item => item.name === name && item.size === selectedSize);
  if(existingItem) { existingItem.quantity++; } else { cart.push({name, price, size: selectedSize, quantity: 1}); }
  saveCart(); alert(`تم إضافة ${name} إلى السلة`);
}
function addOfferToCart(name, price, event) { addToCart(name, price, '', event); }
function removeFromCart(index) { cart.splice(index, 1); saveCart(); renderCart(); }
function renderCart() {
  const cartItemsList = document.getElementById('cartItemsList');
  const cartTotal = document.getElementById('cartTotal');
  if(!cartItemsList || !cartTotal) return;
  if(cart.length === 0) { cartItemsList.innerHTML = '<p style="text-align:center;">السلة فارغة</p>'; cartTotal.textContent = '0'; return; }
  cartItemsList.innerHTML = '';
  let total = 0;
  cart.forEach((item, index) => {
    const itemTotal = item.price * item.quantity;
    total += itemTotal;
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `<span class="item-name">${item.name} ${item.size ? '('+item.size+')' : ''} x${item.quantity}</span><span class="item-price">${itemTotal} جنيه</span><button class="remove-item" onclick="removeFromCart(${index})">✕</button>`;
    cartItemsList.appendChild(div);
  });
  cartTotal.textContent = total;
}
function showCart() { renderCart(); document.getElementById('cartModal').classList.add('active'); }
function closeCart() { document.getElementById('cartModal').classList.remove('active'); }
function checkout() {
  if(cart.length === 0) { alert('السلة فارغة'); return; }
  closeCart(); populateOrderForm();
  const orderFormPage = document.getElementById('orderFormPage');
  orderFormPage.style.display = 'block'; orderFormPage.classList.add('active');
  setTimeout(() => { orderFormPage.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 100);
}
function populateOrderForm() {
  const orderCartItems = document.getElementById('orderCartItems');
  const orderTotalPrice = document.getElementById('orderTotalPrice');
  const orderAmount = document.getElementById('orderAmount');
  if(!orderCartItems || !orderTotalPrice || !orderAmount) return;

    div.className = 'item';
    div.textContent = `${item.name} ${item.size ? '('+item.size+')' : ''} x${item.quantity} = ${itemTotal} جنيه`;

  orderTotalPrice.textContent = total;
  orderAmount.value = total;
}

async function addOffer() {
  const title = document.getElementById('newOfferTitle').value.trim();
  const description = document.getElementById('newOfferDescription').value.trim();

  const oldPrice = parseFloat(document.getElementById('newOfferOldPrice').value.trim())||0;
  const icon = document.getElementById('newOfferIcon').value.trim()||'';
  if(!title || isNaN(price) || price<=0) return alert('يرجى إدخال عنوان العرض والسعر.');
  await uploadOfferImages();
  const result = await callAPI('addOffer', {title, description, price, oldPrice, icon, media: offerImages});
  if(result.success) { alert('تم إضافة العرض بنجاح!'); document.getElementById('newOfferTitle').value=''; document.getElementById('newOfferDescription').value=''; document.getElementById('newOfferPrice').value=''; document.getElementById('newOfferOldPrice').value=''; document.getElementById('newOfferIcon').value=''; document.getElementById('offerImagesContainer').innerHTML=''; document.getElementById('offerImagesPreview').innerHTML=''; await loadData(); }
  else alert('فشل إضافة العرض: '+(result.error||'خطأ'));
}
async function deleteOffer(id) {
  if(!confirm('هل أنت متأكد من حذف هذا العرض؟')) return;
  const result = await callAPI('deleteOffer', {id});
  if(result.success) { alert('تم حذف العرض.'); await loadData(); }
  else alert('فشل حذف العرض: '+(result.error||'خطأ'));
}
async function callAPI(action, data = {}) {
  try {
    const res = await fetch(CONFIG.API_BASE_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, ...data})
    });
    return await res.json();
  } catch(e) { return {success: false, error: e.message}; }
}
async function fetchFromAPI(action) {
  try { const res = await fetch(CONFIG.API_BASE_URL+'?action='+action); return await res.json(); }
  catch(e){ return {error:e.message}; }
}
async function loadData() {
  try {
    const p = await fetchFromAPI('getProducts');
    if(p?.products) localStorage.setItem(CONFIG.STORAGE_KEY_PRODUCTS, JSON.stringify(p.products));
    const o = await fetchFromAPI('getOffers');
    if(o?.offers) localStorage.setItem(CONFIG.STORAGE_KEY_OFFERS, JSON.stringify(o.offers));
  } catch(e){ console.error(e); }
  renderStoreProducts(); renderAdminProducts(); renderOffers(); renderAdminOffers();
}

  const icon = document.getElementById('newProductIcon').value.trim()||'';
  if(!name || isNaN(price) || price<=0) return alert('يرجى إدخال اسم المنتج وسعر صحيح.');
  const sizes = [...document.querySelectorAll('.size-checkboxes input[type="checkbox"]:checked')].map(cb=>cb.value);
  await uploadProductImages();
  const result = await callAPI('addProduct', {name, price, discount, icon, sizes, media: uploadedImages});
  if(result.success) { alert('تم إضافة المنتج بنجاح!'); await loadData(); clearAddProduct(); }
  else alert('فشل إضافة المنتج: '+(result.error||'خطأ'));
}

function clearAddProduct() {
  document.getElementById('newProductName').value='';
  document.getElementById('newProductPrice').value='';
  document.getElementById('newProductDiscount').value='';
  document.getElementById('newProductIcon').value='';
  document.querySelectorAll('.size-checkboxes input[type="checkbox"]').forEach(cb=>cb.checked=false);
  uploadedImages = [];
  document.getElementById('uploadedImagesPreview').innerHTML='';
  document.getElementById('uploadStatus').textContent='';
  document.getElementById('productImagesContainer').innerHTML='';
}

async function deleteProduct(id) {
  if(!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
  const result = await callAPI('deleteProduct', {id});
  if(result.success){ alert('تم حذف المنتج.'); await loadData(); }
  else alert('فشل حذف المنتج: '+(result.error||'خطأ'));
}

async function submitOrder() {
  const name = document.getElementById('orderCustomerName').value.trim();
  const phone = document.getElementById('orderCustomerPhone').value.trim();
  const phone2 = document.getElementById('orderCustomerPhone2').value.trim();
  const gov = document.getElementById('orderGovernorate').value;
  const city = document.getElementById('orderCity').value;
  const addr = document.getElementById('orderAddress').value.trim();
  const amount = parseFloat(document.getElementById('orderAmount').value.trim());
  const weight = parseFloat(document.getElementById('orderWeight').value.trim())||1;
  const notes = document.getElementById('orderNotes').value.trim();
  if(!name||!phone||!gov||!city||!addr||isNaN(amount)||amount<=0) {
    document.getElementById('orderError').textContent='يرجى ملء جميع الحقول المطلوبة.';
    return;
  }
  const productsList = cart.map(item => `${item.name} ${item.size ? '('+item.size+')' : ''} x${item.quantity}`).join(' | ');
  const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  document.getElementById('orderError').textContent='';
  document.getElementById('submitOrderBtn').disabled=true;
  document.getElementById('submitOrderBtn').textContent='جاري الإرسال...';
  const result = await callAPI('addOrder', {
    customerName: name, customerPhone: phone, customerPhone2: phone2,
    governorate: gov, city: city, address: addr, amount: amount,
    weight: weight, notes: notes, products: productsList, totalPrice: totalPrice
  });
  document.getElementById('submitOrderBtn').disabled=false;
  document.getElementById('submitOrderBtn').textContent='تأكيد الطلبية';
  if(result.success) {
    alert('تم إرسال الطلبية بنجاح!');
    cart = []; saveCart();
    ['orderCustomerName','orderCustomerPhone','orderCustomerPhone2','orderAddress','orderAmount','orderNotes'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('orderWeight').value='1';
    document.getElementById('orderGovernorate').value='';
    document.getElementById('orderCity').innerHTML='<option value="">اختر المحافظة أولا</option>';
    closeOrderForm();
  } else {
    document.getElementById('orderError').textContent='فشل إرسال الطلبية: '+(result.error||'خطأ');
  }
}

function openLoginModal(){ document.getElementById('loginModal').classList.add('active'); }
function closeLoginModal(){ document.getElementById('loginModal').classList.remove('active'); }
async function handleLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  if(!phone||!password) return alert('يرجى إدخال رقم الهاتف وكلمة المرور.');
  if(phone === String(CONFIG.ADMIN_PHONE) && password === String(CONFIG.ADMIN_PASSWORD)) {
    alert('مرحباً Admin! تم تسجيل الدخول بنجاح.');
    localStorage.setItem('hl_admin','true'); localStorage.removeItem('hl_user');
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    document.getElementById('adminPanel').style.display='block';
    document.getElementById('adminPanel').classList.add('active');
    closeLoginModal();
    document.querySelectorAll('.delete-prod, .offer-delete').forEach(el=>el.style.display='block');
    return;
  }
  const result = await callAPI('loginUser', {phone,password});
  if(result?.success){ 
    alert('تم تسجيل الدخول بنجاح.'); 
    localStorage.setItem('hl_user','true'); localStorage.removeItem('hl_admin');
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    document.getElementById('adminPanel').style.display='none';
    document.getElementById('adminPanel').classList.remove('active');
    document.querySelectorAll('.delete-prod, .offer-delete').forEach(el=>el.style.display='none');
    closeLoginModal(); 
  }
  else alert('رقم الهاتف أو كلمة المرور غير صحيحة.');
}
function handleLogout() {
  if(!confirm('هل أنت متأكد من تسجيل الخروج؟')) return;
  localStorage.removeItem('hl_admin'); localStorage.removeItem('hl_user');
  document.getElementById('loginBtn').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('adminPanel').classList.remove('active');
  document.querySelectorAll('.delete-prod, .offer-delete').forEach(el=>el.style.display='none');
  alert('تم تسجيل الخروج بنجاح');
}

let zoomData = [];
let zoomIndex = 0;
function openZoom(id) {
  const products = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY_PRODUCTS)||'[]');
  const p = products.find(x=>x.id===id);
  if(!p?.media?.length) return alert('لا توجد صور.');
  zoomData = p.media;
  zoomIndex = 0;
  showZoomItem();
  document.getElementById('zoomModal').classList.add('active');
}
function openOfferZoom(id) {
  const offers = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY_OFFERS)||'[]');
  const o = offers.find(x=>x.id===id);
  if(!o?.media?.length) return alert('لا توجد صور.');
  zoomData = o.media;
  zoomIndex = 0;
  showZoomItem();
  document.getElementById('zoomModal').classList.add('active');
}
function showZoomItem() {
  const content = document.getElementById('zoomContent');
  const m = zoomData[zoomIndex];
  if(!m) return;
  content.innerHTML = `<img src="${m}" alt="zoom">`;
  document.getElementById('zoomCounter').textContent = `${zoomIndex+1} / ${zoomData.length}`;
}
function nextZoom(){ if(zoomIndex<zoomData.length-1){ zoomIndex++; showZoomItem(); } }
function prevZoom(){ if(zoomIndex>0){ zoomIndex--; showZoomItem(); } }
function closeZoom(){ document.getElementById('zoomModal').classList.remove('active'); }

function updateOrderCities() {
  const gov = document.getElementById('orderGovernorate').value;
  const citySel = document.getElementById('orderCity');
  citySel.innerHTML = '<option value="">اختر المدينة</option>';
  if(gov && EGYPT_GOVERNORATES[gov]) {
    EGYPT_GOVERNORATES[gov].forEach(c => { const opt=document.createElement('option'); opt.value=c; opt.textContent=c; citySel.appendChild(opt); });
  }
  updateOrderTotal();
}

function updateOrderTotal() {
  const gov = document.getElementById('orderGovernorate').value;
  const shipping = SHIPPING_COSTS[gov] || 0;
  const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  const total = cartTotal + shipping;
  document.getElementById('orderTotalPrice').textContent = total;
  document.getElementById('orderAmount').value = total;
}

document.addEventListener('DOMContentLoaded', function() {
  const gov = document.getElementById('orderGovernorate');
  if(gov) Object.keys(EGYPT_GOVERNORATES).forEach(g => { const opt=document.createElement('option'); opt.value=g; opt.textContent=g; gov.appendChild(opt); });
  const intro = document.getElementById('intro');
  const video = document.getElementById('introVideo');
  function transitionToStore() {
    if(intro?.classList.contains('hide')) return;
    intro?.classList.add('hide');
    document.body.style.overflow='auto';
    const store = document.getElementById('store');
    store?.classList.add('show');
    setTimeout(loadData, 500);
  }
  setTimeout(transitionToStore, 6000);
  if(video) { video.addEventListener('ended', transitionToStore); video.addEventListener('error', transitionToStore); video.play().catch(transitionToStore); }
  else transitionToStore();
  updateCartCount();
  renderOffers();
  renderAdminOffers();
  if(localStorage.getItem('hl_admin')==='true' || localStorage.getItem('hl_user')==='true') {
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    if(localStorage.getItem('hl_admin')==='true') {
      document.getElementById('adminPanel').style.display='block';
      document.getElementById('adminPanel').classList.add('active');
      document.querySelectorAll('.delete-prod, .offer-delete').forEach(el=>el.style.display='block');
    }
  } else {
    document.getElementById('loginBtn').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
  }
});
