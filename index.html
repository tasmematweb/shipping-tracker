<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Scroll Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية بيضاء بالكامل */
            background-color: #ffffff;
            height: 500vh;
            overflow-x: hidden;
        }

        /* تثبيت الساعة في المنتصف */
        .clock-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* السماح للتوهج بالخروج عن حدود العنصر لمنع أي قص من الأطراف */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* توهج النيون الأزرق */
        .neon-glow {
            filter: drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 14px #00d2ff);
        }

        /* توهج العقرب الأبيض */
        .white-glow {
            filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- توسيع viewBox إلى -40 -40 ليعطي مساحة حرة للتوهج من الأربع جهات -->
        <svg viewBox="-40 -40 380 380">
            <!-- الإطار الخارجي بدون خلفية سوداء (fill="none") -->
            <circle cx="150" cy="150" r="135" fill="none" stroke="#00d2ff" stroke-width="3" class="neon-glow" />

            <!-- علامات الدقائق والساعات -->
            <g id="ticks" stroke="#00d2ff" stroke-linecap="round" class="neon-glow"></g>

            <!-- عقرب الساعات (الأبيض) -->
            <g id="hour-hand" transform="rotate(295 150 150)">
                <polygon points="146,150 154,150 151,85 149,85" fill="#ffffff" class="white-glow" />
            </g>

            <!-- عقرب الدقائق (الأزرق النيون) -->
            <g id="minute-hand" transform="rotate(355 150 150)">
                <line x1="150" y1="185" x2="150" y2="40" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" class="neon-glow" />
            </g>

            <!-- المركز المضيء شفّاف من الداخل -->
            <circle cx="150" cy="150" r="8" fill="#ffffff" stroke="#00d2ff" stroke-width="3.5" class="neon-glow" />
        </svg>
    </div>

    <script>
        // رسم علامات الساعة (60 شرطة)
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const length = isMajor ? 12 : 6;
            const strokeWidth = isMajor ? 2.8 : 1.2;
            const opacity = isMajor ? 1 : 0.75;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", 20 + length);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("opacity", opacity);
            line.setAttribute("transform", `rotate(${angle} 150 150)`);

            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        let targetFraction = 0;
        let currentFraction = 0;

        // تحديث قيمة التمرير عند النزول والطلوع
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            targetFraction = scrollTop / maxScroll;
        });

        // دوّال تنعيم الحركة (Interpolation) لضمان دوران سلس جداً بدون تقطيع
        function animate() {
            // تقريب الحركة بنسبة 10% في كل إطار للحصول على انسيابية فائقة
            currentFraction += (targetFraction - currentFraction) * 0.1;

            const minuteAngle = 355 + (currentFraction * 360 * 12);
            const hourAngle = 295 + (currentFraction * 360);

            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

            requestAnimationFrame(animate);
        }

        // تشغيل حلقة التحريك
        animate();
    </script>
</body>
</html>
