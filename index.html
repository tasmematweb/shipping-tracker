        .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
            .modal-content { margin: 1rem; padding: 1.5rem; }
            .header-container { flex-direction: column; gap: 1rem; text-align: center; }

    </style>
</head>

                        <button type="button" class="btn btn-outline btn-sm" onclick="uploadImage(this)">رفع</button>

<!-- ============================================================ -->
<!-- ===== JAVASCRIPT – الكود الكامل مع الروابط الجديدة ===== -->
<!-- ============================================================ -->
<script>
    // ===================================================================
    // 1.  الإعدادات (CONFIG) — تم تحديث API_BASE_URL بالرابط الجديد
    // ===================================================================
    const CONFIG = {
        // 🔹 رابط Google Apps Script (تم تحديثه بالرابط الجديد)
        API_BASE_URL: 'https://script.google.com/macros/s/AKfycbyE66jL8-UiPIeDLNR0409wY4W6Ni7l9WAcec-qmDP0J6rOiTx4wecZrj3ZOYwVYZDA/exec',

        // 🔹 بيانات Cloudinary — استبدلها بقيمك الفعلية
        CLOUDINARY_CLOUD_NAME: 'your_cloud_name_here',
        CLOUDINARY_UPLOAD_PRESET: 'your_upload_preset_here',

        // 🔹 بيانات دخول المدير
        ADMIN_USERNAME: 'admin',
        ADMIN_PASSWORD: 'ChangeThisPassword123!',

        // 🔹 مفاتيح التخزين المحلي
        STORAGE_KEY_PRODUCTS: 'hl_products',
        STORAGE_KEY_ADMIN: 'hl_is_admin'
    };

    // ===================================================================
    // 2.  الحالة العامة (State)
    // ===================================================================
    let products = [];
    let isAdmin = false;
    let currentZoomImages = [];
    let currentZoomIndex = 0;
    let editingProductId = null;
    let mainImageIndexMap = {};

    // ===================================================================
    // 3.  التهيئة (Initialization)
    // ===================================================================
    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
        checkAdminStatus();
    });

    function checkAdminStatus() {
        isAdmin = localStorage.getItem(CONFIG.STORAGE_KEY_ADMIN) === 'true';
        updateAdminUI();
    }

    function updateAdminUI() {
        const addBtn = document.getElementById('add-product-btn');
        const resetBtn = document.getElementById('reset-products-btn');
        if (addBtn) addBtn.style.display = isAdmin ? 'inline-flex' : 'none';
        if (resetBtn) resetBtn.style.display = isAdmin ? 'inline-flex' : 'none';
    }

    // ===================================================================
    // 4.  تحميل وعرض المنتجات
    // ===================================================================
    async function loadProducts() {
        try {
            // 4a. تحميل من التخزين المحلي أولاً
            const saved = localStorage.getItem(CONFIG.STORAGE_KEY_PRODUCTS);
            if (saved) {
                products = JSON.parse(saved);
                renderStoreProducts();
            }

            // 4b. ثم جلب أحدث البيانات من الخادم
            const res = await fetch(`${CONFIG.API_BASE_URL}?action=getProducts`);
            if (res.ok) {
                const data = await res.json();
                if (data.products && Array.isArray(data.products)) {
                    products = data.products;
                    localStorage.setItem(CONFIG.STORAGE_KEY_PRODUCTS, JSON.stringify(products));
                    renderStoreProducts();
                }
            }
        } catch (error) {
            console.error('خطأ في تحميل المنتجات:', error);
            if (products.length === 0) {
                showAlert('فشل تحميل المنتجات من الخادم، جاري استخدام البيانات المحلية', 'error');
            }
        }
    }

    function renderStoreProducts() {
        const grid = document.getElementById('products-grid');
        if (!grid) return;

        if (products.length === 0) {
            grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:2rem;">لا توجد منتجات</p>';
            return;
        }

        grid.innerHTML = products.map(product => {
            const mainIdx = mainImageIndexMap[product.id] || 0;
            const mainImg = (product.images && product.images.length > 0) ? product.images[mainIdx] : '';
            const thumbs = product.images || [];

            return `
                <div class="product-card" data-product-id="${product.id}">
                    ${mainImg ? `<img src="${mainImg}" alt="${product.name}" class="product-image" onclick="openZoom(${product.id}, ${mainIdx})">` : ''}
                    ${thumbs.length > 1 ? `
                        <div class="product-thumbnails">
                            ${thumbs.map((img, idx) => `
                                <img src="${img}" alt="${product.name}" 
                                     class="product-thumbnail ${idx === mainIdx ? 'active' : ''}" 
                                     onclick="changeMainMedia(${product.id}, ${idx})">
                            `).join('')}
                        </div>
                    ` : ''}
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-price">$${product.price}</div>
                        ${product.description ? `<p class="product-description">${product.description}</p>` : ''}
                        ${isAdmin ? `
                            <div class="product-actions">
                                <button class="btn btn-outline btn-sm" onclick="editProduct(${product.id})">تعديل</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProduct(${product.id})">حذف</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function changeMainMedia(productId, imageIndex) {
        mainImageIndexMap[productId] = imageIndex;
        renderStoreProducts();
    }

    // ===================================================================
    // 5.  عمليات CRUD (إضافة، تعديل، حذف، حذف الكل)
    // ===================================================================
    function showAddProductForm() {
        editingProductId = null;
        document.getElementById('product-modal-title').textContent = 'إضافة منتج';
        document.getElementById('product-form').reset();
        document.getElementById('product-id').value = '';

        const container = document.getElementById('images-container');
        container.innerHTML = `
            <div class="image-row" style="display:flex;gap:0.5rem;margin-bottom:0.5rem;">
                <input type="url" class="form-input image-url" placeholder="رابط الصورة" style="flex:1;">
                <button type="button" class="btn btn-outline btn-sm" onclick="uploadImage(this)">رفع</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="removeImageRow(this)">حذف</button>
            </div>
        `;
        openModal('product-modal');
    }

    function editProduct(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;

        editingProductId = productId;
        document.getElementById('product-modal-title').textContent = 'تعديل منتج';
        document.getElementById('product-id').value = productId;
        document.getElementById('product-name').value = product.name;
        document.getElementById('product-price').value = product.price;
        document.getElementById('product-description').value = product.description || '';

        const container = document.getElementById('images-container');
        container.innerHTML = '';
        if (product.images && product.images.length > 0) {
            product.images.forEach(img => addFileRow(img));
        } else {
            addFileRow('');
        }
        openModal('product-modal');
    }

    async function handleProductSubmit(event) {
        event.preventDefault();

        const productId = document.getElementById('product-id').value;
        const name = document.getElementById('product-name').value;
        const price = parseFloat(document.getElementById('product-price').value);
        const description = document.getElementById('product-description').value;

        const imageInputs = document.querySelectorAll('.image-url');
        const images = Array.from(imageInputs)
            .map(input => input.value.trim())
            .filter(url => url !== '');

        if (images.length === 0) {
            showAlert('يرجى إضافة صورة واحدة على الأقل', 'error');
            return;
        }

        const productData = { name, price, description, images };

        try {
            if (editingProductId) {
                productData.id = editingProductId;
                const res = await fetch(`${CONFIG.API_BASE_URL}?action=updateProduct`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                if (res.ok) {
                    const idx = products.findIndex(p => p.id === editingProductId);
                    if (idx !== -1) {
                        products[idx] = { ...products[idx], ...productData };
                        localStorage.setItem(CONFIG.STORAGE_KEY_PRODUCTS, JSON.stringify(products));
                        renderStoreProducts();
                        showAlert('تم تحديث المنتج بنجاح', 'success');
                    }
                } else {
                    throw new Error('فشل تحديث المنتج');
                }
            } else {
                productData.id = Date.now();
                const res = await fetch(`${CONFIG.API_BASE_URL}?action=addProduct`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                if (res.ok) {
                    products.push(productData);
                    localStorage.setItem(CONFIG.STORAGE_KEY_PRODUCTS, JSON.stringify(products));
                    renderStoreProducts();
                    showAlert('تم إضافة المنتج بنجاح', 'success');
                } else {
                    throw new Error('فشل إضافة المنتج');
                }
            }
            closeModal('product-modal');
        } catch (error) {
            console.error('خطأ في حفظ المنتج:', error);
            showAlert('فشل حفظ المنتج، يرجى المحاولة مرة أخرى', 'error');
        }
    }

    async function deleteProduct(productId) {
        if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

        try {
            const res = await fetch(`${CONFIG.API_BASE_URL}?action=deleteProduct&id=${productId}`, {
                method: 'POST'
            });
            if (res.ok) {
                products = products.filter(p => p.id !== productId);
                delete mainImageIndexMap[productId];
                localStorage.setItem(CONFIG.STORAGE_KEY_PRODUCTS, JSON.stringify(products));
                renderStoreProducts();
                showAlert('تم حذف المنتج بنجاح', 'success');
            } else {
                throw new Error('فشل حذف المنتج');
            }
        } catch (error) {
            console.error('خطأ في الحذف:', error);
            showAlert('فشل حذف المنتج', 'error');
        }
    }

    async function resetProducts() {
        if (!confirm('هل أنت متأكد من حذف جميع المنتجات؟ هذا الإجراء لا يمكن التراجع عنه.')) return;

        try {
            const res = await fetch(`${CONFIG.API_BASE_URL}?action=deleteAllProducts`, {
                method: 'POST'
            });
            if (res.ok) {
                products = [];
                mainImageIndexMap = {};
                localStorage.removeItem(CONFIG.STORAGE_KEY_PRODUCTS);
                renderStoreProducts();
                showAlert('تم حذف جميع المنتجات', 'success');
            } else {
                throw new Error('فشل حذف الكل');
            }
        } catch (error) {
            console.error('خطأ في إعادة الضبط:', error);
            showAlert('فشل حذف المنتجات', 'error');
        }
    }

    // ===================================================================
    // 6.  إدارة الصور (إضافة صفوف، معاينة، رفع عبر Cloudinary)
    // ===================================================================
    function addFileRow(imageUrl = '') {
        const container = document.getElementById('images-container');
        const row = document.createElement('div');
        row.className = 'image-row';
        row.style.cssText = 'display:flex;gap:0.5rem;margin-bottom:0.5rem;';
        row.innerHTML = `
            <input type="url" class="form-input image-url" placeholder="رابط الصورة" style="flex:1;" value="${imageUrl}">
            <button type="button" class="btn btn-outline btn-sm" onclick="uploadImage(this)">رفع</button>
            <button type="button" class="btn btn-danger btn-sm" onclick="removeImageRow(this)">حذف</button>
        `;
        container.appendChild(row);
    }

    function removeImageRow(btn) {
        const row = btn.closest('.image-row');
        if (row) {
            row.remove();
            const container = document.getElementById('images-container');
            if (container.children.length === 0) addFileRow('');
        }
    }

    function uploadImage(btn) {
        if (typeof cloudinary === 'undefined') {
            showAlert('مكتبة Cloudinary غير محملة، يرجى تحديث الصفحة', 'error');
            return;
        }
        if (!CONFIG.CLOUDINARY_CLOUD_NAME || CONFIG.CLOUDINARY_CLOUD_NAME === 'your_cloud_name_here') {
            showAlert('يرجى إعداد بيانات Cloudinary أولاً', 'error');
            return;
        }

        const row = btn.closest('.image-row');
        const input = row.querySelector('.image-url');

        try {
            const widget = cloudinary.createUploadWidget({
                cloudName: CONFIG.CLOUDINARY_CLOUD_NAME,
                uploadPreset: CONFIG.CLOUDINARY_UPLOAD_PRESET,
                multiple: false,
                maxFiles: 1,
                sources: ['local', 'url', 'camera']
            }, (error, result) => {
                if (!error && result && result.event === 'success') {
                    input.value = result.info.secure_url;
                    showAlert('تم رفع الصورة بنجاح', 'success');
                } else if (error) {
                    console.error('Upload error:', error);
                    showAlert('فشل رفع الصورة', 'error');
                }
            });
            widget.open();
        } catch (error) {
            console.error('Error creating upload widget:', error);
            showAlert('فشل فتح نافذة رفع الصور', 'error');
        }
    }

    // ===================================================================
    // 7.  التكبير (Zoom) مع التنقل
    // ===================================================================
    function openZoom(productId, imageIndex = 0) {
        const product = products.find(p => p.id === productId);
        if (!product || !product.images || product.images.length === 0) return;

        currentZoomImages = product.images;
        currentZoomIndex = imageIndex;
        updateZoomImage();
        openModal('zoom-modal');
    }

    function updateZoomImage() {
        const img = document.getElementById('zoom-image');
        const counter = document.getElementById('zoom-counter');
        if (img && currentZoomImages.length > 0) {
            img.src = currentZoomImages[currentZoomIndex];
            counter.textContent = `${currentZoomIndex + 1} / ${currentZoomImages.length}`;
        }
    }

    function navigateZoom(direction) {
        if (currentZoomImages.length === 0) return;
        currentZoomIndex = (currentZoomIndex + direction + currentZoomImages.length) % currentZoomImages.length;
        updateZoomImage();
    }

    // ===================================================================
    // 8.  المصادقة (تسجيل الدخول)
    // ===================================================================
    function openLoginModal() {
        openModal('login-modal');
    }

    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (username === CONFIG.ADMIN_USERNAME && password === CONFIG.ADMIN_PASSWORD) {
            isAdmin = true;
            localStorage.setItem(CONFIG.STORAGE_KEY_ADMIN, 'true');
            updateAdminUI();
            closeModal('login-modal');
            showAlert('تم تسجيل الدخول بنجاح', 'success');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        } else {
            showAlert('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
        }
    }

    // ===================================================================
    // 9.  إدارة النوافذ المنبثقة (Modal)
    // ===================================================================
    function openModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    // إغلاق المودال عند النقر خارج المحتوى
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) {
            e.target.classList.remove('active');
            document.body.style.overflow = '';
        }
    });

    // إغلاق المودال بـ Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal.active').forEach(modal => {
                modal.classList.remove('active');
            });
            document.body.style.overflow = '';
        }
        // التنقل في مودال التكبير بالأسهم
        const zoomModal = document.getElementById('zoom-modal');
        if (zoomModal.classList.contains('active')) {
            if (e.key === 'ArrowLeft') navigateZoom(1);
            if (e.key === 'ArrowRight') navigateZoom(-1);
        }
    });

    // ===================================================================
    // 10. مساعدات واجهة المستخدم (تنبيهات)
    // ===================================================================
    function showAlert(message, type = 'success') {
        const container = document.getElementById('alert-container');
        if (!container) return;

        const alert = document.createElement('div');
        alert.className = `alert alert-${type}`;
        alert.textContent = message;
        container.appendChild(alert);

        setTimeout(() => {
            alert.remove();
        }, 3000);
    }

    console.log('✅ H.L LeVance Store – Frontend ready');
    console.log('📡 API URL:', CONFIG.API_BASE_URL);
</script>
</body>
</html>
