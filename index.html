<body>

<div class="container">

    <!-- ===== حقل البحث ===== -->
    <div class="search-header">
        <input type="text" id="searchInput" placeholder="🔍 ابحث باسم العميل أو رقم الهاتف..." oninput="filterShipments()">
        <button class="search-btn" onclick="filterShipments()">بحث</button>
        <button class="clear-btn" onclick="clearSearch()">مسح</button>
    </div>

    <div id="resultCount" class="result-count"></div>

    <!-- ===== حاوية البطاقات ===== -->
    <div id="cardsContainer">
        <!-- سيتم ملؤها بواسطة JavaScript -->
    </div>

</div>

<!-- ===== المودال ===== -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">✕</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================
    //  بيانات وهمية للشحنات
    // ============================================================
    let allShipments = [
        { id: 'SH-001', name: 'أحمد محمد', phone: '01012345678', city: 'القاهرة', amount: '250', status: 'تم التسليم', tracking: 'JEG123456789', governorate: 'القاهرة', address: 'شارع النيل', notes: 'الرجاء الاتصال قبل التسليم' },
        { id: 'SH-002', name: 'سارة علي', phone: '01123456789', city: 'الإسكندرية', amount: '180', status: 'قيد التوصيل', tracking: 'JEG987654321', governorate: 'الإسكندرية', address: 'شارع البحر', notes: '' },
        { id: 'SH-003', name: 'محمد إبراهيم', phone: '01234567890', city: 'الجيزة', amount: '320', status: 'تم التسليم', tracking: '', governorate: 'الجيزة', address: 'شارع الهرم', notes: 'تسليم يد بيد' },
        { id: 'SH-004', name: 'فاطمة حسن', phone: '01098765432', city: 'الشرقية', amount: '150', status: 'قيد التوصيل', tracking: 'JEG555555555', governorate: 'الشرقية', address: 'شارع الزراعة', notes: '' },
        { id: 'SH-005', name: 'خالد سعيد', phone: '01187654321', city: 'القاهرة', amount: '450', status: 'تم التسليم', tracking: 'JEG444444444', governorate: 'القاهرة', address: 'شارع المعادي', notes: 'شقة 3' },
        { id: 'SH-006', name: 'نورا يوسف', phone: '01234561234', city: 'الإسكندرية', amount: '210', status: 'قيد التوصيل', tracking: '', governorate: 'الإسكندرية', address: 'شارع سيدي جابر', notes: '' },
        { id: 'SH-007', name: 'عمر محمود', phone: '01056781234', city: 'الجيزة', amount: '380', status: 'تم التسليم', tracking: 'JEG333333333', governorate: 'الجيزة', address: 'شارع فيصل', notes: 'الدور الثاني' },
        { id: 'SH-008', name: 'ليلى كريم', phone: '01123457890', city: 'القليوبية', amount: '120', status: 'قيد التوصيل', tracking: '', governorate: 'القليوبية', address: 'شارع بنها', notes: '' }
    ];

    // ============================================================
    //  عرض البطاقات - كل بطاقة عبارة عن نموذج subscribe
    // ============================================================
    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        const countEl = document.getElementById('resultCount');

        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🔍</div>
                    <p>❌ لا توجد شحنات تطابق بحثك</p>
                </div>
            `;
            countEl.classList.remove('show');
            return;
        }

        countEl.textContent = `✅ تم العثور على ${data.length} شحنة`;
        countEl.classList.add('show');

        container.innerHTML = data.map((s, index) => {
            let statusClass = 'status-waiting';
            if (s.status === 'تم التسليم') statusClass = 'status-done';
            else if (s.status === 'قيد التوصيل') statusClass = 'status-tracking';

            const hasTracking = s.tracking && s.tracking.length > 3;
            const highlight = index === 0 ? ' highlight' : '';

            return `
                <div class="subscribe${highlight}" data-id="${s.id}">
                    <!-- السطر العلوي: الاسم + رقم الهاتف -->
                    <div class="header-row">
                        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                            <span class="name">👤 ${s.name}</span>
                            <span class="phone">📱 ${s.phone}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span class="amount">${s.amount} ج.م</span>
                            <span class="status-badge ${statusClass}">${s.status}</span>
                        </div>
                    </div>

                    <!-- معلومات إضافية -->
                    <div class="info-row">
                        <span><strong>رقم الشحنة:</strong> ${s.id}</span>
                        <span><strong>المحافظة:</strong> ${s.governorate || ''}</span>
                        <span><strong>المدينة:</strong> ${s.city || ''}</span>
                        ${s.tracking ? `<span><strong>رقم التتبع:</strong> ${s.tracking}</span>` : ''}
                    </div>

                    <!-- حالة التتبع -->
                    <div class="status-row">
                        <span class="label">📍 الحالة:</span>
                        <span class="value">${hasTracking ? '⏳ جاري التحميل...' : 'لم يتم التحديد بعد'}</span>
                    </div>

                    <!-- زر التتبع في الأسفل -->
                    <button class="submit-btn" onclick="trackShipment('${s.tracking || ''}', '${s.id}')">
                        📍 تتبع
                    </button>
                </div>
            `;
        }).join('');

        // التمرير لأول نتيجة
        const firstResult = document.querySelector('.subscribe.highlight');
        if (firstResult) {
            setTimeout(() => {
                firstResult.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }
    }

    // ============================================================
    //  البحث
    // ============================================================
    function filterShipments() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        
        if (!query) {
            renderCards(allShipments);
            return;
        }

        const filtered = allShipments.filter(s => {
            const name = s.name.toLowerCase();
            const phone = s.phone.toLowerCase();
            const id = s.id.toLowerCase();
            const city = (s.city || '').toLowerCase();
            const gov = (s.governorate || '').toLowerCase();
            return name.includes(query) || phone.includes(query) || id.includes(query) || 
                   city.includes(query) || gov.includes(query);
        });

        renderCards(filtered);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderCards(allShipments);
        document.getElementById('searchInput').focus();
    }

    // ============================================================
    //  تتبع شحنة
    // ============================================================
    async function trackShipment(trackingNumber, shipmentId) {
        if (!trackingNumber || trackingNumber.length < 3) {
            showToast('⚠️ هذه الشحنة لا يوجد بها رقم تتبع', 'error');
            return;
        }

        document.getElementById('modal').classList.add('show');
        document.getElementById('modalBody').innerHTML = `
            <div style="text-align:center;padding:30px;">
                <div style="border:4px solid #e8ecf0;border-top:4px solid #0076ff;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 10px;"></div>
                <p>جاري تتبع الشحنة...</p>
            </div>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        `;

        try {
            // محاكاة طلب التتبع
            await new Promise(resolve => setTimeout(resolve, 1200));
            
            const details = [
                { time: '2026-07-27 10:30', desc: 'تم استلام الشحنة من المرسل', location: 'مدينة العبور' },
                { time: '2026-07-27 12:00', desc: 'تم الفرز والتجهيز', location: 'مركز الفرز الرئيسي' },
                { time: '2026-07-27 14:45', desc: 'الشحنة في طريقها للتوصيل', location: 'في الطريق' }
            ];

            let html = `
                <h3><i class="fas fa-map-marked-alt"></i> مسار الشحنة</h3>
                <div style="background:#e8f5e9;padding:10px 16px;border-radius:10px;margin-bottom:16px;border-right:4px solid #2e7d32;">
                    <strong style="color:#2e7d32;">📍 الحالة الحالية:</strong>
                    <span style="color:#2e7d32;font-weight:700;">في الطريق للتوصيل</span>
                </div>
            `;

            details.forEach(d => {
                html += `
                    <div class="timeline-item">
                        <div class="time">🕐 ${d.time}</div>
                        <div class="event">📌 ${d.desc}</div>
                        <div class="location">📍 ${d.location}</div>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = html;

            // تحديث حالة البطاقة
            const card = document.querySelector(`.subscribe[data-id="${shipmentId}"]`);
            if (card) {
                const statusValue = card.querySelector('.status-row .value');
                if (statusValue) {
                    statusValue.textContent = '✅ في الطريق للتوصيل';
                    statusValue.style.color = '#0d47a1';
                }
            }

        } catch (e) {
            document.getElementById('modalBody').innerHTML = `
                <h3><i class="fas fa-map-marked-alt"></i> تتبع الشحنة</h3>
                <div style="text-align:center;padding:20px;color:#dc3545;">
                    <div style="font-size:48px;margin-bottom:12px;">❌</div>
                    <p>فشل تتبع الشحنة</p>
                </div>
            `;
        }
    }

    // ============================================================
    //  دوال مساعدة
    // ============================================================
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }

    function showToast(message, type) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' ' + type : '');
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ============================================================
    //  أحداث
    // ============================================================
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') filterShipments();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    // ============================================================
    //  تحميل الصفحة
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        renderCards(allShipments);
    });
</script>

</body>
</html>
