<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زر تتبع متطور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f4fa;
            font-family: 'Cairo', sans-serif;
            margin: 0;
        }

        .demo-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .demo-card h3 {
            color: #0d2137;
            margin-bottom: 30px;
        }

        .demo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .demo-label {
            font-size: 16px;
            font-weight: 600;
            color: #555;
        }

        /* ===== زر التتبع المتطور (Spinner) ===== */
        .track-btn-spinner {
            position: relative;
            border-radius: 50%;
            height: 48px;
            width: 48px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
            padding: 0;
            transition: transform 0.25s ease;
        }

        /* الحلقات الملونة الدوارة */
        .track-btn-spinner .ring {
            position: absolute;
            border-radius: 50%;
            height: 100%;
            width: 100%;
            animation: rotate_3922 1.2s linear infinite;
        }
        .track-btn-spinner .ring:nth-of-type(1) {
            background: linear-gradient(135deg, #9b59b6, #84cdfa, #5ad1cd);
            filter: blur(2px);
        }
        .track-btn-spinner .ring:nth-of-type(2) {
            background: linear-gradient(135deg, #9b59b6, #84cdfa, #5ad1cd);
            filter: blur(4px);
            animation-duration: 1.4s;
        }
        .track-btn-spinner .ring:nth-of-type(3) {
            background: linear-gradient(135deg, #9b59b6, #84cdfa, #5ad1cd);
            filter: blur(10px);
            animation-duration: 1.6s;
        }
        .track-btn-spinner .ring:nth-of-type(4) {
            background: linear-gradient(135deg, #9b59b6, #84cdfa, #5ad1cd);
            filter: blur(20px);
            animation-duration: 1.8s;
        }

        /* الدائرة البيضاء الداخلية - ثابتة */
        .track-btn-spinner .inner-circle {
            position: relative;
            z-index: 5;
            background: white;
            border-radius: 50%;
            height: 74%;
            width: 74%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
        }

        /* كلمة "تتبع" - ثابتة داخل الدائرة البيضاء */
        .track-btn-spinner .track-text {
            font-size: 12px;
            font-weight: 800;
            color: #0d2137;
            font-family: 'Cairo', sans-serif;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
            z-index: 10;
        }
        .track-btn-spinner .track-text i {
            font-size: 10px;
            color: #9b59b6;
        }

        /* دوران الحلقات فقط */
        @keyframes rotate_3922 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* تأثير hover */
        .track-btn-spinner:hover {
            transform: scale(1.1);
        }
        .track-btn-spinner:active {
            transform: scale(0.92);
        }

        .note {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #e8ecf0;
        }
        .note i {
            color: #9b59b6;
        }
    </style>
</head>
<body>

    <div class="demo-card">
        <h3>🔄 زر تتبع متطور</h3>

        <div class="demo-row">
            <span class="demo-label"> 01012345678</span>

            <!-- الزر -->
            <button class="track-btn-spinner" onclick="alert('جاري تتبع الشحنة...')">
                <span class="ring"></span>
                <span class="ring"></span>
                <span class="ring"></span>
                <span class="ring"></span>
                <span class="inner-circle">
                    <span class="track-text"><i class="fas fa-location-dot"></i> تتبع</span>
                </span>
            </button>

            <span class="demo-label"> 150 ج.م</span>
        </div>

        <div class="note">
            <i class="fas fa-info-circle"></i> الحلقات الملونة تدور، وكلمة "تتبع" ثابتة داخل الدائرة البيضاء
        </div>
    </div>

</body>
</html>
