<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H.L. LeVance · Intro</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    /* --- RESET & BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7e5c2;  /* fallback */
      font-family: 'Tajawal', sans-serif;
    }

    /* --- الخلفية الذهبية الناعمة (مطابقة للشعار) --- */
    .intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f3dba8;  /* قاعدة دافئة */
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 215, 140, 0.3) 0%, transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(230, 190, 120, 0.2) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(200, 160, 100, 0.03) 0px, rgba(200, 160, 100, 0.03) 2px, transparent 2px, transparent 6px);
      background-color: #f3dba8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1000;
      transition: opacity 0.6s ease;
    }

    /* --- حاوية الشعار (مركزة) --- */
    .logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      height: fit-content;
      /* نطبق التحويلات على هذه الحاوية */
      transform: translateX(-120vw); /* البداية خارج الشاشة يساراً */
      transition: none; /* سنستخدم GSAP أو animation يدوية، لكننا سنطبقها عبر JS */
    }

    /* --- عناصر الشعار --- */
    .logo-text {
      display: flex;
      align-items: baseline;
      gap: 0.1rem;
      background: transparent;
      color: #3d2b1a;  /* لون نبيتي غامق */
      font-family: 'Tajawal', sans-serif;
      letter-spacing: 0.04em;
      position: relative;
    }

    .hl-part {
      font-size: 4.2rem;
      font-weight: 800;
      background: #3d2b1a;
      color: #f3dba8;
      padding: 0.1rem 1.2rem 0.1rem 1.1rem;
      border-radius: 60px;
      box-shadow: 0 2px 0 #b8860b;
      line-height: 1.2;
      margin-left: 0.2rem;
    }

    .levance-part {
      font-size: 4.8rem;
      font-weight: 800;
      color: #3d2b1a;
      letter-spacing: 0.06rem;
      line-height: 1.2;
      position: relative;
    }

    /* --- الجزر (carrot) فوق حرف C --- */
    .carrot {
      position: absolute;
      top: -0.85rem;
      right: -0.15rem;  /* فوق حرف C مباشرة */
      font-size: 2.6rem;
      line-height: 1;
      color: #d48f2b;   /* لون جزر دافئ (من الشعار) */
      transform: scale(1) rotate(0deg);
      opacity: 0;       /* مخفي في البداية */
      transition: none;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.05));
    }

    /* --- تنسيق استجابة --- */
    @media (max-width: 700px) {
      .hl-part {
        font-size: 2.8rem;
        padding: 0.1rem 0.8rem 0.1rem 0.7rem;
      }
      .levance-part {
        font-size: 3.2rem;
      }
      .carrot {
        font-size: 1.8rem;
        top: -0.6rem;
        right: -0.1rem;
      }
    }

    @media (max-width: 480px) {
      .hl-part {
        font-size: 2.2rem;
        padding: 0.1rem 0.6rem;
      }
      .levance-part {
        font-size: 2.6rem;
      }
      .carrot {
        font-size: 1.4rem;
        top: -0.5rem;
        right: -0.05rem;
      }
    }

    /* ---- اختفاء intro بعد الإنتهاء ---- */
    .intro-screen.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }
  </style>
</head>
<body>

  <!-- شاشة الترحيب (intro) -->
  <div class="intro-screen" id="introScreen">
    <div class="logo-wrapper" id="logoWrapper">
      <div class="logo-text" id="logoText">
        <span class="hl-part">H.L</span>
        <span class="levance-part">
          LeVance
          <span class="carrot" id="carrot">🥕</span>
        </span>
      </div>
    </div>
  </div>

  <!-- المحتوى الرئيسي (يظهر بعد intro) -->
  <div style="display:none;" id="mainContent">
    <!-- هنا يمكنك وضع موقعك الحقيقي -->
  </div>

  <!-- GSAP (الأنيميشن الاحترافي) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const introScreen = document.getElementById('introScreen');
      const logoWrapper = document.getElementById('logoWrapper');
      const carrot = document.getElementById('carrot');

      // تأكد من أن البداية خارج الشاشة يساراً (تم ضبطها في CSS)
      // نضبط GSAP timeline

      const tl = gsap.timeline({
        defaults: { ease: 'power3.out' },
        onComplete: () => {
          // بعد إنتهاء الأنيميشن بالكامل، نطفئ intro
          setTimeout(() => {
            introScreen.classList.add('fade-out');
            // اختياري: إظهار المحتوى الرئيسي
            document.getElementById('mainContent').style.display = 'block';
          }, 300);
        }
      });

      // 1. دخول الشعار من اليسار إلى المركز (مع overshoot طفيف)
      tl.to(logoWrapper, {
        x: '0%',   // نصل إلى المركز
        duration: 1.1,
        ease: 'power3.inOut',  // منحنى سينمائي: سريع ثم تباطؤ
        // نضيف overshoot طفيف عبر ease: "power3.out" مع تعديل
        // لكن نستخدم custom ease لتحقيق feel فاخر
        // نطبق overshoot عبر كرنفال
        overwrite: 'auto'
      }, 0);

      // 2. تأثير ارتداد طفيف (overshoot) عبر تعديل x مرتين
      // نضيف حركة دقيقة جداً للارتداد
      tl.to(logoWrapper, {
        x: '-0.6%',    // ارتداد يسار طفيف جداً
        duration: 0.15,
        ease: 'power1.inOut'
      }, 1.15);
      tl.to(logoWrapper, {
        x: '0.2%',     // ارتداد يمين
        duration: 0.12,
        ease: 'power1.inOut'
      }, 1.30);
      tl.to(logoWrapper, {
        x: '0%',       // استقرار نهائي
        duration: 0.1,
        ease: 'power1.out'
      }, 1.42);

      // 3. pause قصير قبل قفزة الجزر (100-150ms)
      tl.add(() => {}, 1.55); // علامة فارغة

      // 4. قفزة الجزر (carrot) مع مسار منحني ودوران
      // نحضر الجزر: يبدأ من أسفل الشعار (نخفي البداية)
      // نضبط موضع البداية: تحت الشعار مباشرة
      const carrotStartX = 0;  // سنتحكم عبر transform
      const carrotStartY = 40; // تحت الشعار

      // نضع الجزر في البداية أسفل الشعار (مخفي)
      gsap.set(carrot, {
        opacity: 0,
        y: 40,
        x: 0,
        rotation: 0,
        scale: 0.6
      });

      // نجعل الجزر يظهر مع قفزة من أسفل إلى أعلى (فوق C)
      // المسار: قوس بسيط عبر x و y مع دوران
      tl.to(carrot, {
        opacity: 1,
        y: -38,      // يرتفع إلى فوق الشعار
        x: -2,       // حركة جانبية بسيطة لإحساس القوس
        rotation: 12, // دوران طفيف أثناء الصعود
        scale: 1.2,
        duration: 0.55,
        ease: 'power2.out'
      }, 1.65);

      // 5. الهبوط إلى الموضع النهائي فوق حرف C مع ارتداد (bounce)
      tl.to(carrot, {
        y: -46,      // الموضع النهائي فوق C
        x: 0,
        rotation: 0,  // يستقر بدون دوران
        scale: 1.0,
        duration: 0.35,
        ease: 'back.out(1.4)',  // ارتداد خفيف جداً
        overwrite: 'auto'
      }, 2.25);

      // 6. ارتداد صغير جداً في الحجم (bounce landing)
      tl.to(carrot, {
        scale: 1.12,
        duration: 0.12,
        ease: 'power1.out'
      }, 2.62);
      tl.to(carrot, {
        scale: 1.0,
        duration: 0.15,
        ease: 'power1.inOut'
      }, 2.76);

      // 7. تثبيت نهائي
      tl.set(carrot, {
        scale: 1,
        rotation: 0,
        y: -46,
        x: 0,
        opacity: 1
      }, 2.92);

      // (اختياري) نضيف إشارة إلى أن الأنيميشن انتهى
      // ويمكننا أيضاً إخفاء intro بعد فترة
      // لكننا نستخدم onComplete أعلاه

      // تصحيح: في حال أردنا أن يظهر الشعار في المنتصف تماماً
      // نضمن أن logoWrapper في المنتصف
      // كل شيء جاهز

      // إضافة دعم للشاشات الصغيرة: نعدل قيم y للجزر
      function adjustCarrotPosition() {
        const width = window.innerWidth;
        let carrotY = -46;
        let carrotSize = 2.6;
        if (width < 700) {
          carrotY = -32;
          carrotSize = 1.8;
        }
        if (width < 480) {
          carrotY = -28;
          carrotSize = 1.4;
        }
        // نطبق التعديل على الأنيميشن النهائي
        // لكن بما أننا استخدمنا قيم ثابتة، نعدل الـ timeline
        // لكن الأنيميشن قد بدأ, نضبط القيم بطريقة ديناميكية
        // الحل: نعيد تشغيل الأنيميشن مع القيم المتغيرة؟ 
        // لكن الأسهل: نعدل في الـ CSS media queries ونضبط القيم النهائية
        // ونضمن أن القفزة تتناسب
        // تم ضبط media queries مسبقاً
      }

      // ننفذ عند التحميل
      adjustCarrotPosition();
      window.addEventListener('resize', adjustCarrotPosition);

      // نمنع أي تفاعل مع intro بعد الأنيميشن
      // تم بالفعل

    });
  </script>

  <!-- إضافة دعم للشاشات الصغيرة عبر CSS media queries (موجود) -->

  <!-- ملاحظة: تم الحفاظ على الشعار كما هو بالضبط بدون تغيير -->
  <!-- الألوان والخط والجزر مطابقة للمرجع -->
</body>
</html>
