<body>

<!-- ===== صفحة الهبوط ===== -->
<div id="landingPage" class="landing-page">
    <div class="logo">EUX EXPRESS</div>
    <h1>شركة <span>EUX</span> للشحن</h1>
    <p>الريادة في سرعة وحلول الشحن. نقدم خدماتنا من مدينة العبور إلى جميع محافظات مصر.</p>
    <div>
        <button class="btn" onclick="openTrackingSystem()"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
    </div>
</div>

<!-- ===== نظام التتبع ===== -->
<div id="trackingApp" class="tracking-app hidden">

    <!-- ===== تسجيل الدخول ===== -->
    <div id="loginPage" class="login-page">
        <div class="brand">مرحباً بك في <span>EUX Express</span></div>
        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="رقم الهاتف" dir="ltr" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="كلمة المرور" dir="ltr">
        </div>
        <button class="btn-eux" onclick="doLogin()" style="width:100%;max-width:380px;padding:16px;font-size:18px;border-radius:14px;justify-content:center;">
            <i class="fas fa-sign-in-alt"></i> دخول
        </button>
        <button class="btn-eux-outline" onclick="backToLanding()" style="width:100%;max-width:380px;margin-top:10px;padding:14px;border-radius:12px;justify-content:center;">
            🏠 العودة للصفحة الرئيسية
        </button>
        <p class="error-msg hidden" id="loginError"></p>
    </div>

    <!-- ===== لوحة التحكم ===== -->
    <div id="dashboard" class="hidden">
        <div class="dashboard-header">
            <div>
                <h2><i class="fas fa-tachometer-alt"></i> لوحة التحكم</h2>
                <span class="total">إجمالي الشحنات: <span id="totalCountSmall">0</span></span>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <i class="fas fa-search" style="color:#888;"></i>
                    <input type="text" id="searchInput" placeholder="بحث باسم أو رقم هاتف...">
                    <button onclick="searchShipments()">بحث</button>
                    <button class="clear-btn" onclick="clearSearch()">إلغاء</button>
                </div>
                <button id="shareLinkBtn" class="btn-eux-orange hidden" onclick="copyShareLink()" style="font-size:12px;padding:8px 12px;">
                    📤 رابط التسجيل
                </button>
                <button id="addShipmentBtn" class="btn-eux-green hidden" onclick="showAddShipmentForm()">
                    ➕ إضافة شحنة
                </button>
                <button id="clientsBtn" class="btn-eux hidden" onclick="showClients()">
                    👥 عملاء
                </button>
                <button id="allShipmentsBtn" class="btn-eux-orange hidden" onclick="loadAllShipments()">
                    📋 الكل
                </button>
                <button class="btn-eux-outline" onclick="logout()">
                    🚪 خروج
                </button>
            </div>
        </div>
        <div id="content"></div>
    </div>
</div>

<!-- ===== المودال ===== -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">✕</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    // ============================================================

    // ============================================================
    //  التنقل بين الصفحات
    // ============================================================
    function openTrackingSystem() {
        document.getElementById('landingPage').classList.add('hidden');
        document.getElementById('trackingApp').classList.remove('hidden');
        document.body.style.background = 'linear-gradient(135deg, #e8f0fe, #d4e4f7)';
        if (!checkSession()) {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
        }
    }

    function backToLanding() {
        document.getElementById('trackingApp').classList.add('hidden');
        document.getElementById('landingPage').classList.remove('hidden');
        document.body.style.background = '#f0f4fa';
    }

    // ============================================================
    //  حفظ الجلسة
    // ============================================================
    function saveUserSession(userData) {
        try {
            sessionStorage.setItem('eux_user', JSON.stringify(userData));
            localStorage.setItem('eux_user_data', JSON.stringify(userData));
        } catch (e) { console.log('خطأ في حفظ الجلسة:', e); }
    }

    function getSavedUser() {
        try {
            const sessionUser = sessionStorage.getItem('eux_user');
            if (sessionUser) return JSON.parse(sessionUser);
            const localUser = localStorage.getItem('eux_user_data');
            return localUser ? JSON.parse(localUser) : null;
        } catch (e) { return null; }
    }

    function clearUserSession() {
        sessionStorage.removeItem('eux_user');
        localStorage.removeItem('eux_user_data');
    }

    function checkSession() {
        const savedUser = getSavedUser();
        if (savedUser && savedUser.phone && savedUser.password) {
            currentUser = savedUser;
            showDashboard();
            return true;
        }
        return false;
    }

    // ============================================================
    //  تسجيل الدخول
    // ============================================================
    async function doLogin() {
        const phone = document.getElementById('phoneInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.add('hidden');

        if (!phone || !password) {
            errorDiv.textContent = "يرجى إدخال رقم الهاتف وكلمة المرور";
            errorDiv.classList.remove('hidden');
            return;
        }
        if (phone.length !== 11) {
            errorDiv.textContent = "⚠️ رقم الهاتف يجب أن يكون 11 رقم";
            errorDiv.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch(`${API_URL}?action=login&phone=${phone}&password=${password}`);
            const data = await res.json();
            if (data.success) {
                currentUser = { phone, password, name: data.name, role: data.role };
                saveUserSession(currentUser);
                showDashboard();
            } else {
                errorDiv.textContent = data.msg || "فشل تسجيل الدخول";
                errorDiv.classList.remove('hidden');
            }
        } catch (e) {
            errorDiv.textContent = "فشل الاتصال";
            errorDiv.classList.remove('hidden');
        }
    }

    function logout() {
        currentUser = null;
        trackingCache = {};
        clearUserSession();
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('phoneInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('loginError').classList.add('hidden');
        showToast('تم تسجيل الخروج', '');
    }

    function showDashboard() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        const isAdmin = currentUser.role === 'admin';
        document.getElementById('shareLinkBtn').classList.toggle('hidden', isAdmin);
        document.getElementById('addShipmentBtn').classList.toggle('hidden', isAdmin);
        document.getElementById('clientsBtn').classList.toggle('hidden', !isAdmin);
        document.getElementById('allShipmentsBtn').classList.toggle('hidden', !isAdmin);
        if (isAdmin) loadAllShipments();
        else loadMyShipments();
    }

    // ============================================================
    //  نسخ رابط التسجيل
    // ============================================================
    function copyShareLink() {
        const shareUrl = `${BASE_URL}/?ref=${currentUser.phone}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl).then(() => showToast('تم نسخ رابط التسجيل!', 'success'));
        } else {
            // طريقة بديلة
            const textarea = document.createElement('textarea');
            textarea.value = shareUrl;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('تم نسخ رابط التسجيل!', 'success');
        }
    }

    // ============================================================
    //  تتبع الشحنات
    // ============================================================
    async function fetchTrackingStatus(trackingNumber) {
        if (!trackingNumber || trackingNumber.length < 3) return null;
        if (trackingCache[trackingNumber]) return trackingCache[trackingNumber];
        try {
            const res = await fetch(`${API_URL}?action=track&billCode=${trackingNumber}`);
            const data = await res.json();
            if (data.code === "1" && data.data && data.data[0]) {
                let finalStatus = data.data[0].status || null;
                const details = data.data[0].details || [];
                for (const d of details) {
                    if ((d.desc || '').includes('تم التسليم')) {
                        finalStatus = 'تم التسليم';
                        break;
                    }
                }
                trackingCache[trackingNumber] = finalStatus;
                return finalStatus;
            }
            trackingCache[trackingNumber] = null;
            return null;
        } catch (e) {
            console.error('فشل تتبع:', trackingNumber, e);
            return null;
        }
    }

    function updateShipmentStatusCard(shipmentId, status) {
        const card = document.getElementById(`card-${shipmentId}`);
        if (!card) return;
        const statusRow = card.querySelector('.status-row');
        if (!statusRow) return;
        statusRow.classList.remove('loading-status', 'error-status');
        const statusValue = statusRow.querySelector('.status-value');
        const statusLabel = statusRow.querySelector('.status-label');
        if (status) {
            statusLabel.textContent = 'الحالة الحالية:';
            let displayStatus = status;
            let isSuccess = status.includes('تم التسليم');
            let isError = status.includes('خطأ') || status.includes('Error');
            if (isSuccess) {
                statusRow.style.background = '#e8f5e9';
                statusRow.style.borderRightColor = '#2e7d32';
                statusValue.style.color = '#2e7d32';
            } else if (isError) {
                statusRow.style.background = '#ffeaea';
                statusRow.style.borderRightColor = '#dc3545';
                statusValue.style.color = '#dc3545';
                statusRow.classList.add('error-status');
            } else {
                statusRow.style.background = '#e3f2fd';
                statusRow.style.borderRightColor = '#0d47a1';
                statusValue.style.color = '#0d47a1';
            }
            statusValue.textContent = displayStatus;
        } else {
            statusLabel.textContent = 'الحالة:';
            statusRow.style.background = '#f5f5f5';
            statusRow.style.borderRightColor = '#999';
            statusValue.style.color = '#999';
            statusValue.textContent = 'لم يتم التحديد بعد';
        }
    }

    async function updateAllTrackingStatuses(shipments) {
        const shipmentsWithTracking = shipments.filter(s => s.trackingNumber && s.trackingNumber.length > 3);
        if (shipmentsWithTracking.length === 0) return;
        for (const s of shipmentsWithTracking) {
            const status = await fetchTrackingStatus(s.trackingNumber);
            updateShipmentStatusCard(s.id, status);
        }
    }

    // ============================================================
    //  تحميل الشحنات
    // ============================================================
    async function loadMyShipments() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';
        try {
            const res = await fetch(`${API_URL}?action=myShipments&phone=${currentUser.phone}&password=${currentUser.password}`);
            const data = await res.json();
            if (data.success) {
                allShipmentsData = data.shipments || [];
                if (allShipmentsData.length === 0) {
                    content.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>لا توجد شحنات حتى الآن</p></div>';
                    document.getElementById('totalCountSmall').textContent = '0';
                } else {
                    document.getElementById('totalCountSmall').textContent = allShipmentsData.length;
                    renderShipments(allShipmentsData);
                    updateAllTrackingStatuses(allShipmentsData);
                }
            } else {
                content.innerHTML = '<p style="color:red;">' + (data.msg || 'فشل التحميل') + '</p>';
            }
        } catch (e) {
            content.innerHTML = '<p style="color:red;">فشل الاتصال</p>';
        }
    }

    async function loadAllShipments() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';
        try {
            const params = new URLSearchParams();
            params.append('action', 'allShipments');
            params.append('adminPhone', currentUser.phone);
            params.append('adminPassword', currentUser.password);
            const res = await fetch(API_URL, { method: 'POST', body: params });
            const data = await res.json();
            if (data.success) {
                allShipmentsData = data.shipments || [];
                document.getElementById('totalCountSmall').textContent = allShipmentsData.length;
                renderShipments(allShipmentsData);
                updateAllTrackingStatuses(allShipmentsData);
            } else {
                content.innerHTML = '<p style="color:red;">' + (data.msg || 'فشل التحميل') + '</p>';
            }
        } catch (e) {
            content.innerHTML = '<p style="color:red;">فشل الاتصال</p>';
        }
    }

    // ============================================================
    //  عرض بطاقة الشحنة
    // ============================================================
    function createShipmentCard(s, isAdmin = false) {
        let statusClass = 'status-waiting';
        let statusText = s.status || '';
        if (statusText.includes('تتبع')) statusClass = 'status-tracking';
        else if (statusText.includes('تم')) statusClass = 'status-done';
        else if (!statusText) statusClass = 'status-waiting';
        
        let lastUpdate = s.lastUpdate || s.date || '';
        let updateText = lastUpdate ? 'آخر تحديث: ' + lastUpdate : '';
        let actions = '';
        const trackingNum = s.trackingNumber || '';

        // زر التتبع المتطور
        let trackButton = '';
        if (trackingNum && trackingNum.length > 3) {
            trackButton = `
                <button class="track-btn-spinner" onclick="event.stopPropagation(); trackShipment('${trackingNum}')">
                    <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
                    <span class="inner-circle">
                        <span class="track-text">تتبع</span>
                    </span>
                </button>
            `;
        }

        // أزرار التعديل والحذف للعميل (تظهر فقط قبل إضافة رقم التتبع)
        if (!isAdmin && (!trackingNum || trackingNum.length < 3)) {
            actions += `
                <button class="btn-eux-orange" onclick="event.stopPropagation(); showEditShipmentForm('${s.id}')">
                    ✏️ تعديل
                </button>
                <button class="btn-eux-red" onclick="event.stopPropagation(); deleteShipment('${s.id}')">
                    🗑️ حذف
                </button>
            `;
        }

        // أزرار للمشرف
        if (isAdmin) {
            if (!trackingNum || trackingNum.length < 3) {
                actions += `<button class="btn-eux-green" onclick="event.stopPropagation(); showAddTracking('${s.id}')">🔢 إضافة تتبع</button>`;
            }
            actions += `<button class="btn-eux-red" onclick="event.stopPropagation(); deleteShipment('${s.id}')">🗑️ حذف</button>`;
        }

        const displayName = s.receiverName || s.customerName || 'غير معروف';
        const displayPhone = s.receiverPhone || s.customerPhone || '';
        const displayAmount = s.amount || '0';
        const hasTracking = trackingNum && trackingNum.length > 3;
        const badgeHTML = statusText ? `<span class="status-badge ${statusClass}">${statusText}</span>` : '';

        let adminDetails = '';
        if (isAdmin) {
            adminDetails = `
                <div class="info"><strong>رقم الشحنة:</strong> ${s.id}</div>
                ${trackingNum ? `<div class="info"><strong>رقم التتبع:</strong> ${trackingNum}</div>` : ''}
                <div class="info"><strong>رقم العميل:</strong> ${s.clientPhone || 'غير معروف'}</div>
            `;
        }

        return `<div class="shipment-card" onclick="toggleDetails(this)" id="card-${s.id}">
            ${badgeHTML}
            <div class="summary-row">
                <div class="main-info">
                    <span class="name">${displayName}</span>
                    <span class="phone">${displayPhone}</span>
                    ${trackButton}
                    <span class="amount">${displayAmount} ج.م</span>
                </div>
                <div class="last-update">${updateText}</div>
            </div>
            <div class="status-row${hasTracking ? ' loading-status' : ''}">
                <span class="status-label">الحالة:</span>
                <span class="status-value">${hasTracking ? '⏳ جاري التحميل...' : (trackingNum ? '⏳ انتظار...' : 'لم يتم التحديد بعد')}</span>
            </div>
            <div class="details">
                ${adminDetails}
                ${s.receiverPhone2 ? `<div class="info"><strong>هاتف آخر:</strong> ${s.receiverPhone2}</div>` : ''}
                ${s.governorate ? `<div class="info"><strong>المحافظة:</strong> ${s.governorate}</div>` : ''}
                ${s.city ? `<div class="info"><strong>المدينة:</strong> ${s.city}</div>` : ''}
                <div class="info"><strong>العنوان:</strong> ${s.address || s.customerAddress || ''}</div>
                ${s.weight ? `<div class="info"><strong>الوزن:</strong> ${s.weight} كجم</div>` : ''}
                ${s.notes ? `<div class="info"><strong>ملاحظات:</strong> ${s.notes}</div>` : ''}
                ${actions ? `<div class="actions">${actions}</div>` : ''}
            </div>
        </div>`;
    }

    function toggleDetails(element) {
        const details = element.querySelector('.details');
        if (details) details.classList.toggle('open');
    }

    function renderShipments(shipments) {
        const content = document.getElementById('content');
        if (shipments.length === 0) {
            content.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>لا توجد شحنات حتى الآن</p></div>';
            return;
        }
        const isAdmin = currentUser && currentUser.role === 'admin';
        content.innerHTML = shipments.map(s => createShipmentCard(s, isAdmin)).join('');
    }

    // ============================================================
    //  البحث
    // ============================================================
    function searchShipments() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            if (currentUser && currentUser.role === 'admin') loadAllShipments();
            else loadMyShipments();
            return;
        }
        const filtered = allShipmentsData.filter(s => {
            const name = (s.receiverName || s.customerName || '').toLowerCase();
            const phone = (s.receiverPhone || s.customerPhone || '').toLowerCase();
            return name.includes(query) || phone.includes(query);
        });
        const content = document.getElementById('content');
        if (filtered.length === 0) {
            content.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>لا توجد نتائج مطابقة لـ "${query}"</p></div>`;
        } else {
            const isAdmin = currentUser && currentUser.role === 'admin';
            content.innerHTML = filtered.map(s => createShipmentCard(s, isAdmin)).join('');
            updateAllTrackingStatuses(filtered);
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        if (currentUser && currentUser.role === 'admin') loadAllShipments();
        else loadMyShipments();
    }

    async function trackShipment(billCode) {
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modalBody').innerHTML = '<div class="loading"><div class="spinner"></div>جاري تتبع الشحنة...</div>';
        try {
            const res = await fetch(`${API_URL}?action=track&billCode=${billCode}`);
            const data = await res.json();
            if (data.code === "1" && data.data && data.data[0]) {
                let html = `<h3><i class="fas fa-map-marked-alt"></i> مسار الشحنة</h3>`;
                const currentStatus = data.data[0].status || '';
                const details = data.data[0].details || [];
                let foundDelivered = false;
                for (const d of details) {
                    if ((d.desc || '').includes('تم التسليم')) { foundDelivered = true; break; }
                }
                let displayStatus = currentStatus;
                let statusBgColor = '#e8f5e9';
                let statusBorderColor = '#2e7d32';
                let statusTextColor = '#2e7d32';
                if (foundDelivered || currentStatus.includes('تم التسليم')) {
                    displayStatus = 'تم التسليم';
                } else if (currentStatus.includes('خطأ') || currentStatus.includes('Error')) {
                    displayStatus = 'خطأ في التوصيل';
                    statusBgColor = '#ffeaea';
                    statusBorderColor = '#dc3545';
                    statusTextColor = '#dc3545';
                }
                html += `<div style="background:${statusBgColor};padding:10px 16px;border-radius:10px;margin-bottom:16px;border-right:4px solid ${statusBorderColor};">
                    <strong style="color:${statusTextColor};font-size:15px;">الحالة الحالية:</strong>
                    <span style="color:${statusTextColor};font-weight:700;font-size:16px;margin-right:8px;">${displayStatus}</span>
                </div>`;
                if (details.length === 0) {
                    html += `<p style="text-align:center;color:#999;padding:20px;">لا توجد تفاصيل تتبع متاحة</p>`;
                } else {
                    for (const d of details) {
                        let desc = (d.desc || '').replace(/\([0-9]{10,11}\)/g, '').replace(/[0-9]{10,11}/g, '').replace(/J&T/gi, '').replace(/courier/gi, '').replace(/Express/gi, '');
                        let location = d.scanNetworkName || '';
                        let city = d.scanNetworkCity || '';
                        let locationText = city && !location.includes(city) ? city + (location ? ' - ' + location : '') : location;
                        locationText = locationText.replace(/[0-9]/g, '').trim();
                        let problemText = d.probleDescription || '';
                        if (problemText) {
                            problemText = problemText.replace(/[0-9]/g, '').trim();
                        }
                        html += `<div class="timeline-item">
                            <div class="time">🕐 ${d.scanTime || ''}</div>
                            <div class="event">📌 ${desc}</div>
                            <div class="location">📍 ${locationText}</div>
                            ${problemText ? `<div class="problem">⚠️ ${problemText}</div>` : ''}
                        </div>`;
                    }
                }
                document.getElementById('modalBody').innerHTML = html;
            } else {
                document.getElementById('modalBody').innerHTML = `
                    <h3><i class="fas fa-map-marked-alt"></i> تتبع الشحنة</h3>
                    <div style="text-align:center;padding:20px;color:#dc3545;">
                        <div style="font-size:48px;margin-bottom:12px;">❌</div>
                        <p>${data.msg || data.error || 'فشل تتبع الشحنة'}</p>
                    </div>
                `;
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = `
                <h3><i class="fas fa-map-marked-alt"></i> تتبع الشحنة</h3>
                <div style="text-align:center;padding:20px;color:#dc3545;">
                    <div style="font-size:48px;margin-bottom:12px;">📡</div>
                    <p>فشل الاتصال بخدمة التتبع</p>
                </div>
            `;
        }
    }
