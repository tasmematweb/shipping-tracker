<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeVance · بشمهندسه هديل</title>
  <!-- Font Awesome & Google Font (Tajawal) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #fff8e7;
      color: #3d2b1a;
      min-height: 100vh;
    }

    /* ألوان صفراء ونبيتي */

      --gold: #f5b81b;
      --gold-light: #ffe28a;

    }
    .landing h1 {
      font-size: 4.5rem;

      text-shadow: 3px 3px 0 var(--gold-light);

      background: rgba(255, 255, 220, 0.6);
      padding: 0.8rem 3rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      box-shadow: var(--shadow);
    }
    .landing p {
      margin-top: 1.5rem;

    /* الموقع الرئيسي (مخفي في البداية) */
    .main-app {
      display: none;

      padding: 0 1.5rem 3rem;

    /* الشريط العلوي */
    .top-bar {
      display: flex;

      box-shadow: 0 6px 14px rgba(190, 140, 20, 0.25);
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      position: relative;
    }
    .top-bar .brand {
      display: flex;

      gap: 0.4rem;
    }
    .top-bar .brand .hl {
      font-size: 1.9rem;

      letter-spacing: 1px;
    }
    .top-bar .brand .levance {
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--brown);
      letter-spacing: 2px;
    }
    .top-bar .login-btn {
      background: var(--brown);
      color: var(--gold);
      border: none;
      padding: 0.5rem 1.8rem;
      font-size: 1.2rem;

      border-radius: 40px;

    .top-bar .login-btn:hover {
      background: #2d1d10;

    /* لوحة المنتجات */
    .products-grid {
      display: grid;

      margin-top: 1rem;

    .product-card {
      background: white;

      flex-direction: column;
      align-items: center;

    .product-card:hover {
      border-color: var(--gold);

    .product-card img {
      width: 100%;

    }
    .product-card h3 {
      margin: 0.8rem 0 0.2rem;

    }
    .product-card .add-btn {
      background: var(--gold);
      border: none;
      padding: 0.5rem 2.2rem;
      border-radius: 40px;
      font-weight: 700;
      color: var(--brown);
      cursor: pointer;
      box-shadow: 0 3px 0 #b8860b;
      transition: 0.1s;
      margin-top: auto;
      width: 100%;
    }
    .product-card .add-btn:hover {
      background: #e5a90e;
      transform: scale(0.96);
    }
    .discount-badge {
      background: #c0392b;
      color: white;
      font-weight: 700;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 0.3rem;
    }

    /* سلة */
    .cart-section {
      background: var(--cream);
      border-radius: 40px;
      padding: 1.5rem 2rem;
      margin-top: 2.5rem;
      border: 2px solid var(--gold-light);
    }
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      background: white;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      border: 1px solid var(--gold);
    }
    .checkout-btn {
      background: var(--brown);
      color: var(--gold);
      border: none;
      padding: 0.8rem 2.5rem;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 1.2rem;
      cursor: pointer;
    }

    /* صندوق تسجيل الدخول (مودال) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: #fff7e5;
      padding: 2.5rem 2.8rem;
      border-radius: 60px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 3px solid var(--gold);
      text-align: center;
    }
    .modal-content h2 {
      color: var(--brown);
      margin-bottom: 1.5rem;
    }
    .modal-content input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      margin: 0.7rem 0;
      border: 2px solid var(--gold-dark);
      border-radius: 60px;
      font-size: 1rem;
      background: white;
    }
    .modal-content .login-submit {
      background: var(--gold);
      border: none;
      padding: 0.8rem;
      width: 100%;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--brown);
      cursor: pointer;
      margin-top: 0.8rem;
      box-shadow: 0 4px 0 #b8860b;
    }
    .modal-content .close-modal {
      background: transparent;
      border: none;
      font-size: 2rem;
      float: left;
      cursor: pointer;
      color: var(--brown);
    }

    /* صفحة الادمن */
    .admin-panel {
      display: none;
      background: #fcf3dd;
      border-radius: 60px;
      padding: 2rem;
      margin-top: 2rem;
      border: 3px solid var(--gold);
    }
    .admin-panel input, .admin-panel textarea {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 60px;
      border: 2px solid var(--gold-dark);
      background: white;
    }
    .admin-panel .admin-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .admin-panel .admin-row > * {
      flex: 1 1 180px;
    }
    .admin-btn {
      background: var(--gold);
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      font-weight: 700;
      color: var(--brown);
      cursor: pointer;
    }

    /* رسائل */
    .message-popup {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: var(--brown);
      color: var(--gold);
      padding: 1rem 2.5rem;
      border-radius: 60px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      display: none;
      z-index: 1000;
      border: 2px solid var(--gold);
    }

    /* مرونة */
    @media (max-width: 600px) {
      .top-bar { flex-direction: column; gap: 0.6rem; align-items: stretch; }
      .landing h1 { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

<!-- صفحة الهبوط -->
<div class="landing" id="landingPage">
  <h1>بشمهندسه هديل</h1>
  <p>✨ أهلاً بك في عالم LeVance ✨</p>
  <button class="enter-btn" id="enterBtn">دخول</button>
</div>

<!-- الموقع الرئيسي -->
<div class="main-app" id="mainApp">

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="brand">
      <span class="hl">H.L</span>
      <span class="levance">LeVance</span>
    </div>
    <button class="login-btn" id="loginModalBtn"><i class="fas fa-user"></i> تسجيل الدخول</button>
  </div>

  <!-- عرض المنتجات -->
  <div id="productList" class="products-grid"></div>

  <!-- سلة المشتريات -->
  <div class="cart-section">
    <h3 style="color:var(--brown);"><i class="fas fa-shopping-cart"></i> سلة المشتريات</h3>
    <div id="cartItems" class="cart-items"></div>
    <button class="checkout-btn" id="checkoutBtn">إتمام الطلب <i class="fas fa-arrow-left"></i></button>
  </div>

  <!-- لوحة الادمن (تظهر بعد تسجيل الدخول) -->
  <div class="admin-panel" id="adminPanel">
    <h2 style="color:var(--brown);">✨ لوحة الأدمن ✨</h2>
    <div class="admin-row">
      <input type="text" id="productName" placeholder="اسم المنتج">
      <input type="text" id="productPrice" placeholder="السعر (مثال: 150)">
      <input type="text" id="productDiscount" placeholder="الخصم (مثال: 20%)">
    </div>
    <div class="admin-row">
      <input type="text" id="productColors" placeholder="الألوان (أحمر, أزرق)">
      <input type="text" id="productSizes" placeholder="المقاسات (S, M, L)">
    </div>
    <input type="text" id="productImage" placeholder="رابط الصورة (URL)">
    <button class="admin-btn" id="addProductBtn"><i class="fas fa-plus-circle"></i> إضافة منتج</button>
    <p style="margin-top:1rem; color:var(--brown-light);"><i class="fas fa-info-circle"></i> تم رفع المنتج سيظهر فوراً للعملاء</p>
  </div>
</div>

<!-- مودال تسجيل الدخول -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <button class="close-modal" id="closeLoginModal">&times;</button>
    <h2>تسجيل الدخول</h2>
    <input type="text" id="loginName" placeholder="اسم العميل">
    <input type="text" id="loginPhone" placeholder="رقم الهاتف">
    <button class="login-submit" id="loginSubmitBtn">دخول</button>
    <p style="margin-top:0.8rem; color:#7a5a2e;">(استخدم 111 / 111 للدخول كأدمن)</p>
  </div>
</div>

<!-- رسالة منبثقة (طلب اسم/رقم لتسجيل حساب) -->
<div class="message-popup" id="messagePopup">
  <span id="popupMessage">يرجى إدخال اسمك ورقم هاتفك لتسجيل الحساب</span>
</div>

<script>
  (function() {
    // ---------- DATA ----------
    let products = [
      { id: 1, name: 'فستان أنيق', price: 120, discount: '10%', colors: 'أحمر, ذهبي', sizes: 'S, M, L', image: 'https://via.placeholder.com/300x180/f5b81b/3d2b1a?text=LeVance' },
      { id: 2, name: 'حذاء كلاسيك', price: 85, discount: '', colors: 'أسود, بني', sizes: '38,39,40', image: 'https://via.placeholder.com/300x180/f5b81b/3d2b1a?text=LeVance' },
    ];
    let cart = [];
    let currentUser = null; // { name, phone, address }

    // عناصر
    const landing = document.getElementById('landingPage');
    const mainApp = document.getElementById('mainApp');
    const enterBtn = document.getElementById('enterBtn');
    const productList = document.getElementById('productList');
    const cartItems = document.getElementById('cartItems');
    const checkoutBtn = document.getElementById('checkoutBtn');
    const adminPanel = document.getElementById('adminPanel');
    const loginModal = document.getElementById('loginModal');
    const loginModalBtn = document.getElementById('loginModalBtn');
    const closeLoginModal = document.getElementById('closeLoginModal');
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');
    const loginName = document.getElementById('loginName');
    const loginPhone = document.getElementById('loginPhone');
    const messagePopup = document.getElementById('messagePopup');
    const popupMessage = document.getElementById('popupMessage');

    // إدخالات الأدمن
    const productName = document.getElementById('productName');
    const productPrice = document.getElementById('productPrice');
    const productDiscount = document.getElementById('productDiscount');
    const productColors = document.getElementById('productColors');
    const productSizes = document.getElementById('productSizes');
    const productImage = document.getElementById('productImage');
    const addProductBtn = document.getElementById('addProductBtn');

    // ---------- FUNCTIONS ----------
    function renderProducts() {
      if (!productList) return;
      if (products.length === 0) {
        productList.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--brown);">لا توجد منتجات حالياً</p>`;
        return;
      }
      productList.innerHTML = products.map(p => {
        const discountHtml = p.discount ? `<span class="discount-badge">خصم ${p.discount}</span>` : '';
        return `
          <div class="product-card" data-id="${p.id}">
            <img src="${p.image || 'https://via.placeholder.com/300x180/f5b81b/3d2b1a?text=LeVance'}" alt="${p.name}">
            <h3>${p.name}</h3>
            <div class="price">$${p.price}</div>
            ${discountHtml}
            <div class="colors">${p.colors || 'ألوان متعددة'}</div>
            <div class="sizes">${p.sizes || 'مقاسات مختلفة'}</div>
            <button class="add-btn" data-id="${p.id}">إضافة للسلة</button>
          </div>
        `;
      }).join('');

      // أحداث الأزرار
      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = parseInt(this.dataset.id);
          const product = products.find(p => p.id === id);
          if (product) {
            cart.push({ ...product });
            renderCart();
            showPopup('تم إضافة المنتج إلى السلة ✅');
          }
        });
      });
    }

    function renderCart() {
      if (!cartItems) return;
      if (cart.length === 0) {
        cartItems.innerHTML = `<p style="color:var(--brown-light);">السلة فارغة</p>`;
        return;
      }
      cartItems.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>$${item.price}</span>
          <button style="background:none; border:none; color:#a94442; font-weight:bold; cursor:pointer;" data-index="${idx}"><i class="fas fa-trash-alt"></i></button>
        </div>
      `).join('');

      document.querySelectorAll('.cart-item button[data-index]').forEach(btn => {
        btn.addEventListener('click', function() {
          const index = parseInt(this.dataset.index);
          cart.splice(index, 1);
          renderCart();
          showPopup('تم حذف المنتج من السلة');
        });
      });
    }

    // عرض الرسالة المنبثقة
    function showPopup(msg) {
      popupMessage.textContent = msg;
      messagePopup.style.display = 'block';
      setTimeout(() => { messagePopup.style.display = 'none'; }, 3000);
    }

    // طلب العنوان (بعد الضغط على إتمام الطلب)
    function requestAddress() {
      if (cart.length === 0) {
        showPopup('السلة فارغة! أضف منتجات أولاً.');
        return;
      }
      // إذا كان المستخدم مسجل مسبقاً نعرض بياناته مع خيار التعديل
      let name = currentUser?.name || '';
      let phone = currentUser?.phone || '';
      let address = currentUser?.address || '';

      // نطلب البيانات عبر prompt (بسيط)
      const newName = prompt('أدخل اسمك:', name) || name;
      const newPhone = prompt('أدخل رقم هاتفك:', phone) || phone;
      const governorate = prompt('المحافظة:') || '';
      const center = prompt('المركز:') || '';
      const street = prompt('اسم الشارع:') || '';
      const fullAddress = `${governorate} - ${center} - ${street}`;

      if (!newName || !newPhone || !fullAddress.trim()) {
        showPopup('يرجى إكمال جميع الحقول');
        return;
      }

      // تسجيل الحساب (حفظ البيانات)
      if (!currentUser) {
        // إنشاء حساب جديد
        currentUser = { name: newName, phone: newPhone, address: fullAddress };
        showPopup(`تم تسجيل حسابك بنجاح! ${newName}`);
      } else {
        // تحديث البيانات
        currentUser.name = newName;
        currentUser.phone = newPhone;
        currentUser.address = fullAddress;
        showPopup(`تم تحديث بياناتك ✅`);
      }

      // تفريغ السلة بعد الطلب
      cart = [];
      renderCart();
      // هنا يمكن إرسال الطلب ... نعرض رسالة
      showPopup(`شكراً ${newName}! تم إرسال طلبك إلى العنوان: ${fullAddress}`);
    }

    // تسجيل الدخول (للأدمن أو عميل)
    function handleLogin() {
      const name = loginName.value.trim();
      const phone = loginPhone.value.trim();
      if (name === '111' && phone === '111') {
        // أدمن
        adminPanel.style.display = 'block';
        showPopup('مرحباً أدمن! يمكنك إدارة المنتجات.');
        loginModal.style.display = 'none';
        // مسح الحقول
        loginName.value = ''; loginPhone.value = '';
        return;
      } else {
        // تسجيل عميل عادي (نبحث في "المستخدمين" لكننا نخزن محلياً)
        if (name && phone) {
          // نبحث عن مستخدم بنفس الاسم والرقم (محاكاة)
          // في هذا الإصدار نستخدم currentUser
          if (currentUser && currentUser.name === name && currentUser.phone === phone) {
            // تم تسجيل الدخول كعميل موجود
            showPopup(`أهلاً بعودتك ${name}! تم ملء بياناتك تلقائياً.`);
            loginModal.style.display = 'none';
            // نعرض رسالة فقط
          } else {
            // مستخدم جديد
            currentUser = { name, phone, address: '' };
            showPopup(`تم تسجيل دخولك كعميل جديد ${name}`);
            loginModal.style.display = 'none';
          }
          loginName.value = ''; loginPhone.value = '';
        } else {
          showPopup('يرجى إدخال الاسم ورقم الهاتف');
        }
      }
    }

    // إضافة منتج (أدمن)
    function addProduct() {
      const name = productName.value.trim();
      const price = parseFloat(productPrice.value);
      const discount = productDiscount.value.trim() || '';
      const colors = productColors.value.trim() || 'ألوان متعددة';
      const sizes = productSizes.value.trim() || 'مقاسات متعددة';
      const image = productImage.value.trim() || 'https://via.placeholder.com/300x180/f5b81b/3d2b1a?text=LeVance';
      if (!name || isNaN(price) || price <= 0) {
        showPopup('يرجى إدخال اسم المنتج وسعر صحيح');
        return;
      }
      const newProduct = {
        id: Date.now(),
        name,
        price,
        discount,
        colors,
        sizes,
        image,
      };
      products.push(newProduct);
      renderProducts();
      // تفريغ الحقول
      productName.value = ''; productPrice.value = ''; productDiscount.value = '';
      productColors.value = ''; productSizes.value = ''; productImage.value = '';
      showPopup(`تم إضافة المنتج "${name}" بنجاح ✅`);
    }

    // ---------- EVENT LISTENERS ----------
    enterBtn.addEventListener('click', function() {
      landing.style.display = 'none';
      mainApp.style.display = 'block';
      renderProducts();
      renderCart();
    });

    loginModalBtn.addEventListener('click', function() {
      loginModal.style.display = 'flex';
    });

    closeLoginModal.addEventListener('click', function() {
      loginModal.style.display = 'none';
    });

    window.addEventListener('click', function(e) {
      if (e.target === loginModal) loginModal.style.display = 'none';
    });

    loginSubmitBtn.addEventListener('click', handleLogin);

    checkoutBtn.addEventListener('click', requestAddress);
