<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rain</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #ffffff;
        }

        #rainCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<canvas id="rainCanvas"></canvas>

<main class="content"></main>

<script>

const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");

let width;
let height;

let drops = [];

/* اتجاه الهاتف */
let tiltX = 0;
let tiltY = 1;

/* إعدادات المطر */
const settings = {
    density: 130,
    minLength: 12,
    maxLength: 42,
    minSpeed: 5,
    maxSpeed: 13,
    minWidth: 0.7,
    maxWidth: 1.8
};

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function resizeCanvas() {

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createRain();
}

function createRain() {

    drops = [];

    const amount = Math.max(
        settings.density,
        Math.floor(width / 5)
    );

    for (let i = 0; i < amount; i++) {

        drops.push({
            x: random(0, width),
            y: random(-height, height),

            length: random(
                settings.minLength,
                settings.maxLength
            ),

            speed: random(
                settings.minSpeed,
                settings.maxSpeed
            ),

            width: random(
                settings.minWidth,
                settings.maxWidth
            ),

            opacity: random(0.15, 0.75)
        });
    }
}

/*
    قراءة ميلان الهاتف
*/
function handleOrientation(event) {

    if (event.gamma !== null) {

        /*
         * gamma:
         * -90 = يسار
         *  0   = مستوٍ
         * +90 = يمين
         */

        const targetX =
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    event.gamma / 25
                )
            );

        /*
         * تنعيم الحركة
         */
        tiltX +=
            (targetX - tiltX) * 0.08;
    }

    if (event.beta !== null) {

        /*
         * beta:
         * 0   = الهاتف مستوٍ
         * 90  = عمودي
         * 180 = مقلوب
         */

        const targetY =
            Math.cos(
                event.beta *
                Math.PI / 180
            );

        tiltY +=
            (targetY - tiltY) * 0.05;
    }
}

/*
    بعض أجهزة iPhone تحتاج إذنًا
*/
async function enableMotion() {

    if (
        typeof DeviceOrientationEvent !==
        "undefined" &&
        typeof DeviceOrientationEvent.requestPermission ===
        "function"
    ) {

        try {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();

            if (permission === "granted") {

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation,
                    true
                );
            }

        } catch (error) {
            console.log(error);
        }

    } else {

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );
    }
}

/*
    تشغيل مستشعر الهاتف
*/
enableMotion();

/*
    دعم بعض الأجهزة التي تمنع المستشعر
    إلا بعد أول تفاعل
*/
document.addEventListener(
    "touchstart",
    enableMotion,
    {
        once: true
    }
);

function drawRain() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    for (const drop of drops) {

        /*
         * اتجاه المطر الأساسي للأسفل
         */
        const moveX =
            tiltX * drop.speed;

        const moveY =
            drop.speed * tiltY;

        /*
         * رسم القطرة بنفس اتجاه حركتها
         */
        const endX =
            drop.x + moveX * 0.45;

        const endY =
            drop.y + drop.length * tiltY;

        const gradient =
            ctx.createLinearGradient(
                drop.x,
                drop.y,
                endX,
                endY
            );

        gradient.addColorStop(
            0,
            "rgba(30,144,255,0)"
        );

        gradient.addColorStop(
            0.35,
            `rgba(30,144,255,${drop.opacity * 0.45})`
        );

        gradient.addColorStop(
            1,
            `rgba(0,132,255,${drop.opacity})`
        );

        ctx.beginPath();

        ctx.strokeStyle =
            gradient;

        ctx.lineWidth =
            drop.width;

        ctx.lineCap =
            "round";

        ctx.moveTo(
            drop.x,
            drop.y
        );

        ctx.lineTo(
            endX,
            endY
        );

        ctx.stroke();

        /*
         * تحريك القطرة
         */
        drop.x += moveX * 0.12;
        drop.y += moveY;

        /*
         * إذا خرجت القطرة من الشاشة
         */
        if (
            drop.y >
            height + drop.length ||
            drop.x < -100 ||
            drop.x > width + 100
        ) {

            drop.x =
                random(0, width);

            drop.y =
                -drop.length -
                random(0, 200);

            drop.speed =
                random(
                    settings.minSpeed,
                    settings.maxSpeed
                );
        }
    }

    requestAnimationFrame(
        drawRain
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();
drawRain();

</script>

</body>
</html>
