<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تصميم كارت الشحن الاحترافي - EUX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== إعادة تعيين وتنسيق عام ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080a11;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== الكارت الرئيسي ===== */
        .shipment-card {
            width: 100%;
            max-width: 850px;
            background: linear-gradient(135deg, #0b111e 0%, #05070d 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 3px solid #0066ff;
            border-radius: 20px;
            padding: 24px 28px;
            display: flex;
            gap: 25px;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(0, 102, 255, 0.15);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .shipment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 102, 255, 0.2);
        }

        /* تأثير خلفية متحركة خفيفة */
        .shipment-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ===== القسم الأيسر: الصورة والزر ===== */
        .card-left {
            flex: 0 0 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .truck-wrapper {
            position: relative;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .truck-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0, 102, 255, 0.4));
            animation: floatTruck 3s ease-in-out infinite;
        }

        @keyframes floatTruck {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .location-pin {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px #00a2ff);
            animation: pulsePin 2s ease-in-out infinite;
        }

        @keyframes pulsePin {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .track-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #3b82f6;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .track-btn i {
            font-size: 0.9rem;
        }

        .track-btn:hover {
            background: #0066ff;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
            border-color: #0066ff;
            transform: scale(1.02);
        }

        /* ===== القسم الأيمن: البيانات التفصيلية ===== */
        .card-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        /* ===== الهيدر ===== */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .customer-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .customer-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .customer-phone {
            font-size: 0.95rem;
            color: #8a99ad;
            letter-spacing: 0.5px;
            direction: ltr;
        }

        .customer-phone i {
            margin-left: 6px;
            color: #3b82f6;
        }

        .order-id-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #a0aec0;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .order-id-badge i {
            color: #3b82f6;
            font-size: 0.9rem;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0.5;
            transition: opacity 0.2s;
            color: #a0aec0;
            padding: 0 4px;
        }

        .copy-btn:hover {
            opacity: 1;
            color: #3b82f6;
        }

        /* ===== شبكة البيانات التفصيلية ===== */
        .details-grid {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px 20px;
            align-items: center;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            padding: 4px 0;
        }

        /* خط فاصل بين العناصر */
        .detail-item:not(:last-child)::after {
            content: "";
            position: absolute;
            left: -10px;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .detail-icon {
            font-size: 1.1rem;
            opacity: 0.7;
            width: 24px;
            text-align: center;
            color: #3b82f6;
        }

        .detail-text {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .detail-title {
            font-size: 0.95rem;
            color: #e2e8f0;
            font-weight: 600;
        }

        .detail-title.price {
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .detail-label {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 1px;
            letter-spacing: 0.3px;
        }

        /* ===== حالة الشحنة ===== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 125, 50, 0.15);
            border: 1px solid rgba(46, 125, 50, 0.25);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #4caf50;
            margin-top: 4px;
        }

        .status-badge i {
            font-size: 0.7rem;
        }

        .status-badge.pending {
            background: rgba(255, 152, 0, 0.12);
            border-color: rgba(255, 152, 0, 0.2);
            color: #ffa726;
        }

        /* ===== زر تتبع بديل (للشاشات الصغيرة) ===== */
        .track-btn-mobile {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #3b82f6;
            padding: 10px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            width: 100%;
        }

        .track-btn-mobile:hover {
            background: #0066ff;
            color: #fff;
            border-color: #0066ff;
        }

        /* ===== استجابة للشاشات الصغيرة ===== */
        @media (max-width: 768px) {
            .shipment-card {
                flex-direction: column;
                padding: 20px;
                gap: 16px;
            }

            .card-left {
                flex: 1;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            .truck-wrapper {
                height: 80px;
                width: 120px;
            }

            .track-btn {
                display: none;
            }

            .track-btn-mobile {
                display: flex;
            }

            .card-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .order-id-badge {
                align-self: flex-start;
            }

            .details-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                padding: 12px 16px;
            }

            .detail-item:not(:last-child)::after {
                display: none;
            }

            .detail-item:nth-child(2)::after {
                display: block;
                left: -10px;
                top: 15%;
                height: 70%;
                width: 1px;
                background: rgba(255, 255, 255, 0.06);
            }

            .customer-name {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .details-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .detail-item:not(:last-child)::after {
                display: none;
            }

            .shipment-card {
                padding: 16px;
                border-radius: 16px;
            }

            .card-left {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .truck-wrapper {
                height: 70px;
                width: 100px;
            }

            .order-id-badge {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
        }
    </style>
</head>
