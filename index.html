<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>tasmematweb | Web Development</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:550vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% 8%,rgba(0,210,255,.075),transparent 28%),
        radial-gradient(circle at 15% 48%,rgba(255,183,0,.045),transparent 25%),
        radial-gradient(circle at 85% 78%,rgba(0,210,255,.045),transparent 28%),
        #fff;
    color:#0b1220;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    position:relative;
}

/* =========================================================
   خلفية تقنية خفيفة
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.32;
    background-image:
        linear-gradient(rgba(0,210,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,210,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
}

body::after{
    content:"";
    position:fixed;
    width:55vw;
    height:55vw;
    max-width:700px;
    max-height:700px;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(0,210,255,.055);
    box-shadow:
        0 0 100px rgba(0,210,255,.035),
        inset 0 0 100px rgba(255,183,0,.025);
    pointer-events:none;
    z-index:0;
}

/* =========================================================
   العلامة التجارية
========================================================= */

.brand{
    position:fixed;
    top:24px;
    left:28px;
    z-index:1000;
    display:flex;
    align-items:center;
    gap:10px;
    direction:ltr;
    padding:10px 15px;
    border:1px solid rgba(0,210,255,.18);
    border-radius:15px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:
        0 8px 30px rgba(15,23,42,.06),
        0 0 20px rgba(0,210,255,.04);
    user-select:none;
}

.brand-mark{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ffb700;
    box-shadow:
        0 0 8px #ffb700,
        0 0 18px rgba(255,183,0,.65);
}

.brand-name{
    font-size:15px;
    font-weight:800;
    letter-spacing:1.5px;
    color:#101827;
}

.brand-name span{
    color:#00a9dc;
}

/* =========================================================
   مؤشر التمرير
========================================================= */

.scroll-line{
    position:fixed;
    top:0;
    right:0;
    width:3px;
    height:100vh;
    z-index:1001;
    background:rgba(0,210,255,.06);
}

.scroll-progress{
    width:100%;
    height:0%;
    background:linear-gradient(to bottom,#00d2ff,#00ffff,#ffb700);
    box-shadow:
        0 0 8px rgba(0,210,255,.8),
        0 0 18px rgba(255,183,0,.35);
}

/* =========================================================
   الشارات
========================================================= */

.section-badge{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:7px 16px;
    min-height:32px;
    background:
        linear-gradient(
            135deg,
            rgba(0,210,255,.08),
            rgba(255,183,0,.075)
        );
    border:1px solid rgba(0,170,220,.25);
    border-radius:999px;
    color:#0085bd;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.8px;
    text-transform:uppercase;
    box-shadow:
        0 6px 18px rgba(0,210,255,.07),
        inset 0 0 15px rgba(0,210,255,.035);
    white-space:nowrap;
}

.badge-dot{
    width:7px;
    height:7px;
    flex:none;
    border-radius:50%;
    background:#ffb700;
    box-shadow:
        0 0 7px #ffb700,
        0 0 14px rgba(255,183,0,.55);
}

/* =========================================================
   الإطار العام للعناصر
========================================================= */

.hanging-wrapper,
.archer-section,
.chart-section{
    z-index:10;
}

/* =========================================================
   الساعة
========================================================= */

.hanging-wrapper{
    position:absolute;
    top:50vh;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(90%,520px);
    display:flex;
    flex-direction:column;
    align-items:center;
    contain:layout paint;
}

.wall-nail{
    width:clamp(14px,2.5vw,20px);
    height:clamp(14px,2.5vw,20px);
    border-radius:50%;
    background:radial-gradient(
        circle at 35% 30%,
        #fff35c 0%,
        #ffe000 35%,
        #ffb700 100%
    );
    box-shadow:
        0 0 12px #ffb700,
        0 0 26px rgba(255,183,0,.7);
    margin-bottom:-2px;
    z-index:2;
}

.hanging-string{
    width:2px;
    height:clamp(42px,8vh,70px);
    background:
        linear-gradient(
            to bottom,
            #ffb700,
            #00d2ff 55%,
            rgba(0,210,255,.12)
        );
    box-shadow:
        0 0 7px rgba(0,210,255,.75);
}

.clock-frame-box{
    position:relative;
    width:100%;
    overflow:hidden;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.97),
            rgba(247,252,255,.86)
        );
    border:1px solid rgba(0,184,230,.42);
    border-radius:32px;
    padding:clamp(20px,4vw,35px);
    box-shadow:
        0 30px 70px rgba(15,23,42,.08),
        0 18px 45px rgba(0,210,255,.10),
        0 0 35px rgba(255,183,0,.07),
        inset 0 0 35px rgba(0,210,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.clock-frame-box::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(0,210,255,.07);
    border-radius:24px;
    pointer-events:none;
}

.clock-frame-box::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    top:-100px;
    right:-80px;
    border-radius:50%;
    background:rgba(0,210,255,.08);
    filter:blur(25px);
    pointer-events:none;
}

.clock-container{
    width:100%;
    max-width:440px;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.clock-container svg{
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   SVG
========================================================= */

svg{
    width:100%;
    height:100%;
    overflow:visible;
    display:block;
}

.neon-blue{
    filter:
        drop-shadow(0 0 4px rgba(0,210,255,.72))
        drop-shadow(0 0 10px rgba(0,210,255,.28));
}

.neon-gold{
    filter:
        drop-shadow(0 0 4px rgba(255,183,0,.72))
        drop-shadow(0 0 10px rgba(255,183,0,.28));
}

.outer-aura{
    filter:
        drop-shadow(0 0 8px rgba(0,210,255,.45))
        drop-shadow(0 0 18px rgba(255,183,0,.18));
}

/* =========================================================
   الأقسام
========================================================= */

.archer-section,
.chart-section{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.96),
            rgba(248,252,255,.88)
        );
    border:1px solid rgba(0,184,230,.4);
    border-radius:32px;
    padding:clamp(18px,3vw,30px);
    box-shadow:
        0 30px 70px rgba(15,23,42,.07),
        0 18px 45px rgba(0,210,255,.09),
        0 0 35px rgba(255,183,0,.06),
        inset 0 0 30px rgba(0,210,255,.07);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    overflow:hidden;
    contain:layout paint;
}

.archer-section::before,
.chart-section::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    pointer-events:none;
    background:rgba(0,210,255,.055);
    filter:blur(50px);
}

.archer-section::before{
    top:-140px;
    right:-100px;
}

.chart-section::before{
    bottom:-150px;
    left:-100px;
}

.archer-section{
    position:absolute;
    top:200vh;
    left:50%;
    transform:translateX(-50%);
    width:min(92%,980px);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.chart-section{
    position:absolute;
    top:360vh;
    left:50%;
    transform:translateX(-50%);
    width:min(92%,1000px);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.archer-container{
    width:100%;
    aspect-ratio:800 / 400;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chart-container{
    width:100%;
    aspect-ratio:800 / 420;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   خط أرضية الرامي
========================================================= */

#archer-ground{
    opacity:.9;
}

/* =========================================================
   تحسين الحركة
========================================================= */

#hour-hand,
#minute-hand,
#arrow-1,
#arrow-2,
#arrow-3,
#target-board,
#bow-string,
#chart-arrow-head{
    transform-box:fill-box;
}

/* =========================================================
   شاشات متوسطة
========================================================= */

@media (max-width:800px){

    body{
        min-height:520vh;
    }

    .brand{
        top:16px;
        left:16px;
        padding:8px 12px;
    }

    .brand-name{
        font-size:13px;
        letter-spacing:1px;
    }

    .archer-section{
        top:185vh;
    }

    .chart-section{
        top:340vh;
    }

    .clock-frame-box,
    .archer-section,
    .chart-section{
        border-radius:26px;
    }
}

/* =========================================================
   الهواتف
========================================================= */

@media (max-width:600px){

    body{
        min-height:480vh;
        background:
            radial-gradient(
                circle at 50% 7%,
                rgba(0,210,255,.065),
                transparent 30%
            ),
            #fff;
    }

    body::before{
        background-size:32px 32px;
        opacity:.2;
    }

    body::after{
        width:95vw;
        height:95vw;
    }

    .brand{
        top:12px;
        left:12px;
        border-radius:12px;
    }

    .brand-mark{
        width:8px;
        height:8px;
    }

    .brand-name{
        font-size:12px;
    }

    .section-badge{
        font-size:9px;
        letter-spacing:1.3px;
        padding:6px 11px;
        min-height:28px;
    }

    .hanging-wrapper{
        width:92%;
    }

    .clock-frame-box{
        padding:17px;
        border-radius:23px;
    }

    .clock-container{
        max-width:330px;
    }

    .archer-section{
        top:170vh;
        width:94%;
        padding:15px 12px 18px;
        border-radius:23px;
    }

    .chart-section{
        top:310vh;
        width:94%;
        padding:15px 12px 18px;
        border-radius:23px;
    }

    .archer-container{
        aspect-ratio:800 / 430;
    }

    .chart-container{
        aspect-ratio:800 / 450;
    }
}

/* =========================================================
   شاشات صغيرة جداً
========================================================= */

@media (max-width:380px){

    .brand{
        padding:7px 10px;
    }

    .brand-name{
        font-size:11px;
    }

    .clock-frame-box{
        padding:13px;
    }

    .archer-section,
    .chart-section{
        padding:12px 8px 15px;
    }
}

/* =========================================================
   تقليل الحركة للأجهزة التي تطلب ذلك
========================================================= */

@media (prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     العلامة التجارية
======================================================= -->

<div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">tasmemat<span>web</span></span>
</div>

<div class="scroll-line">
    <div class="scroll-progress" id="scroll-progress"></div>
</div>


<!-- =======================================================
     1. الساعة
======================================================= -->

<div class="hanging-wrapper">

    <div class="wall-nail"></div>
    <div class="hanging-string"></div>

    <div class="clock-frame-box">

        <div class="section-badge">
            <span class="badge-dot"></span>
            <span>Precision Timepiece</span>
        </div>

        <div class="clock-container">

            <svg viewBox="-70 -70 440 440">

                <defs>

                    <linearGradient
                        id="goldGrad"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
                        <stop offset="0%" stop-color="#fff05a"/>
                        <stop offset="35%" stop-color="#ffd000"/>
                        <stop offset="100%" stop-color="#ff9900"/>
                    </linearGradient>

                    <linearGradient
                        id="blueGrad"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
                        <stop offset="0%" stop-color="#00ffff"/>
                        <stop offset="50%" stop-color="#00d2ff"/>
                        <stop offset="100%" stop-color="#0088ff"/>
                    </linearGradient>

                    <radialGradient
                        id="goldGlow"
                        cx="50%"
                        cy="50%"
                        r="50%">
                        <stop offset="0%" stop-color="#ffe600" stop-opacity="1"/>
                        <stop offset="70%" stop-color="#ffb700" stop-opacity=".6"/>
                        <stop offset="100%" stop-color="#ffb700" stop-opacity="0"/>
                    </radialGradient>

                </defs>

                <!-- هالة الساعة -->
                <circle
                    cx="150"
                    cy="150"
                    r="139"
                    fill="none"
                    stroke="rgba(0,210,255,.045)"
                    stroke-width="14"/>

                <!-- الإطار الخارجي -->
                <circle
                    cx="150"
                    cy="150"
                    r="142"
                    fill="none"
                    stroke="url(#goldGrad)"
                    stroke-width="1.5"
                    opacity=".65"/>

                <circle
                    cx="150"
                    cy="150"
                    r="135"
                    fill="none"
                    stroke="url(#blueGrad)"
                    stroke-width="3.5"
                    class="outer-aura"/>

                <circle
                    cx="150"
                    cy="150"
                    r="126"
                    fill="none"
                    stroke="#ffb700"
                    stroke-width="1"
                    stroke-dasharray="4,8"
                    opacity=".5"/>

                <!-- قرص داخلي -->
                <circle
                    cx="150"
                    cy="150"
                    r="119"
                    fill="rgba(255,255,255,.38)"
                    stroke="rgba(0,210,255,.09)"
                    stroke-width="1"/>

                <!-- الشرط -->
                <g
                    id="ticks"
                    stroke="#00d2ff"
                    stroke-linecap="round">
                </g>

                <!-- عقرب الساعات -->
                <g
                    id="hour-hand"
                    transform="rotate(295 150 150)">

                    <polygon
                        points="146,150 154,150 151,80 149,80"
                        fill="url(#goldGrad)"
                        class="neon-gold"/>

                    <circle
                        cx="150"
                        cy="95"
                        r="3"
                        fill="#ffffff"/>

                </g>

                <!-- عقرب الدقائق -->
                <g
                    id="minute-hand"
                    transform="rotate(355 150 150)">

                    <line
                        x1="150"
                        y1="185"
                        x2="150"
                        y2="35"
                        stroke="url(#blueGrad)"
                        stroke-width="4.5"
                        stroke-linecap="round"
                        class="neon-blue"/>

                    <circle
                        cx="150"
                        cy="55"
                        r="3.5"
                        fill="#ffe600"
                        class="neon-gold"/>

                </g>

                <!-- مركز الساعة -->
                <circle
                    cx="150"
                    cy="150"
                    r="10"
                    fill="#00d2ff"
                    class="neon-blue"/>

                <circle
                    cx="150"
                    cy="150"
                    r="5"
                    fill="#ffe600"/>

            </svg>

        </div>
    </div>
</div>


<!-- =======================================================
     2. الرامي والهدف
======================================================= -->

<div class="archer-section">

    <div class="section-badge">
        <span class="badge-dot"></span>
        <span>Accuracy &amp; Precision</span>
    </div>

    <div class="archer-container">

        <svg viewBox="0 0 800 400">

            <defs>
                <linearGradient
                    id="archerGoldGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
                    <stop offset="0%" stop-color="#fff05a"/>
                    <stop offset="45%" stop-color="#ffd000"/>
                    <stop offset="100%" stop-color="#ff9900"/>
                </linearGradient>

                <linearGradient
                    id="archerBlueGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
                    <stop offset="0%" stop-color="#00ffff"/>
                    <stop offset="50%" stop-color="#00d2ff"/>
                    <stop offset="100%" stop-color="#0088ff"/>
                </linearGradient>
            </defs>

            <!-- منصة الأرضية -->
            <line
                id="archer-ground"
                x1="30"
                y1="340"
                x2="770"
                y2="340"
                stroke="url(#archerBlueGrad)"
                stroke-width="3.5"
                stroke-linecap="round"
                class="neon-blue"/>

            <!-- الرامي -->
            <g
                id="stickman"
                class="neon-blue">

                <!-- جعبة الأسهم -->
                <g id="quiver-group">

                    <path
                        d="M 98,170 L 112,230 L 102,232 L 88,172 Z"
                        fill="rgba(255,183,0,.2)"
                        stroke="#ffb700"
                        stroke-width="2"/>

                    <line
                        id="q-arrow-3"
                        x1="91"
                        y1="171"
                        x2="82"
                        y2="150"
                        stroke="#ffb700"
                        stroke-width="3"
                        stroke-linecap="round"/>

                    <line
                        id="q-arrow-2"
                        x1="95"
                        y1="171"
                        x2="89"
                        y2="145"
                        stroke="#ffb700"
                        stroke-width="3"
                        stroke-linecap="round"/>

                    <line
                        id="q-arrow-1"
                        x1="99"
                        y1="171"
                        x2="96"
                        y2="140"
                        stroke="#ffb700"
                        stroke-width="3"
                        stroke-linecap="round"/>

                </g>

                <!-- الرأس -->
                <circle
                    cx="120"
                    cy="140"
                    r="22"
                    fill="#00d2ff"
                    stroke="url(#archerGoldGrad)"
                    stroke-width="2.5"/>

                <!-- الوجه -->
                <line
                    x1="95"
                    y1="135"
                    x2="145"
                    y2="135"
                    stroke="#ffffff"
                    stroke-width="3.5"
                    stroke-linecap="round"/>

                <!-- الجسم -->
                <line
                    x1="120"
                    y1="162"
                    x2="120"
                    y2="250"
                    stroke="#00d2ff"
                    stroke-width="5"
                    stroke-linecap="round"/>

                <!-- الرجلان -->
                <line
                    x1="120"
                    y1="250"
                    x2="90"
                    y2="340"
                    stroke="#00d2ff"
                    stroke-width="5"
                    stroke-linecap="round"/>

                <line
                    x1="120"
                    y1="250"
                    x2="150"
                    y2="340"
                    stroke="#00d2ff"
                    stroke-width="5"
                    stroke-linecap="round"/>

                <!-- الذراع -->
                <line
                    x1="120"
                    y1="180"
                    x2="175"
                    y2="185"
                    stroke="#00d2ff"
                    stroke-width="4.5"
                    stroke-linecap="round"/>

                <!-- القوس -->
                <path
                    d="M 175,120 Q 205,185 175,250"
                    fill="none"
                    stroke="url(#archerGoldGrad)"
                    stroke-width="4.5"
                    stroke-linecap="round"
                    class="neon-gold"/>

                <!-- الوتر -->
                <path
                    id="bow-string"
                    d="M 175,120 L 175,185 L 175,250"
                    fill="none"
                    stroke="#00d2ff"
                    stroke-width="2"/>

            </g>


            <!-- الأسهم -->

            <g id="arrows-container">

                <g id="arrow-1" style="opacity:0;">

                    <line
                        x1="130"
                        y1="176"
                        x2="195"
                        y2="176"
                        stroke="#00d2ff"
                        stroke-width="3.5"
                        stroke-linecap="round"/>

                    <polygon
                        points="195,170 212,176 195,182"
                        fill="#ffb700"
                        class="neon-gold"/>

                    <line
                        x1="130"
                        y1="176"
                        x2="120"
                        y2="168"
                        stroke="#ffb700"
                        stroke-width="2.5"/>

                    <line
                        x1="130"
                        y1="176"
                        x2="120"
                        y2="184"
                        stroke="#ffb700"
                        stroke-width="2.5"/>

                </g>


                <g id="arrow-2" style="opacity:0;">

                    <line
                        x1="130"
                        y1="185"
                        x2="195"
                        y2="185"
                        stroke="#00d2ff"
                        stroke-width="4"
                        stroke-linecap="round"/>

                    <polygon
                        points="195,179 212,185 195,191"
                        fill="#ffb700"
                        class="neon-gold"/>

                    <line
                        x1="130"
                        y1="185"
                        x2="120"
                        y2="177"
                        stroke="#ffb700"
                        stroke-width="3"/>

                    <line
                        x1="130"
                        y1="185"
                        x2="120"
                        y2="193"
                        stroke="#ffb700"
                        stroke-width="3"/>

                </g>


                <g id="arrow-3" style="opacity:0;">

                    <line
                        x1="130"
                        y1="194"
                        x2="195"
                        y2="194"
                        stroke="#00d2ff"
                        stroke-width="3.5"
                        stroke-linecap="round"/>

                    <polygon
                        points="195,188 212,194 195,200"
                        fill="#ffb700"
                        class="neon-gold"/>

                    <line
                        x1="130"
                        y1="194"
                        x2="120"
                        y2="186"
                        stroke="#ffb700"
                        stroke-width="2.5"/>

                    <line
                        x1="130"
                        y1="194"
                        x2="120"
                        y2="202"
                        stroke="#ffb700"
                        stroke-width="2.5"/>

                </g>

            </g>


            <!-- الهدف -->

            <g id="target-board">

<!-- =======================================================
     3. النمو
======================================================= -->

<div class="chart-section">

    <div class="section-badge">
        <span class="badge-dot"></span>
        <span>Exponential Growth</span>
    </div>

    <div class="chart-container">

        <svg viewBox="0 0 800 420">

            <defs>

                <pattern
                    id="lux-grid"
                    width="40"
                    height="40"
                    patternUnits="userSpaceOnUse">

                    <path
                        d="M 40 0 L 0 0 0 40"
                        fill="none"
                        stroke="rgba(0,210,255,.15)"
                        stroke-width="1.2"/>

                    <circle
                        cx="40"

                        fill="rgba(255,183,0,.4)"/>

                </pattern>

                <linearGradient
                    id="chartLineGrad"
                    x1="0%"

                    y2="0%">

                    <stop offset="0%" stop-color="#00d2ff"/>
                    <stop offset="60%" stop-color="#00ffff"/>
                    <stop offset="100%" stop-color="#ffb700"/>

                </linearGradient>

            </defs>


            <!-- الشبكة -->

            <rect
                x="15"

                width="770"

                rx="20"
                fill="url(#lux-grid)"
                stroke="rgba(0,210,255,.4)"
                stroke-width="2"
                stroke-dasharray="8,6"/>


            <!-- الخط -->

            <path
                id="chart-path"
                d="
                    M 50 370
                    L 110 325
                    L 135 340
                    L 200 270
                    L 235 295
                    L 310 195
                    L 345 220
                    L 440 115
                    L 475 140
                    L 560 55
                    L 595 80
                    L 710 25
                "
                fill="none"
                stroke="url(#chartLineGrad)"
                stroke-width="7"

                stroke-linejoin="round"
                class="neon-blue"/>


            <!-- نقاط البيانات -->

            <g id="chart-nodes">

                <circle
                    cx="110"

                    r="5"
                    fill="#00d2ff"/>

                <circle
                    cx="200"
                    cy="270"
                    r="5"
                    fill="#00d2ff"/>

                <circle
                    cx="310"
                    cy="195"
                    r="5.5"
                    fill="#00ffff"/>

                <circle
                    cx="440"
                    cy="115"
                    r="6"
                    fill="#ffe600"
                    class="neon-gold"/>

                <circle
                    cx="560"
                    cy="55"
                    r="6.5"
                    fill="#ffb700"
                    class="neon-gold"/>

                <circle
                    cx="710"
                    cy="25"
                    r="7"
                    fill="#ffe600"
                    class="neon-gold"/>

            </g>


            <!-- رأس السهم -->

            <g
                id="chart-arrow-head"
                class="neon-gold">

                <path
                    d="M 0 0 L -28 -14 L -20 0 L -28 14 Z"
                    fill="url(#chartLineGrad)"
                    stroke="#ffffff"

            </g>

</div>


<script>

/* =========================================================
   إنشاء علامات الساعة
========================================================= */

const ticksGroup =
    document.getElementById("ticks");

const SVG_NS =
    "http://www.w3.org/2000/svg";

for(let i = 0; i < 60; i++){

    const angle = i * 6;
    const isMajor = i % 5 === 0;

    const length =
        isMajor ? 13 : 6;

    const strokeWidth =
        isMajor ? 3.5 : 1.5;

    const line =
        document.createElementNS(
            SVG_NS,
            "line"
        );

    line.setAttribute("x1","150");
    line.setAttribute("y1","20");
    line.setAttribute("x2","150");
    line.setAttribute(
        "y2",
        20 + length
    );

    line.setAttribute(
        "stroke-width",
        strokeWidth
    );

    if(isMajor){

        line.setAttribute(
            "stroke",
            "#ffb700"
        );

        line.setAttribute(
            "class",
            "neon-gold"
        );

    }else{

        line.setAttribute(
            "stroke",
            "#00d2ff"
        );

        line.setAttribute(
            "opacity",
            ".75"
        );
    }

    line.setAttribute(
        "transform",
        `rotate(${angle} 150 150)`
    );

    ticksGroup.appendChild(line);
}


/* =========================================================
   العناصر
========================================================= */

const hourHand =
    document.getElementById("hour-hand");

const minuteHand =
    document.getElementById("minute-hand");

const archerSection =
    document.querySelector(".archer-section");

const bowString =
    document.getElementById("bow-string");

const targetBoard =
    document.getElementById("target-board");

const qArrow1 =
    document.getElementById("q-arrow-1");

const qArrow2 =
    document.getElementById("q-arrow-2");

const qArrow3 =
    document.getElementById("q-arrow-3");

const arrow1 =
    document.getElementById("arrow-1");

const arrow2 =
    document.getElementById("arrow-2");

const arrow3 =
    document.getElementById("arrow-3");

const chartSection =
    document.querySelector(".chart-section");

const chartPath =
    document.getElementById("chart-path");

const chartArrowHead =
    document.getElementById("chart-arrow-head");

const scrollProgress =
    document.getElementById("scroll-progress");


/* =========================================================
   طول الرسم
========================================================= */

const totalChartLength =
    chartPath.getTotalLength();

chartPath.style.strokeDasharray =
    totalChartLength;

chartPath.style.strokeDashoffset =
    totalChartLength;


/* =========================================================
   الحالة
========================================================= */

let currentArcherP = 0;
let currentChartP = 0;

let ticking = false;


/* =========================================================
   حالة السهم
========================================================= */

function getShotState(
    progress,
    start,
    end
){

    if(progress < start){

        return {
            phase:"waiting",
            p:0
        };

    }

    if(progress >= end){

        return {
            phase:"done",
            p:1
        };

    }

    return {
        phase:"active",
        p:
            (progress - start) /
            (end - start)
    };
}


/* =========================================================
   الحساب الرئيسي
========================================================= */

function update(){

    const scrollTop =
        window.scrollY;

    const documentHeight =
        document.documentElement.scrollHeight -
        window.innerHeight;

    const scrollFraction =
        documentHeight > 0
            ? Math.min(
                Math.max(
                    scrollTop / documentHeight,
                    0
                ),
                1
            )
            : 0;


    /* -----------------------------------------------
       شريط التقدم
    ------------------------------------------------ */

    scrollProgress.style.height =
        `${scrollFraction * 100}%`;


    /* -----------------------------------------------
       الساعة
    ------------------------------------------------ */

    const minuteAngle =
        355 +
        (
            scrollFraction *
            360 *
            12
        );

    const hourAngle =
        295 +
        (
            scrollFraction *
            360
        );

    minuteHand.setAttribute(
        "transform",
        `rotate(${minuteAngle} 150 150)`
    );

    hourHand.setAttribute(
        "transform",
        `rotate(${hourAngle} 150 150)`
    );


    /* -----------------------------------------------
       الرامي
    ------------------------------------------------ */

    const archerRect =
        archerSection.getBoundingClientRect();

    const archerStart =
        window.innerHeight * .85;

    const archerEnd =
        window.innerHeight * .15;

    let rawArcherP =
        (
            archerStart -
            archerRect.top
        ) /
        (
            archerStart -
            archerEnd
        );

    rawArcherP =
        Math.min(
            Math.max(
                rawArcherP,
                0
            ),
            1
        );


    currentArcherP +=
        (
            rawArcherP -
            currentArcherP
        ) * .13;


    const s1 =
        getShotState(
            currentArcherP,
            0,
            .33
        );

    const s2 =
        getShotState(
            currentArcherP,
            .33,
            .66
        );

    const s3 =
        getShotState(
            currentArcherP,
            .66,
            1
        );


    const shots =
        [s1,s2,s3];

    const arrows =
        [arrow1,arrow2,arrow3];


    qArrow1.style.opacity =
        s1.phase === "waiting"
            ? "1"
            : "0";

    qArrow2.style.opacity =
        s2.phase === "waiting"
            ? "1"
            : "0";

    qArrow3.style.opacity =
        s3.phase === "waiting"
            ? "1"
            : "0";


    let currentBowPull = 0;

    let targetHitImpact = false;


    const startX = -30;
    const targetHitX = 485;


    shots.forEach(
        (s,index)=>{

            const arrow =
                arrows[index];


            if(s.phase === "waiting"){

                arrow.style.opacity = "0";

            }

            else if(s.phase === "active"){

                arrow.style.opacity = "1";


                if(s.p < .25){

                    const pull =
                        (
                            s.p /
                            .25
                        ) * 28;

                    currentBowPull =
                        Math.max(
                            currentBowPull,
                            pull
                        );

                    arrow.setAttribute(
                        "transform",
                        `translate(${-pull},0)`
                    );

                }

                else{

                    const flightP =
                        (
                            s.p -
                            .25
                        ) /
                        .75;

                    const currentX =
                        startX +
                        (
                            flightP *
                            (
                                targetHitX -
                                startX
                            )
                        );

                    arrow.setAttribute(
                        "transform",
                        `translate(${currentX},0)`
                    );

                    if(flightP >= .88){

                        targetHitImpact =
                            true;

                    }

                }

            }

            else{

                arrow.style.opacity = "1";

                arrow.setAttribute(
                    "transform",
                    `translate(${targetHitX},0)`
                );

            }

        }
    );


    /* -----------------------------------------------
       القوس
    ------------------------------------------------ */

    const stringX =
        175 -
        currentBowPull;

    bowString.setAttribute(
        "d",
        `M 175,120 L ${stringX},185 L 175,250`
    );


    targetBoard.setAttribute(
        "transform",
        targetHitImpact
            ? "translate(6,0)"
            : "translate(0,0)"
    );


    /* -----------------------------------------------
       الرسم البياني
    ------------------------------------------------ */

    const chartRect =
        chartSection.getBoundingClientRect();

    const chartStart =
        window.innerHeight * .85;

    const chartEnd =
        window.innerHeight * .20;


    let rawChartP =
        (
            chartStart -
            chartRect.top
        ) /
        (
            chartStart -
            chartEnd
        );


    rawChartP =
        Math.min(
            Math.max(
                rawChartP,
                0
            ),
            1
        );


    currentChartP +=
        (
            rawChartP -
            currentChartP
        ) * .13;


    const drawLength =
        currentChartP *
        totalChartLength;


    chartPath.style.strokeDashoffset =
        totalChartLength -
        drawLength;


    if(drawLength > .5){

        chartArrowHead.style.opacity = "1";


        const pt =
            chartPath.getPointAtLength(
                drawLength
            );

        const ptPrev =
            chartPath.getPointAtLength(
                Math.max(
                    0,
                    drawLength - 3
                )
            );


        const angle =
            Math.atan2(
                pt.y - ptPrev.y,
                pt.x - ptPrev.x
            ) *
            (180 / Math.PI);


        chartArrowHead.setAttribute(
            "transform",
            `translate(${pt.x},${pt.y}) rotate(${angle})`
        );

    }else{

        chartArrowHead.style.opacity = "0";

    }

    ticking = false;
}


/* =========================================================
   طلب إطار واحد فقط
   يمنع تكدس عمليات الـ Scroll
========================================================= */

function requestUpdate(){

    if(!ticking){

        ticking = true;

        requestAnimationFrame(
            update
        );

    }

}


window.addEventListener(
    "scroll",
    requestUpdate,
    {
        passive:true
    }
);

window.addEventListener(
    "resize",
    requestUpdate,
    {
        passive:true
    }
);


/* =========================================================
   تشغيل أولي
========================================================= */

update();

</script>

</body>
</html>
