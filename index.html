<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hanging Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية الصفحة بيضاء بالكامل */
            background-color: #ffffff;
            height: 500vh;
            overflow-x: hidden;
            position: relative;
        }

        /* وضع البرواز المعلق في منتصف شاشة البداية تماماً */
        .hanging-wrapper {
            position: absolute;
            top: 50vh; /* 50% من ارتفاع الشاشة الأولى */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
        }

        /* مسمار التعليق المضيء */
        .wall-nail {
            width: 18px;
            height: 18px;
            background-color: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00d2ff, 0 0 24px #00d2ff;
            margin-bottom: -2px;
            z-index: 2;
        }

        /* حبل التعليق المضيء */
        .hanging-string {
            width: 3px;
            height: 65px;
            background: linear-gradient(to bottom, #00d2ff, rgba(0, 210, 255, 0.4));
            box-shadow: 0 0 10px #00d2ff;
        }

        /* البرواز */
        .frame-box {
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #00d2ff;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.4),
                inset 0 0 20px rgba(0, 210, 255, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* حجم الساعة */
        .clock-container {
            width: 440px;
            height: 440px;
            max-width: 85vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible !important;
        }

        /* توهج النيون الأزرق */
        .neon-glow {
            filter: drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 15px #00d2ff);
        }

        /* الهالة الخارجية */
        .outer-aura {
            filter: drop-shadow(0 0 12px #00d2ff) drop-shadow(0 0 25px #00d2ff);
        }
    </style>
</head>
<body>

    <!-- البرواز المعلق في منتصف شاشة البداية -->
    <div class="hanging-wrapper">
        <div class="wall-nail"></div>
        <div class="hanging-string"></div>

        <div class="frame-box">
            <div class="clock-container">
                <svg viewBox="-70 -70 440 440">
                    <!-- إطار الساعة المضيء -->
                    <circle cx="150" cy="150" r="135" fill="none" stroke="#00d2ff" stroke-width="3.5" class="outer-aura" />

                    <!-- علامات الساعة -->
                    <g id="ticks" stroke="#00d2ff" stroke-linecap="round" class="neon-glow"></g>

                    <!-- عقرب الساعات (أزرق نيون) -->
                    <g id="hour-hand" transform="rotate(295 150 150)">
                        <polygon points="146,150 154,150 151,85 149,85" fill="#00d2ff" stroke="#00d2ff" stroke-width="1" class="neon-glow" />
                    </g>

                    <!-- عقرب الدقائق (أزرق نيون) -->
                    <g id="minute-hand" transform="rotate(355 150 150)">
                        <line x1="150" y1="185" x2="150" y2="40" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" class="neon-glow" />
                    </g>

                    <!-- المركز المضيء -->
                    <circle cx="150" cy="150" r="8" fill="#00d2ff" stroke="#00d2ff" stroke-width="2" class="neon-glow" />
                </svg>
            </div>
        </div>
    </div>

    <script>
        // رسم علامات الساعة (60 شرطة)
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const length = isMajor ? 12 : 6;
            const strokeWidth = isMajor ? 3 : 1.5;
            const opacity = isMajor ? 1 : 0.75;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", 20 + length);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("opacity", opacity);
            line.setAttribute("transform", `rotate(${angle} 150 150)`);

            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        let targetFraction = 0;
        let currentFraction = 0;

        // تحديث نسبة التمرير
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            targetFraction = scrollTop / maxScroll;
        });

        // حركة انسيابية للعقارب عند التمرير
        function animate() {
            currentFraction += (targetFraction - currentFraction) * 0.1;

            const minuteAngle = 355 + (currentFraction * 360 * 12);
            const hourAngle = 295 + (currentFraction * 360);

            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
