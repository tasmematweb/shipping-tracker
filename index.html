<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H.L. LeVance — Premium Intro</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #d8b47a;
}


/* =========================================================
   INTRO
========================================================= */

.intro {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 25% 35%,
            rgba(255, 235, 185, 0.28),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 80% 70%,
            rgba(190, 145, 80, 0.16),
            transparent 50%
        ),
        #d8b47a;

    z-index: 9999;

    transform-origin: center center;

    will-change:
        opacity,
        transform;
}


/* =========================================================
   SUBTLE TEXTURE
========================================================= */

.intro::after {

    content: "";

    position: absolute;
    inset: -10%;

    pointer-events: none;

    opacity: 0.18;

    background-image:
        repeating-linear-gradient(
            45deg,
            rgba(100, 60, 20, 0.04) 0px,
            rgba(100, 60, 20, 0.04) 1px,
            transparent 1px,
            transparent 7px
        );

    animation: textureMove 10s ease-in-out infinite alternate;
}

@keyframes textureMove {

    from {
        transform: translate3d(-1%, -1%, 0);
    }

    to {
        transform: translate3d(1%, 1%, 0);
    }
}


/* =========================================================
   CINEMATIC LIGHT
========================================================= */

.light {

    position: absolute;

    width: 65vw;
    height: 65vw;

    max-width: 900px;
    max-height: 900px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 245, 210, 0.22) 0%,
            rgba(255, 235, 180, 0.08) 35%,
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;

    transform: translate3d(-20%, -5%, 0);

    animation:
        cinematicLight 8s
        ease-in-out
        infinite alternate;
}

@keyframes cinematicLight {

    0% {
        transform:
            translate3d(-18%, -8%, 0)
            scale(0.95);
        opacity: 0.55;
    }

    50% {
        transform:
            translate3d(10%, 5%, 0)
            scale(1.05);
        opacity: 0.9;
    }

    100% {
        transform:
            translate3d(-5%, 12%, 0)
            scale(1);
        opacity: 0.65;
    }
}


/* =========================================================
   LOGO CONTAINER
========================================================= */

.logo-stage {

    position: relative;

    width: min(82vw, 900px);

    aspect-ratio: 1 / 0.38;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 10;

    transform:
        translate3d(-120vw, 0, 0);

    will-change:
        transform;
}


/*
    IMPORTANT

    Replace "logo.png" with the actual transparent PNG/SVG
    of the final H.L. LeVance logo.

    The logo itself is NOT recreated using a web font.
*/

.logo-image {

    width: 100%;
    height: auto;

    display: block;

    user-select: none;

    pointer-events: none;

    object-fit: contain;

    will-change:
        transform,
        opacity;
}


/* =========================================================
   CARROT
========================================================= */

.carrot {

    position: absolute;

    /*
       Position above the C.

       These values are relative to the logo-stage.
       Adjust only these two values if your final logo
       has a slightly different C position.
    */

    left: 74.5%;
    top: -10%;

    width: clamp(
        24px,
        4vw,
        55px
    );

    height: auto;

    opacity: 0;

    pointer-events: none;

    z-index: 30;

    transform:
        translate3d(0, 45px, 0)
        rotate(-8deg)
        scale(0.65);

    transform-origin: center bottom;

    will-change:
        transform,
        opacity;
}


/* =========================================================
   FINAL CAMERA PUSH
========================================================= */

.intro.camera-push {

    animation:
        cameraPush 2.5s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

@keyframes cameraPush {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.025);
    }
}


/* =========================================================
   EXIT
========================================================= */

.intro.exit {

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.9s
        cubic-bezier(.22,.61,.36,1);
}


/* =========================================================
   MAIN WEBSITE
========================================================= */

#main-site {

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    opacity: 0;

    visibility: hidden;

    background: #d8b47a;

    transition:
        opacity 0.9s ease,
        visibility 0s linear 0.9s;
}

#main-site.visible {

    opacity: 1;

    visibility: visible;

    transition:
        opacity 0.9s ease;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .logo-stage {

        width: 88vw;

        aspect-ratio: 1 / 0.45;
    }

    .carrot {

        left: 74%;

        top: -8%;

        width: 28px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .intro *,
    .intro {

        animation: none !important;

        transition: none !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     PREMIUM INTRO
======================================================= -->

<section
    class="intro"
    id="intro"
    aria-label="H.L. LeVance introduction"
>

    <div class="light"></div>


    <div
        class="logo-stage"
        id="logoStage"
    >

        <!--
            USE YOUR ACTUAL FINAL LOGO HERE.

            Recommended:
            transparent PNG or SVG.

            Example:
            /assets/hl-levance-logo.png
        -->

        <img
            id="logoImage"
            class="logo-image"
            src="hl-levance-logo.png"
            alt="H.L. LeVance"
            draggable="false"
        >


        <!--
            IMPORTANT:

            Use a transparent PNG/SVG carrot here.

            Do NOT use the 🥕 emoji.
        -->

        <img
            id="carrot"
            class="carrot"
            src="carrot.svg"
            alt=""
            draggable="false"
        >

    </div>

</section>


<!-- =======================================================
     MAIN WEBSITE
======================================================= -->

<main id="main-site">

    <!--
        YOUR ACTUAL WEBSITE CONTENT GOES HERE.
    -->

</main>


<!-- =======================================================
     GSAP
======================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>


<script>

document.addEventListener("DOMContentLoaded", () => {

    const intro =
        document.getElementById("intro");

    const logoStage =
        document.getElementById("logoStage");

    const carrot =
        document.getElementById("carrot");

    const mainSite =
        document.getElementById("main-site");


    /* =====================================================
       INITIAL STATE
    ===================================================== */

    gsap.set(logoStage, {

        x: "-120vw",

        opacity: 1,

        scale: 1
    });


    gsap.set(carrot, {

        opacity: 0,

        x: 0,

        y: 45,

        rotation: -8,

        scale: 0.65
    });


    /* =====================================================
       MASTER TIMELINE
    ===================================================== */

    const timeline = gsap.timeline({

        defaults: {

            overwrite: "auto"
        }

    });


    /* =====================================================
       SCENE 1
       Background
    ===================================================== */

    timeline.to({}, {

        duration: 0.8

    });


    /* =====================================================
       SCENE 2
       LOGO ENTERS FROM LEFT
    ===================================================== */

    timeline.to(
        logoStage,
        {

            x: "0vw",

            duration: 1.45,

            ease: "power4.out"

        }
    );


    /* =====================================================
       SCENE 3
       MICRO OVERSHOOT
    ===================================================== */

    timeline.to(
        logoStage,
        {

            x: "1.2%",

            duration: 0.14,

            ease: "power2.out"

        }
    );


    timeline.to(
        logoStage,
        {

            x: "0%",

            duration: 0.18,

            ease: "power2.inOut"

        }
    );


    /* =====================================================
       SCENE 4
       SHORT BRAND PAUSE
    ===================================================== */

    timeline.to({}, {

        duration: 0.65

    });


    /* =====================================================
       SCENE 5
       CARROT JUMP
    ===================================================== */

    timeline.to(
        carrot,
        {

            opacity: 1,

            duration: 0.15,

            ease: "power1.out"

        }
    );


    /*
       Main jump.

       The carrot moves upward while rotating
       slightly, then approaches the C.
    */

    timeline.to(
        carrot,
        {

            x: "-5px",

            y: "-72px",

            rotation: 8,

            scale: 1.12,

            duration: 0.48,

            ease: "power2.out"

        }
    );


    /* =====================================================
       SCENE 6
       LANDING
    ===================================================== */

    timeline.to(
        carrot,
        {

            x: "0px",

            y: "-55px",

            rotation: 0,

            scale: 1,

            duration: 0.35,

            ease: "back.out(1.5)"

        }
    );


    /* =====================================================
       SCENE 7
       VERY SMALL LANDING BOUNCE
    ===================================================== */

    timeline.to(
        carrot,
        {

            scale: 1.08,

            duration: 0.09,

            ease: "power1.out"

        }
    );


    timeline.to(
        carrot,
        {

            scale: 1,

            duration: 0.12,

            ease: "power2.inOut"

        }
    );


    /* =====================================================
       SCENE 8
       HERO HOLD
    ===================================================== */

    timeline.to({}, {

        duration: 0.7

    });


    /* =====================================================
       SCENE 9
       CINEMATIC CAMERA PUSH
    ===================================================== */

    timeline.add(() => {

        intro.classList.add("camera-push");

    });


    timeline.to({}, {

        duration: 1.1

    });


    /* =====================================================
       SCENE 10
       TRANSITION TO WEBSITE
    ===================================================== */

    timeline.add(() => {

        intro.classList.add("exit");

        mainSite.classList.add("visible");

    });


    /* =====================================================
       CLEANUP
    ===================================================== */

    timeline.add(() => {

        intro.style.display = "none";

    });


});


/* =========================================================
   PREVENT IMAGE DRAG
========================================================= */

document.querySelectorAll("img").forEach(image => {

    image.addEventListener(
        "dragstart",
        event => event.preventDefault()
    );

});

</script>


</body>
</html>
