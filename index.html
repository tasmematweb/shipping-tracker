<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EUX Express - لوحة العميل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #0076ff; --secondary-color: #1a1a1a; --light-bg: #f9f9f9; --text-color: #333; --white: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        body { background: linear-gradient(135deg, #e8f0fe, #d4e4f7); min-height: 100vh; padding: 20px; color: var(--text-color); }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 24px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        .header-new { background: linear-gradient(135deg, #0a1628, #003d7a); padding: 18px 30px; display: flex; justify-content: center; align-items: center; border-radius: 16px 16px 0 0; margin: -30px -30px 20px -30px; }
        .header-new .logo-text { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 3px; }
        .header-new .logo-text span { color: #0076ff; }
        .tracking-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eef3f8; flex-wrap: wrap; gap: 10px; }
        .tracking-header h2 { color: #0d2137; font-weight: 700; font-size: 18px; }
        .tracking-header h2 i { color: #0076ff; margin-left: 8px; }
        .total-small { font-size: 13px; color: #888; font-weight: 600; }
        .total-small .count { color: #0076ff; font-weight: 900; font-size: 16px; }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .shipment-card { background: #f8fafc; border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; border: 1px solid #e8ecf0; cursor: pointer; transition: 0.25s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .shipment-card:hover { background: #f0f4fa; box-shadow: 0 4px 16px rgba(0,0,0,0.05); transform: translateY(-2px); }
        .shipment-card .summary-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .shipment-card .summary-row .main-info { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .shipment-card .summary-row .main-info .name { font-weight: 700; font-size: 16px; color: #0d2137; }
        .shipment-card .summary-row .main-info .phone { color: #555; direction: ltr; font-size: 14px; }
        .shipment-card .summary-row .main-info .amount { color: #0076ff; font-weight: 700; font-size: 15px; }
        .shipment-card .summary-row .last-update { font-size: 12px; color: #888; direction: ltr; background: #eef3f8; padding: 4px 14px; border-radius: 20px; }
        .shipment-card .status-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; padding: 6px 12px; background: #e8f5e9; border-radius: 10px; border-right: 4px solid #2e7d32; }
        .shipment-card .status-row .status-label { font-size: 13px; color: #555; font-weight: 600; }
        .shipment-card .status-row .status-value { font-size: 14px; color: #2e7d32; font-weight: 700; }
        .shipment-card .status-row.loading-status { background: #fff8e1; border-right-color: #f9a825; }
        .shipment-card .status-row.loading-status .status-value { color: #f9a825; }
        .shipment-card .status-row.error-status { background: #ffeaea; border-right-color: #dc3545; }
        .shipment-card .status-row.error-status .status-value { color: #dc3545; }
        .shipment-card .status-row.info-status { background: #e3f2fd; border-right-color: #0d47a1; }
        .shipment-card .status-row.info-status .status-value { color: #0d47a1; }
        .shipment-card .details { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #dce5ed; display: none; }
        .shipment-card .details.open { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .shipment-card .details .info { margin: 5px 0; font-size: 13px; color: #555; }
        .shipment-card .details .info strong { color: #0d2137; margin-left: 5px; }
        .shipment-card .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-eux, .btn-eux-orange, .btn-eux-red, .btn-eux-outline { --round: 0.75rem; cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; transition: all 0.25s ease; border-radius: var(--round); border: none; outline: none; padding: 12px 18px; font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 14px; color: white; }
        .btn-eux { background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(0,118,255,0.6) 0%, rgba(0,118,255,0) 100%), linear-gradient(0deg, #0076ff, #0076ff); box-shadow: 0 4px 15px rgba(0,118,255,0.25); }
        .btn-eux-orange { background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(255,152,0,0.6) 0%, rgba(255,152,0,0) 100%), linear-gradient(0deg, #ff9800, #ff9800); box-shadow: 0 4px 15px rgba(255,152,0,0.25); }
        .btn-eux-red { background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(220,53,69,0.6) 0%, rgba(220,53,69,0) 100%), linear-gradient(0deg, #dc3545, #dc3545); box-shadow: 0 4px 15px rgba(220,53,69,0.25); }
        .btn-eux-outline { background: transparent; border: 1.5px solid #ddd; color: #0d2137; box-shadow: none; }
        .btn-eux-outline:hover { background: #f5f5f5; }
        .btn-eux .inner, .btn-eux-orange .inner, .btn-eux-red .inner, .btn-eux-outline .inner { z-index: 2; gap: 6px; position: relative; width: 100%; color: inherit; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; line-height: 1.5; }
        .btn-eux .fold, .btn-eux-orange .fold, .btn-eux-red .fold, .btn-eux-outline .fold { z-index: 1; position: absolute; top: 0; right: 0; height: 1rem; width: 1rem; display: inline-block; transition: all 0.5s ease-in-out; border-bottom-left-radius: 0.5rem; border-top-right-radius: var(--round); }
        .btn-eux .fold { background: radial-gradient(100% 75% at 55%, rgba(0,118,255,0.6) 0%, rgba(0,118,255,0) 100%); box-shadow: 0 0 3px rgba(0,0,0,0.2); }
        .btn-eux-orange .fold { background: radial-gradient(100% 75% at 55%, rgba(255,152,0,0.6) 0%, rgba(255,152,0,0) 100%); box-shadow: 0 0 3px rgba(0,0,0,0.2); }
        .btn-eux-red .fold { background: radial-gradient(100% 75% at 55%, rgba(220,53,69,0.6) 0%, rgba(220,53,69,0) 100%); box-shadow: 0 0 3px rgba(0,0,0,0.2); }
        .btn-eux-outline .fold { background: radial-gradient(100% 75% at 55%, rgba(13,33,55,0.1) 0%, rgba(13,33,55,0) 100%); box-shadow: 0 0 3px rgba(0,0,0,0.1); }
        .btn-eux:hover .fold, .btn-eux-orange:hover .fold, .btn-eux-red:hover .fold, .btn-eux-outline:hover .fold { margin-top: -1rem; margin-right: -1rem; }
        .track-btn-spinner { position: relative; border-radius: 50%; height: 44px; width: 44px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent; padding: 0; transition: transform 0.25s ease; }
        .track-btn-spinner .ring { position: absolute; border-radius: 50%; height: 100%; width: 100%; animation: rotate_3922 1.2s linear infinite; }
        .track-btn-spinner .ring:nth-of-type(1) { background: linear-gradient(135deg, #0076ff, #4fc3f7, #0076ff); filter: blur(2px); }
        .track-btn-spinner .ring:nth-of-type(2) { background: linear-gradient(135deg, #0076ff, #4fc3f7, #0076ff); filter: blur(4px); animation-duration: 1.4s; }
        .track-btn-spinner .ring:nth-of-type(3) { background: linear-gradient(135deg, #0076ff, #4fc3f7, #0076ff); filter: blur(10px); animation-duration: 1.6s; }
        .track-btn-spinner .ring:nth-of-type(4) { background: linear-gradient(135deg, #0076ff, #4fc3f7, #0076ff); filter: blur(20px); animation-duration: 1.8s; }
        .track-btn-spinner .inner-circle { position: relative; z-index: 5; background: white; border-radius: 50%; height: 74%; width: 74%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 8px rgba(0,0,0,0.06); }
        .track-btn-spinner .track-text { font-size: 12px; font-weight: 800; color: #0076ff; font-family: 'Cairo', sans-serif; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; text-align: center; line-height: 1.2; }
        @keyframes rotate_3922 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .track-btn-spinner:hover { transform: scale(1.1); }
        .track-btn-spinner:active { transform: scale(0.92); }
        .loading { text-align: center; padding: 30px 0; }
        .spinner { border: 4px solid #e8ecf0; border-top: 4px solid #0076ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px 20px; color: #aaa; }
        .empty-state .icon { font-size: 56px; margin-bottom: 12px; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0d2137; color: white; padding: 12px 28px; border-radius: 14px; font-size: 14px; z-index: 9999; animation: toastIn 0.3s ease; max-width: 90%; text-align: center; font-family: 'Cairo', sans-serif; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .modal-content { background: white; border-radius: 20px; padding: 28px 25px 25px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; position: relative; animation: modalIn 0.3s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        @keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-content h3 { margin-bottom: 20px; text-align: center; font-size: 22px; font-weight: 700; color: #0d2137; }
        .modal-content h3 i { color: #0076ff; margin-left: 8px; }
        .close-btn { position: absolute; top: 16px; left: 20px; font-size: 28px; cursor: pointer; color: #aaa; line-height: 1; transition: 0.2s; }
        .close-btn:hover { color: #333; transform: rotate(90deg); }
        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 700; color: #0d2137; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 15px; border: 2px solid #e8ecf0; border-radius: 10px; font-size: 14px; font-family: 'Cairo', sans-serif; background: #f8fafc; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #0076ff; outline: none; background: white; box-shadow: 0 0 0 4px rgba(0,118,255,0.08); }
        .form-group textarea { height: 80px; resize: vertical; }
        .timeline-item { border-right: 3px solid #0076ff; padding: 12px 16px 12px 0; margin-right: 10px; margin-bottom: 14px; background: #f8fafc; border-radius: 0 10px 10px 0; transition: 0.2s; }
        .timeline-item:hover { background: #f0f6fe; }
        .timeline-item .time { color: #999; font-size: 13px; }
        .timeline-item .event { font-weight: 700; color: #0d2137; margin: 5px 0; }
        .timeline-item .location { color: #666; font-size: 14px; }
        .timeline-item .problem { color: #dc3545; font-size: 13px; margin-top: 4px; }
        .refresh-all-btn { background: #0076ff; color: white; border: none; padding: 8px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 13px; transition: 0.2s; }
        .refresh-all-btn:hover { background: #005dc7; transform: scale(1.02); }
        .refresh-all-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-purple { background: #7B2FBE; color: white; }
        .btn-purple:hover { background: #5B1F8E; }
        @media (max-width: 768px) { .container { padding: 15px; } .header-new { padding: 12px 16px; margin: -15px -15px 15px -15px; } .header-new .logo-text { font-size: 20px; } .shipment-card { padding: 12px 14px; } }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- الشريط العلوي -->
        <header class="header-new">
            <div class="logo-text"><span>EUX</span> EXPRESS</div>
        </header>

        <!-- ====== صفحة تسجيل الدخول ====== -->
        <div id="loginPage">
            <div style="text-align:center;padding:20px 0;">
                <div style="font-size:48px;margin-bottom:10px;">📦</div>
                <div style="font-size:24px;font-weight:700;color:#0d2137;">مرحبا بك في <span style="color:#0076ff;">EUX Express</span></div>
                <p style="color:#888;font-size:14px;margin-top:8px;">يمكنك تصفح الشحنات العامة بدون تسجيل دخول</p>
            </div>
            <div style="margin-bottom:16px;">
                <input type="text" id="phoneInput" placeholder="رقم الهاتف" dir="ltr" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')" style="width:100%;padding:16px 20px;border:2px solid #e8ecf0;border-radius:14px;font-size:16px;font-family:'Cairo',sans-serif;background:#f8fafc;transition:0.3s;text-align:right;">
            </div>
            <div style="margin-bottom:16px;">
                <input type="password" id="passwordInput" placeholder="كلمة المرور" dir="ltr" style="width:100%;padding:16px 20px;border:2px solid #e8ecf0;border-radius:14px;font-size:16px;font-family:'Cairo',sans-serif;background:#f8fafc;transition:0.3s;text-align:right;">
            </div>
            <button onclick="doLogin()" style="width:100%;padding:16px;border-radius:14px;font-size:18px;background:#0076ff;color:white;border:none;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;box-shadow:0 4px 15px rgba(0,118,255,0.25);">دخول</button>
            <button onclick="loadPublicShipments()" style="width:100%;padding:14px;border-radius:14px;font-size:16px;margin-top:10px;background:transparent;color:#0076ff;border:2px solid #0076ff;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;">تصفح بدون تسجيل</button>
            <p id="loginError" style="color:#dc3545;font-size:14px;margin-top:14px;padding:10px;background:#ffeaea;border-radius:8px;display:none;"></p>
        </div>

        <!-- ====== لوحة التحكم ====== -->
        <div id="dashboard" class="hidden">
            <div class="tracking-header">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <h2><i class="fas fa-tachometer-alt"></i> شحناتي</h2>
                    <span class="total-small">اجمالي: <span class="count" id="totalCountSmall">0</span></span>
                </div>
                <div class="header-actions">
                    <button class="refresh-all-btn" onclick="refreshAllShipments()">
                        <i class="fas fa-sync-alt"></i> تحديث الكل
                    </button>
                    <button class="btn-eux-outline" onclick="logout()" style="padding:8px 16px;border-radius:10px;font-size:13px;">
                        <span class="inner">خروج</span>
                    </button>
                </div>
            </div>
            <div id="content"></div>
        </div>

        <!-- ====== مودال ====== -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">×</span>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // الكود الرئيسي
        // ============================================================

        const API_URL = "https://script.google.com/macros/s/AKfycbwiI6c4Kxh3EQxmCWwipr0MsAHgfPUadPqP9LqnUH9WGeGu0QuCXbl-sLTcS7l9NbJu/exec";

        let currentUser = null;
        let allShipmentsData = [];
        let trackingCache = {};
        let hasLoadedOnce = false;
        let isRefreshing = false;
        let isAutoRefreshing = false;

        // ============================================================
        // الكاش والتتبع
        // ============================================================

        const TRACKING_CACHE_KEY = 'eux_tracking_cache';
        const TRACKING_CACHE_DURATION = 30 * 60 * 1000;

        function getTrackingCache() {
            try { const cached = localStorage.getItem(TRACKING_CACHE_KEY); return cached ? JSON.parse(cached) : {}; } catch (e) { return {}; }
        }

        function cacheTrackingStatus(trackingNumber, status) {
            try {
                const cache = getTrackingCache();
                cache[trackingNumber] = { status, timestamp: Date.now() };
                localStorage.setItem(TRACKING_CACHE_KEY, JSON.stringify(cache));
            } catch (e) {}
        }

        function getCachedTrackingStatus(trackingNumber) {
            const cache = getTrackingCache();
            const entry = cache[trackingNumber];
            if (entry && (Date.now() - entry.timestamp < TRACKING_CACHE_DURATION)) return entry.status;
            return null;
        }

        async function fetchTrackingStatus(trackingNumber) {
            if (!trackingNumber || trackingNumber.length < 3) return null;
            const cached = getCachedTrackingStatus(trackingNumber);
            if (cached) return cached;
            if (trackingCache[trackingNumber]) return trackingCache[trackingNumber];
            try {
                const res = await fetch(`${API_URL}?action=track&billCode=${trackingNumber}`);
                const data = await res.json();
                if (data.code === "1" && data.data && data.data[0]) {
                    let status = data.data[0].status || null;
                    const details = data.data[0].details || [];
                    for (const d of details) {
                        if ((d.desc || '').includes('تم التسليم')) { status = 'تم التسليم'; break; }
                    }
                    if (status && status.includes('تم التسليم')) status = 'تم التسليم';
                    trackingCache[trackingNumber] = status;
                    cacheTrackingStatus(trackingNumber, status);
                    return status;
                }
                trackingCache[trackingNumber] = null;
                return null;
            } catch (e) { return null; }
        }

        // ============================================================
        // زر التحديث الفوري (يدوي) - اللون البنفسجي
        // ============================================================

        async function forceUpdateTracking(shipmentId, trackingNumber) {
            const card = document.getElementById(`card-${shipmentId}`);
            if (card) {
                const statusValue = card.querySelector('.status-value');
                if (statusValue) { statusValue.textContent = 'جاري التحديث...';
                    statusValue.style.color = '#ff9800'; }
            }
            try {
                const status = await fetchTrackingStatus(trackingNumber);
                if (status) {
                    cacheTrackingStatus(trackingNumber, status);
                    updateShipmentStatusCard(shipmentId, status);
                    showToast('✅ تم تحديث الحالة!', 'success');
                } else { showToast('❌ فشل التحديث', 'error'); }
            } catch (e) { showToast('❌ خطأ في الاتصال', 'error'); }
        }

        // ============================================================
        // ❌ لا يوجد تحديث تلقائي (setInterval)
        // ============================================================

        // ============================================================
        // زر تحديث الكل - يضغط على جميع أزرار "تحديث الآن"
        // ============================================================

        async function refreshAllShipments() {
            if (isRefreshing) return;
            isRefreshing = true;
            const btn = document.querySelector('.refresh-all-btn');
            if (btn) { btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحديث...'; }

            try {
                // 1. جلب الشحنات الجديدة من الخادم
                const loadFn = currentUser ? loadMyShipments : loadPublicShipments;
                const data = await loadFn();
                if (data && data.length > 0) {
                    allShipmentsData = data;
                    const cacheKey = currentUser ? `eux_shipments_${currentUser.phone}` : 'eux_shipments_public';
                    cacheShipments(data, cacheKey);
                    document.getElementById('totalCountSmall').textContent = data.length;
                    renderShipments(data);
                    showToast('✅ تم تحديث جميع الشحنات!', 'success');
                } else {
                    showToast('⚠️ لا توجد شحنات جديدة', '');
                }

                // 2. 🔹 الضغط على جميع أزرار "تحديث الآن" تلقائياً (البنفسجية)
                const updateButtons = document.querySelectorAll('.force-update-btn');
                if (updateButtons.length > 0) {
                    console.log(`🔄 جارٍ تحديث ${updateButtons.length} شحنة...`);
                    showToast(`🔄 جارٍ تحديث ${updateButtons.length} شحنة...`, '');
                    
                    // الضغط على كل زر مع تأخير 300ms بين كل زر
                    updateButtons.forEach((btn, index) => {
                        setTimeout(() => {
                            btn.click();
                        }, index * 300);
                    });
                    
                    // رسالة بعد الانتهاء من جميع التحديثات
                    setTimeout(() => {
                        showToast(`✅ تم تحديث ${updateButtons.length} شحنة!`, 'success');
                    }, updateButtons.length * 300 + 1000);
                } else {
                    console.log('ℹ️ لا توجد أزرار تحديث للضغط عليها');
                }

            } catch (e) {
                showToast('❌ فشل التحديث', 'error');
                console.error('خطأ في تحديث الكل:', e);
            }

            isRefreshing = false;
            if (btn) { btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> تحديث الكل'; }
            
            setTimeout(() => { isAutoRefreshing = false; }, 3000);
        }

        // ============================================================
        // التحديث التلقائي عند أي Refresh للصفحة
        // ============================================================

        function autoRefreshAll() {
            if (isAutoRefreshing) return;
            const btn = document.querySelector('.refresh-all-btn');
            if (btn && !btn.disabled) {
                isAutoRefreshing = true;
                btn.click();
                console.log('🔄 تحديث تلقائي بعد Refresh');
                setTimeout(() => { isAutoRefreshing = false; }, 5000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => setTimeout(autoRefreshAll, 1500));
        window.addEventListener('load', () => setTimeout(autoRefreshAll, 2000));
        window.addEventListener('pageshow', (e) => { if (e.persisted) setTimeout(autoRefreshAll, 1500); });
        window.addEventListener('hashchange', () => setTimeout(autoRefreshAll, 1000));

        // ============================================================
        // إضافة أزرار التحديث للبطاقات (اللون البنفسجي)
        // ============================================================

        function addUpdateButtons() {
            document.querySelectorAll('.shipment-card').forEach(card => {
                if (card.querySelector('.force-update-btn')) return;
                const actions = card.querySelector('.actions');
                if (!actions) return;
                const data = card.dataset.shipment;
                if (!data) return;
                try {
                    const s = JSON.parse(data);
                    if (s.trackingNumber && s.trackingNumber.length > 3) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-eux force-update-btn btn-purple';
                        btn.style.cssText = 'padding:4px 12px;border-radius:8px;font-size:12px;background:#7B2FBE;';
                        btn.innerHTML = `<span class="inner"><i class="fas fa-sync-alt"></i> تحديث الآن</span><span class="fold"></span>`;
                        btn.onclick = function(e) { e.stopPropagation();
                            forceUpdateTracking(s.id, s.trackingNumber); };
                        actions.appendChild(btn);
                    }
                } catch (e) {}
            });
        }

        // ============================================================
        // عرض البطاقات
        // ============================================================

        function updateShipmentStatusCard(shipmentId, status) {
            const card = document.getElementById(`card-${shipmentId}`);
            if (!card) return;
            const row = card.querySelector('.status-row');
            if (!row) return;
            row.classList.remove('loading-status', 'error-status', 'info-status');
            const val = row.querySelector('.status-value');
            const label = row.querySelector('.status-label');
            if (status) {
                label.textContent = 'الحالة:';
                let display = status,
                    isError = false,
                    isSuccess = false;
                if (status.includes('خطأ') || status.includes('Error')) { isError = true;
                    display = 'خطأ ' + status.replace(/خطأ/g, '').trim(); if (!display || display === 'خطأ') display = 'خطأ في التوصيل'; } else if (status.includes('تم التسليم')) { isSuccess = true;
                    display = '✅ تم التسليم'; } else if (status.includes('Delivered')) { isSuccess = true;
                    display = '✅ تم التسليم'; }
                val.textContent = display;
                if (isSuccess) { row.style.background = '#e8f5e9';
                    row.style.borderRightColor = '#2e7d32';
                    val.style.color = '#2e7d32'; } else if (isError) { row.style.background = '#ffeaea';
                    row.style.borderRightColor = '#dc3545';
                    val.style.color = '#dc3545'; } else { row.style.background = '#e3f2fd';
                    row.style.borderRightColor = '#0d47a1';
                    val.style.color = '#0d47a1'; }
            } else {
                label.textContent = 'الحالة:';
                row.style.background = '#f5f5f5';
                row.style.borderRightColor = '#999';
                val.style.color = '#999';
                val.textContent = 'غير معروف';
            }
        }

        function createShipmentCard(s) {
            const trackingNum = s.trackingNumber || '';
            const hasTracking = trackingNum && trackingNum.length > 3;
            let actions = '';
            let trackBtn = '';

            if (hasTracking) {
                trackBtn = `
                    <button class="track-btn-spinner" onclick="event.stopPropagation(); trackShipment('${trackingNum}')">
                        <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
                        <span class="inner-circle"><span class="track-text">تتبع</span></span>
                    </button>
                `;
            }

            if (!hasTracking) {
                actions += `
                    <button class="btn-eux-orange" onclick="event.stopPropagation(); showEditForm('${s.id}')" style="padding:6px 16px;border-radius:8px;font-size:13px;">
                        <span class="inner">تعديل</span><span class="fold"></span>
                    </button>
                    <button class="btn-eux-red" onclick="event.stopPropagation(); deleteShipment('${s.id}')" style="padding:6px 16px;border-radius:8px;font-size:13px;">
                        <span class="inner">حذف</span><span class="fold"></span>
                    </button>
                `;
            }

            const displayName = s.receiverName || s.customerName || 'غير معروف';
            const displayPhone = s.receiverPhone || s.customerPhone || '';
            const displayAmount = s.amount || '0';
            const lastUpdate = s.lastUpdate || s.date || '';
            const updateText = lastUpdate ? 'آخر تحديث: ' + lastUpdate : '';

            return `<div class="shipment-card" onclick="toggleDetails(this)" id="card-${s.id}" data-shipment='${JSON.stringify(s).replace(/'/g, "\\'")}'>
                <div class="summary-row">
                    <div class="main-info">
                        <span class="name">${displayName}</span>
                        <span class="phone">${displayPhone}</span>
                        ${trackBtn}
                        <span class="amount">${displayAmount} ج.م</span>
                    </div>
                    <div class="last-update">${updateText}</div>
                </div>
                <div class="status-row">
                    <span class="status-label">الحالة:</span>
                    <span class="status-value">جاري التحميل...</span>
                </div>
                <div class="details">
                    ${s.receiverPhone2 ? `<div class="info"><strong>هاتف آخر:</strong> ${s.receiverPhone2}</div>` : ''}
                    ${s.governorate ? `<div class="info"><strong>المحافظة:</strong> ${s.governorate}</div>` : ''}
                    ${s.city ? `<div class="info"><strong>المدينة:</strong> ${s.city}</div>` : ''}
                    <div class="info"><strong>العنوان:</strong> ${s.address || s.customerAddress || ''}</div>
                    ${s.weight ? `<div class="info"><strong>الوزن:</strong> ${s.weight} كجم</div>` : ''}
                    ${s.notes ? `<div class="info"><strong>ملاحظات:</strong> ${s.notes}</div>` : ''}
                    <div class="actions">${actions}</div>
                </div>
            </div>`;
        }

        function toggleDetails(el) { const d = el.querySelector('.details'); if (d) d.classList.toggle('open'); }

        function renderShipments(shipments) {
            const content = document.getElementById('content');
            if (!shipments || shipments.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>لا توجد شحنات</p></div>';
                return;
            }
            content.innerHTML = shipments.map(s => createShipmentCard(s)).join('');
            
            shipments.forEach(s => {
                if (s.trackingNumber && s.trackingNumber.length > 3) {
                    const cached = getCachedTrackingStatus(s.trackingNumber);
                    if (cached) updateShipmentStatusCard(s.id, cached);
                }
            });
            
            setTimeout(addUpdateButtons, 100);
        }

        // ============================================================
        // جلب الشحنات
        // ============================================================

        function cacheShipments(shipments, key) {
            try { localStorage.setItem(key, JSON.stringify({ data: shipments, timestamp: Date.now() })); } catch (e) {}
        }

        function getCachedShipments(key) {
            try {
                const c = localStorage.getItem(key);
                if (!c) return null;
                const d = JSON.parse(c);
                if (Date.now() - d.timestamp < 300000) return d.data;
                return null;
            } catch (e) { return null; }
        }

        async function loadMyShipments() {
            try {
                const res = await fetch(`${API_URL}?action=myShipments&phone=${currentUser.phone}&password=${currentUser.password}`);
                const data = await res.json();
                if (data.success) return data.shipments || [];
                return [];
            } catch (e) { return []; }
        }

        async function loadPublicShipments() {
            try {
                const res = await fetch(`${API_URL}?action=publicShipments`);
                const data = await res.json();
                if (data.success) return data.shipments || [];
                return getDemoShipments();
            } catch (e) { return getDemoShipments(); }
        }

        function getDemoShipments() {
            return [
                { id: 'DEMO-001', receiverName: 'أحمد محمد', receiverPhone: '01012345678', amount: '250', trackingNumber: 'JEG123456789', status: 'تم التسليم', lastUpdate: '2026-08-04 15:00' },
                { id: 'DEMO-002', receiverName: 'سارة علي', receiverPhone: '01198765432', amount: '150', trackingNumber: 'JEG987654321', status: 'قيد التوصيل', lastUpdate: '2026-08-04 14:30' },
                { id: 'DEMO-003', receiverName: 'محمد خالد', receiverPhone: '01234567890', amount: '320', trackingNumber: 'JEG456789123', status: 'تم الاستلام', lastUpdate: '2026-08-04 13:00' }
            ];
        }

        // ============================================================
        // التحميل عند فتح الصفحة (مرة واحدة فقط)
        // ============================================================

        function loadShipmentsOnce() {
            if (hasLoadedOnce) {
                console.log('⏭️ تم التحميل مسبقاً، تخطي');
                return;
            }
            hasLoadedOnce = true;
            
            const content = document.getElementById('content');
            const cacheKey = currentUser ? `eux_shipments_${currentUser.phone}` : 'eux_shipments_public';
            
            const cached = getCachedShipments(cacheKey);
            if (cached && cached.length > 0) {
                allShipmentsData = cached;
                document.getElementById('totalCountSmall').textContent = cached.length;
                renderShipments(cached);
                console.log('📦 عرض من الكاش:', cached.length, 'شحنة');
            } else {
                content.innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';
            }
            
            const loadFn = currentUser ? loadMyShipments : loadPublicShipments;
            loadFn().then(data => {
                if (data && data.length > 0) {
                    allShipmentsData = data;
                    cacheShipments(data, cacheKey);
                    document.getElementById('totalCountSmall').textContent = data.length;
                    renderShipments(data);
                    console.log('📡 تم جلب', data.length, 'شحنة من الخادم');
                }
            }).catch(err => {
                console.error('فشل جلب البيانات:', err);
                if (!cached || cached.length === 0) {
                    content.innerHTML = '<div style="text-align:center;padding:30px;color:#dc3545;">فشل تحميل البيانات</div>';
                }
            });
        }

        // ============================================================
        // دوال الحذف والتعديل
        // ============================================================

        async function deleteShipment(shipmentId) {
            if (!confirm('هل أنت متأكد من حذف هذه الشحنة؟')) return;
            const params = new URLSearchParams();
            params.append('action', 'deleteShipment');
            params.append('phone', currentUser.phone);
            params.append('password', currentUser.password);
            params.append('shipmentId', shipmentId);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: params });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ تم حذف الشحنة', 'success');
                    hasLoadedOnce = false;
                    loadShipmentsOnce();
                } else { showToast('❌ فشل الحذف', 'error'); }
            } catch (e) { showToast('❌ فشل الاتصال', 'error'); }
        }

        function showEditForm(shipmentId) {
            const card = document.getElementById(`card-${shipmentId}`);
            if (!card) return;
            const data = card.dataset.shipment;
            if (!data) return;
            try {
                const s = JSON.parse(data);
                document.getElementById('modal').classList.remove('hidden');
                document.getElementById('modalBody').innerHTML = `
                    <h3><i class="fas fa-edit"></i> تعديل الشحنة</h3>
                    <div class="form-group"><label>اسم المستلم</label><input id="edit_name" value="${s.receiverName || ''}"></div>
                    <div class="form-group"><label>هاتف المستلم</label><input id="edit_phone" value="${s.receiverPhone || ''}" dir="ltr"></div>
                    <div class="form-group"><label>العنوان</label><input id="edit_address" value="${s.address || ''}"></div>
                    <div class="form-group"><label>المبلغ</label><input id="edit_amount" type="number" value="${s.amount || ''}"></div>
                    <button class="btn-eux" onclick="updateShipment('${shipmentId}')" style="width:100%;">
                        <span class="inner">حفظ التعديلات</span><span class="fold"></span>
                    </button>
                    <p id="editError" style="color:red;margin-top:10px;"></p>
                `;
            } catch (e) { showToast('خطأ في قراءة البيانات', 'error'); }
        }

        async function updateShipment(shipmentId) {
            const name = document.getElementById('edit_name').value.trim();
            const phone = document.getElementById('edit_phone').value.trim();
            const address = document.getElementById('edit_address').value.trim();
            const amount = document.getElementById('edit_amount').value.trim();
            const errorDiv = document.getElementById('editError');
            if (!name || !phone || !address || !amount) { errorDiv.textContent = 'يرجى ملء جميع الحقول'; return; }

            const params = new URLSearchParams();
            params.append('action', 'deleteShipment');
            params.append('phone', currentUser.phone);
            params.append('password', currentUser.password);
            params.append('shipmentId', shipmentId);
            try {
                await fetch(API_URL, { method: 'POST', body: params });
                const addParams = new URLSearchParams();
                addParams.append('action', 'addShipment');
                addParams.append('phone', currentUser.phone);
                addParams.append('password', currentUser.password);
                addParams.append('receiverName', name);
                addParams.append('receiverPhone', phone);
                addParams.append('address', address);
                addParams.append('amount', amount);
                addParams.append('weight', '1');
                const res = await fetch(API_URL, { method: 'POST', body: addParams });
                const data = await res.json();
                if (data.success) {
                    closeModal();
                    showToast('✅ تم التعديل بنجاح', 'success');
                    hasLoadedOnce = false;
                    loadShipmentsOnce();
                } else { errorDiv.textContent = data.msg || 'فشل التعديل'; }
            } catch (e) { errorDiv.textContent = 'فشل الاتصال'; }
        }

        // ============================================================
        // تتبع الشحنة
        // ============================================================

        async function trackShipment(billCode) {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modalBody').innerHTML = '<div class="loading"><div class="spinner"></div>جاري التتبع...</div>';
            try {
                const res = await fetch(`${API_URL}?action=track&billCode=${billCode}`);
                const data = await res.json();
                if (data.code === "1" && data.data && data.data[0]) {
                    let html = `<h3><i class="fas fa-map-marked-alt"></i> مسار الشحنة</h3>`;
                    const details = data.data[0].details || [];
                    let status = data.data[0].status || '';
                    if (status.includes('تم التسليم')) status = '✅ تم التسليم';
                    html += `<div style="background:#e8f5e9;padding:10px 16px;border-radius:10px;margin-bottom:16px;border-right:4px solid #2e7d32;">
                        <strong>الحالة الحالية:</strong> <span style="font-weight:700;color:#2e7d32;">${status}</span>
                    </div>`;
                    if (details.length === 0) html += '<p style="text-align:center;color:#999;padding:20px;">لا توجد تفاصيل</p>';
                    else {
                        details.forEach(d => {
                            let desc = (d.desc || '').replace(/\([0-9]{10,11}\)/g, '').replace(/[0-9]{10,11}/g, '');
                            let location = d.scanNetworkName || '';
                            let city = d.scanNetworkCity || '';
                            let loc = city && !location.includes(city) ? city + ' - ' + location : location;
                            html += `<div class="timeline-item">
                                <div class="time">🕐 ${d.scanTime || ''}</div>
                                <div class="event">📌 ${desc}</div>
                                <div class="location">📍 ${loc}</div>
                            </div>`;
                        });
                    }
                    document.getElementById('modalBody').innerHTML = html;
                } else {
                    document.getElementById('modalBody').innerHTML = `<h3>❌ فشل التتبع</h3><p>${data.msg || 'خطأ'}</p>`;
                }
            } catch (e) {
                document.getElementById('modalBody').innerHTML = `<h3>❌ فشل الاتصال</h3><p>تأكد من اتصالك بالإنترنت</p>`;
            }
        }

        // ============================================================
        // دوال عامة
        // ============================================================

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function showToast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast' + (type ? ' ' + type : '');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function doLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');
            if (!phone || !password) { errorDiv.textContent = 'يرجى إدخال رقم الهاتف وكلمة المرور';
                errorDiv.style.display = 'block'; return; }
            if (phone.length !== 11) { errorDiv.textContent = 'رقم الهاتف يجب أن يكون 11 رقم';
                errorDiv.style.display = 'block'; return; }
            try {
                const res = await fetch(`${API_URL}?action=login&phone=${phone}&password=${password}`);
                const data = await res.json();
                if (data.success) {
                    currentUser = { phone, password, name: data.name, role: data.role };
                    sessionStorage.setItem('eux_user', JSON.stringify(currentUser));
                    errorDiv.style.display = 'none';
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    hasLoadedOnce = false;
                    loadShipmentsOnce();
                } else {
                    errorDiv.textContent = data.msg || 'فشل تسجيل الدخول';
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = 'فشل الاتصال بالخادم';
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            currentUser = null;
            hasLoadedOnce = false;
            sessionStorage.removeItem('eux_user');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('phoneInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').style.display = 'none';
            showToast('تم تسجيل الخروج', '');
        }

        // ============================================================
        // تحميل الصفحة
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            const saved = sessionStorage.getItem('eux_user');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadShipmentsOnce();
                } catch (e) {}
            } else {
                document.getElementById('loginPage').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
                setTimeout(() => {
                    loadPublicShipments().then(data => {
                        if (data && data.length > 0) {
                            allShipmentsData = data;
                            document.getElementById('loginPage').classList.add('hidden');
                            document.getElementById('dashboard').classList.remove('hidden');
                            cacheShipments(data, 'eux_shipments_public');
                            document.getElementById('totalCountSmall').textContent = data.length;
                            renderShipments(data);
                            showToast('📦 تم تحميل الشحنات العامة', '');
                        }
                    });
                }, 500);
            }
        });

        // ============================================================
        // ❌ لا يوجد setInterval للتحديث التلقائي
        // ✅ زر "تحديث الكل" يضغط على جميع أزرار "تحديث الآن"
        // ✅ تحديث تلقائي عند Refresh الصفحة فقط
        // ============================================================

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('phoneInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('passwordInput').focus();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'a')) e.preventDefault();
        });
    </script>
</body>
</html>
