<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Scroll Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية بيضاء بالكامل */
            background-color: #ffffff;
            height: 500vh;
            overflow-x: hidden;
        }

        /* تثبيت الساعة وتكبير حجمها */
        .clock-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; /* تكبير الحجم إلى 500px */
            height: 500px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* إغلاق قص الحدود للتوهج الهالي */
        svg {
            width: 100%;
            height: 100%;
            overflow: visible !important;
        }

        /* توهج النيون الأزرق للعقارب والخطوط */
        .neon-glow {
            filter: drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 15px #00d2ff);
        }

        /* الهالة الزرقاء الخارجية المضيئة */
        .outer-aura {
            filter: drop-shadow(0 0 12px #00d2ff) drop-shadow(0 0 25px #00d2ff) drop-shadow(0 0 45px rgba(0, 210, 255, 0.7));
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- توسيع viewBox بشكل واسع جداً (-70 -70 440 440) لعدم قص الهالة من الأطراف -->
        <svg viewBox="-70 -70 440 440">
            <!-- الإطار الخارجي المضيء بالهالة الزرقاء بدون خلفية سوداء -->
            <circle cx="150" cy="150" r="135" fill="none" stroke="#00d2ff" stroke-width="3.5" class="outer-aura" />

            <!-- علامات الدقائق والساعات -->
            <g id="ticks" stroke="#00d2ff" stroke-linecap="round" class="neon-glow"></g>

            <!-- عقرب الساعات (أزرق نيون مضيء) -->
            <g id="hour-hand" transform="rotate(295 150 150)">
                <polygon points="146,150 154,150 151,85 149,85" fill="#00d2ff" stroke="#00d2ff" stroke-width="1" class="neon-glow" />
            </g>

            <!-- عقرب الدقائق (أزرق نيون مضيء) -->
            <g id="minute-hand" transform="rotate(355 150 150)">
                <line x1="150" y1="185" x2="150" y2="40" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" class="neon-glow" />
            </g>

            <!-- المركز المضيء باللون الأزرق النيون -->
            <circle cx="150" cy="150" r="8" fill="#00d2ff" stroke="#00d2ff" stroke-width="2" class="neon-glow" />
        </svg>
    </div>

    <script>
        // رسم علامات الساعة (60 شرطة)
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const length = isMajor ? 12 : 6;
            const strokeWidth = isMajor ? 3 : 1.5;
            const opacity = isMajor ? 1 : 0.75;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", 20 + length);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("opacity", opacity);
            line.setAttribute("transform", `rotate(${angle} 150 150)`);

            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        let targetFraction = 0;
        let currentFraction = 0;

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            targetFraction = scrollTop / maxScroll;
        });

        // تنعيم حركة العقارب عند التمرير
        function animate() {
            currentFraction += (targetFraction - currentFraction) * 0.1;

            const minuteAngle = 355 + (currentFraction * 360 * 12);
            const hourAngle = 295 + (currentFraction * 360);

            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
