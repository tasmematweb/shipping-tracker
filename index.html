    async function submitPublicOrder() {
        const receiverName = document.getElementById('pf_receiverName').value.trim();
        const receiverPhone = document.getElementById('pf_receiverPhone').value.trim();
        const receiverPhone2 = document.getElementById('pf_receiverPhone2').value.trim();
        const governorate = document.getElementById('pf_governorate').value;
        const city = document.getElementById('pf_city').value;
        const address = document.getElementById('pf_address').value.trim();
        const amount = document.getElementById('pf_amount').value.trim();
        const weight = document.getElementById('pf_weight').value.trim() || '1';
        const notes = document.getElementById('pf_notes').value.trim();
        const errorDiv = document.getElementById('publicError');

        if (!receiverName || !receiverPhone || !governorate || !city || !address || !amount) {
            errorDiv.textContent = "يرجى ملء جميع الحقول المطلوبة (*)";
            return;
        }
        if (receiverPhone.length !== 11) {
            errorDiv.textContent = "⚠️ رقم هاتف المستلم يجب أن يكون 11 رقم";
            return;
        }
        if (receiverPhone2 && receiverPhone2.length !== 11) {
            errorDiv.textContent = "⚠️ رقم هاتف آخر يجب أن يكون 11 رقم";
            return;
        }

        const params = new URLSearchParams();
        params.append('action', 'addShipment');
        params.append('phone', publicClientPhone);
        params.append('password', 'public');
        params.append('receiverName', receiverName);
        params.append('receiverPhone', receiverPhone);
        params.append('receiverPhone2', receiverPhone2);
        params.append('governorate', governorate);
        params.append('city', city);
        params.append('address', address);
        params.append('amount', amount);
        params.append('weight', weight);
        params.append('notes', notes);

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            const data = await res.json();
            if (data.success) { 
                showToast('✅ تم تسجيل الشحنة بنجاح!', 'success');
                document.getElementById('pf_receiverName').value = '';
                document.getElementById('pf_receiverPhone').value = '';

                document.getElementById('pf_address').value = '';
                document.getElementById('pf_amount').value = '';
                document.getElementById('pf_weight').value = '1';
                document.getElementById('pf_notes').value = '';
                errorDiv.textContent = '';
            } else { 
                errorDiv.textContent = data.msg || "فشل التسجيل"; 
            }
        } catch (e) { 
            errorDiv.textContent = 'فشل الاتصال'; 
        }
    }

    // ============================================================
    function copyShareLink() {
        const shareUrl = `${BASE_URL}/?ref=${currentUser.phone}`;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('✅ تم نسخ رابط التسجيل!', 'success');
            }).catch(() => {
                fallbackCopy(shareUrl);
            });
        } else {
            fallbackCopy(shareUrl);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.top = '0';
        textarea.style.left = '0';
        textarea.style.width = '2em';
        textarea.style.height = '2em';
        textarea.style.padding = '0';
        textarea.style.border = 'none';
        textarea.style.outline = 'none';
        textarea.style.boxShadow = 'none';
        textarea.style.background = 'transparent';
        textarea.style.opacity = '0';
        textarea.style.zIndex = '9999';
        textarea.setAttribute('readonly', '');
        document.body.appendChild(textarea);
        
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, 999999);
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showToast('✅ تم نسخ رابط التسجيل!', 'success');
            } else {
                showModalWithLink(text);
            }
        } catch (e) {
            showModalWithLink(text);
        }
        
        document.body.removeChild(textarea);
    }

    // ============================================================
    //  دالة جلب الحالة الفعلية من API التتبع
    // ============================================================
    async function fetchTrackingStatus(trackingNumber) {
        if (!trackingNumber || trackingNumber.length < 3) return null;
        if (trackingCache[trackingNumber]) return trackingCache[trackingNumber];
        
        try {
            const res = await fetch(`${API_URL}?action=track&billCode=${trackingNumber}`);
            const data = await res.json();
            if (data.code === "1" && data.data && data.data[0]) {
                let finalStatus = data.data[0].status || null;
                const details = data.data[0].details || [];
                
                for (const d of details) {
                    const desc = d.desc || '';
                    if (desc.includes('تم التسليم')) {
                        finalStatus = '✅ تم التسليم';
                        break;
                    }
                }
                
                if (!finalStatus || !finalStatus.includes('تم التسليم')) {
                    if (finalStatus && finalStatus.includes('تم التسليم')) {
                        finalStatus = '✅ تم التسليم';
                    }
                }
                
                trackingCache[trackingNumber] = finalStatus;
                return finalStatus;
            }
            trackingCache[trackingNumber] = null;
            return null;
        } catch (e) {
            console.error('فشل تتبع:', trackingNumber, e);
            return null;
        }
    }

    // ============================================================
    //  تحديث حالة واحدة في البطاقة
    // ============================================================
    function updateShipmentStatusCard(shipmentId, status) {
        const card = document.getElementById(`card-${shipmentId}`);
        if (!card) return;
        const statusRow = card.querySelector('.status-row');
        if (!statusRow) return;
        
        statusRow.classList.remove('loading-status', 'error-status', 'info-status');
        const statusValue = statusRow.querySelector('.status-value');
        const statusLabel = statusRow.querySelector('.status-label');
        
        if (status) {
            statusLabel.textContent = '📍 الحالة الحالية:';
            
            let displayStatus = status;
            let isError = false;
            let isSuccess = false;
            let isInfo = false;
            
            if (status.includes('خطأ') || status.includes('Error') || status.includes('❌')) {
                isError = true;
                displayStatus = '❌ ' + status.replace(/❌️?/g, '').replace(/خطأ/g, '').trim();
                if (!displayStatus || displayStatus === '❌') displayStatus = '❌ خطأ في التوصيل';
            } else if (status.includes('تم التسليم') || status.includes('✅ تم التسليم')) {
                isSuccess = true;
                displayStatus = '✅ تم التسليم';
            } else if (status.includes('تم الاستلام')) {
                isInfo = true;
                displayStatus = '📦 تم استلام الشحنة';
            } else if (status.includes('Delivered') || status.includes('✅')) {
                isSuccess = true;
                displayStatus = '✅ تم التسليم';
            }
            
            statusValue.textContent = displayStatus;
            
            if (isSuccess) {
                statusRow.style.background = '#e8f5e9';
                statusRow.style.borderRightColor = '#2e7d32';
                statusValue.style.color = '#2e7d32';
            } else if (isError) {
                statusRow.style.background = '#ffeaea';
                statusRow.style.borderRightColor = '#dc3545';
                statusValue.style.color = '#dc3545';
            } else if (isInfo) {
                statusRow.style.background = '#e3f2fd';
                statusRow.style.borderRightColor = '#0d47a1';
                statusValue.style.color = '#0d47a1';
            } else {
                statusRow.style.background = '#e3f2fd';
                statusRow.style.borderRightColor = '#0d47a1';
                statusValue.style.color = '#0d47a1';
            }
        } else {
            statusLabel.textContent = '📍 الحالة:';
            statusRow.style.background = '#f5f5f5';
            statusRow.style.borderRightColor = '#999';
            statusValue.style.color = '#999';
            statusValue.textContent = 'لم يتم التحديد بعد';
        }
    }

    // ============================================================
    //  تحديث جميع الحالات واحدة تلو الأخرى
    // ============================================================
    async function updateAllTrackingStatuses(shipments) {
        const shipmentsWithTracking = shipments.filter(s => s.trackingNumber && s.trackingNumber.length > 3);
        
        for (const s of shipmentsWithTracking) {
            const status = await fetchTrackingStatus(s.trackingNumber);
            updateShipmentStatusCard(s.id, status);
            await new Promise(resolve => setTimeout(resolve, 500));
        }
    }

    //  🎨 عرض بطاقة الشحنة
    // ============================================================
    function createShipmentCard(s, isAdmin = false) {
        let statusClass = 'status-waiting';
        let statusText = s.status || '';
        
        if (statusText.includes('انتظار التتبع') || statusText.includes('في انتظار')) {
            statusText = '';
        }
        
        if (statusText.includes('تتبع')) statusClass = 'status-tracking';
        else if (statusText.includes('تم')) statusClass = 'status-done';
        else if (!statusText) statusClass = 'status-waiting';

        let lastUpdate = s.lastUpdate || s.date || '';
        let updateText = lastUpdate ? 'آخر تحديث: ' + lastUpdate : '';

        let actions = '';
        const trackingNum = s.trackingNumber || '';
        if (trackingNum && trackingNum.length > 3) {
            actions += `<button class="btn-track" onclick="event.stopPropagation(); trackShipment('${trackingNum}')">📍 تتبع</button>`;
        }
        if (isAdmin) {
            if (!trackingNum || trackingNum.length < 3) {
                actions += `<button class="btn-add-tracking" onclick="event.stopPropagation(); showAddTracking('${s.id}')">🔢 إضافة تتبع</button>`;
            }
            actions += `<button class="btn-delete" onclick="event.stopPropagation(); deleteShipment('${s.id}')">🗑️ حذف</button>`;
            var adminDetails = `
                <div class="info"><strong>🔢 رقم الشحنة:</strong> ${s.id}</div>
                ${trackingNum ? `<div class="info"><strong>🚚 رقم التتبع:</strong> ${trackingNum}</div>` : ''}
            `;
        } else {
            var adminDetails = '';
        }

        const displayName = s.receiverName || s.customerName || 'غير معروف';
        const displayPhone = s.receiverPhone || s.customerPhone || '';
        const displayAmount = s.amount || '0';
        const hasTracking = trackingNum && trackingNum.length > 3;

        const badgeHTML = statusText ? `<span class="status-badge ${statusClass}">${statusText}</span>` : '';

        return `<div class="shipment-card" onclick="toggleDetails(this)" id="card-${s.id}">
            ${badgeHTML}
            <div class="summary-row">
                <div class="main-info">
                    <span class="name">👤 ${displayName}</span>
                    <span class="phone">📱 ${displayPhone}</span>
                    <span class="amount">💰 ${displayAmount} ج.م</span>
                </div>
                <div class="last-update">${updateText}</div>
            </div>
            <div class="status-row${hasTracking ? ' loading-status' : ''}">
                <span class="status-label">📍 الحالة:</span>
                <span class="status-value">${hasTracking ? '⏳ جاري التحميل...' : (trackingNum ? '⏳ انتظار...' : 'لم يتم التحديد بعد')}</span>
            </div>
            <div class="details">
                ${isAdmin ? `<div class="info"><strong>📱 رقم العميل:</strong> ${s.clientPhone || 'غير معروف'}</div>` : ''}
                ${adminDetails}
                ${s.receiverPhone2 ? `<div class="info"><strong>📱 هاتف آخر:</strong> ${s.receiverPhone2}</div>` : ''}
                ${s.governorate ? `<div class="info"><strong>📍 المحافظة:</strong> ${s.governorate}</div>` : ''}
                ${s.city ? `<div class="info"><strong>🏙️ المدينة:</strong> ${s.city}</div>` : ''}
                <div class="info"><strong>📍 العنوان:</strong> ${s.address || s.customerAddress || ''}</div>
                ${s.weight ? `<div class="info"><strong>⚖️ الوزن:</strong> ${s.weight} كجم</div>` : ''}
                ${s.notes ? `<div class="info"><strong>📝 ملاحظات:</strong> ${s.notes}</div>` : ''}
                ${actions ? `<div class="actions">${actions}</div>` : ''}
            </div>
        </div>`;
    }

        const details = element.querySelector('.details');
        if (details) {
            details.classList.toggle('open');
        }
    }

    // ============================================================
    //  🚚 تتبع الشحنة
    // ============================================================
    async function trackShipment(billCode) {
        const isAdmin = currentUser && currentUser.role === 'admin';
        
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modalBody').innerHTML = '<div class="loading"><div class="spinner"></div>جاري تتبع الشحنة...</div>';
        
        try {
            const res = await fetch(`${API_URL}?action=track&billCode=${billCode}`);
            const data = await res.json();

            if (data.code === "1" && data.data && data.data[0]) {
                let html = `<h3><i class="fas fa-map-marked-alt"></i> مسار الشحنة</h3>`;
                
                if (isAdmin) {
                    html += `<p style="margin-bottom:16px;color:#666;font-size:14px;direction:ltr;text-align:left;"><strong>رقم التتبع:</strong> ${billCode}</p>`;
                }
                
                const currentStatus = data.data[0].status || '';
                const details = data.data[0].details || [];
                
                let foundDelivered = false;
                for (const d of details) {
                    const desc = d.desc || '';
                    if (desc.includes('تم التسليم')) {
                        foundDelivered = true;
                        break;
                    }
                }
                
                let displayStatus = currentStatus;
                let statusBgColor = '#e8f5e9';
                let statusBorderColor = '#2e7d32';
                let statusTextColor = '#2e7d32';
                
                if (foundDelivered || currentStatus.includes('تم التسليم')) {
                    displayStatus = '✅ تم التسليم';
                } else if (currentStatus.includes('خطأ') || currentStatus.includes('Error') || currentStatus.includes('❌')) {
                    displayStatus = '❌ ' + currentStatus.replace(/❌️?/g, '').replace(/خطأ/g, '').trim();
                    if (!displayStatus || displayStatus === '❌') displayStatus = '❌ خطأ في التوصيل';
                    statusBgColor = '#ffeaea';
                    statusBorderColor = '#dc3545';
                    statusTextColor = '#dc3545';
                } else if (currentStatus.includes('تم الاستلام')) {
                    displayStatus = '📦 تم استلام الشحنة';
                    statusBgColor = '#e3f2fd';
                    statusBorderColor = '#0d47a1';
                    statusTextColor = '#0d47a1';
                } else if (currentStatus.includes('Delivered') || currentStatus.includes('✅')) {
                    displayStatus = '✅ تم التسليم';
                } else if (!currentStatus) {
                    displayStatus = 'قيد المعالجة';
                    statusBgColor = '#e3f2fd';
                    statusBorderColor = '#0d47a1';
                    statusTextColor = '#0d47a1';
                }
                
                html += `<div style="background:${statusBgColor};padding:10px 16px;border-radius:10px;margin-bottom:16px;border-right:4px solid ${statusBorderColor};">
                    <strong style="color:${statusTextColor};font-size:15px;">📍 الحالة الحالية:</strong>
                    <span style="color:${statusTextColor};font-weight:700;font-size:16px;margin-right:8px;">${displayStatus}</span>
                </div>`;
                
                if (details.length === 0) {
                    html += `<p style="text-align:center;color:#999;padding:20px;">لا توجد تفاصيل تتبع متاحة</p>`;
                } else {
                    details.forEach(d => {
                        let desc = d.desc || '';
                        desc = desc.replace(/\([0-9]{10,11}\)/g, '');
                        desc = desc.replace(/[0-9]{10,11}/g, '');
                        desc = desc.replace(/J&T/gi, '');
                        desc = desc.replace(/courier/gi, '');
                        desc = desc.replace(/Express/gi, '');
                        
                        let location = d.scanNetworkName || '';
                        let city = d.scanNetworkCity || '';
                        let locationText = location;
                        if (city && !location.includes(city)) {
                            locationText = city + (location ? ' - ' + location : '');
                        }
                        locationText = locationText.replace(/[0-9]/g, '').trim();
                        
                        html += `<div class="timeline-item">
                            <div class="time">🕐 ${d.scanTime || ''}</div>
                            <div class="event">📌 ${desc}</div>
                            <div class="location">📍 ${locationText}</div>
                            ${d.probleDescription ? `<div class="problem">⚠️ ${d.probleDescription}</div>` : ''}
                        </div>`;
                    });
                }
                document.getElementById('modalBody').innerHTML = html;
            } else {
                let errorMsg = data.msg || data.error || 'فشل تتبع الشحنة';
                document.getElementById('modalBody').innerHTML = `
                    <h3><i class="fas fa-map-marked-alt"></i> تتبع الشحنة</h3>
                    <div style="text-align:center;padding:20px;color:#dc3545;">
                        <div style="font-size:48px;margin-bottom:12px;">❌</div>
                        <p>${errorMsg}</p>
                    </div>
                `;
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = `
                <h3><i class="fas fa-map-marked-alt"></i> تتبع الشحنة</h3>
                <div style="text-align:center;padding:20px;color:#dc3545;">
                    <div style="font-size:48px;margin-bottom:12px;">📡</div>
                    <p>فشل الاتصال بخدمة التتبع</p>
                </div>
            `;
        }
    }

    // ============================================================
    //  👥 إدارة العملاء (للأدمن)
    // ============================================================
    async function showClients() {
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modalBody').innerHTML = '<div class="loading"><div class="spinner"></div>جاري التحميل...</div>';
        
        try {
            const params = new URLSearchParams();
            params.append('action', 'allClients');
            params.append('adminPhone', currentUser.phone);
            params.append('adminPassword', currentUser.password);

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            const data = await res.json();
            
            if (data.success) {
                let html = `<h3><i class="fas fa-users"></i> إدارة العملاء</h3>
                    <button class="submit-btn green" onclick="showAddClientForm()" style="margin-bottom:14px;">➕ إنشاء حساب عميل جديد</button>
                    <div id="clientList"></div>`;
                document.getElementById('modalBody').innerHTML = html;
                
                const listDiv = document.getElementById('clientList');
                if (data.clients.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">لا يوجد عملاء حتى الآن</p>';
                } else {
                    data.clients.forEach(c => {
                        listDiv.innerHTML += `<div class="client-card">
                            <div class="client-info"><strong>${c.name}</strong><br><span class="phone">📱 ${c.phone}</span><br><span class="created">📅 ${c.created}</span></div>
                            <div class="client-actions"><button onclick="deleteClient('${c.phone}')">🗑️ حذف</button></div>
                        </div>`;
                    });
                }
            } else {
                document.getElementById('modalBody').innerHTML = `<p style="color:red;">${data.msg || 'فشل التحميل'}</p>`;
            }
        } catch (e) {
            document.getElementById('modalBody').innerHTML = `<p style="color:red;">فشل الاتصال</p>`;
        }
    }

    function showAddClientForm() {
        document.getElementById('modalBody').innerHTML = `
            <h3><i class="fas fa-user-plus"></i> إنشاء حساب عميل جديد</h3>
            <div class="form-group"><label>👤 اسم العميل *</label><input id="newClientName" placeholder="الاسم الكامل"></div>
            <div class="form-group"><label>📱 رقم الهاتف *</label><input id="newClientPhone" dir="ltr" placeholder="مثال: 011xxxxxxxx" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
            <div class="form-group"><label>🔒 كلمة المرور *</label><input id="newClientPassword" type="password" dir="ltr" placeholder="كلمة المرور للدخول"></div>
            <button class="submit-btn green" onclick="createClient()">✅ إنشاء الحساب</button>
            <button class="submit-btn gray" onclick="showClients()" style="margin-top:8px;">↩️ رجوع</button>
            <p id="clientError" style="color:red;margin-top:10px;text-align:center;"></p>
        `;
    }

    async function createClient() {
        const name = document.getElementById('newClientName').value.trim();
        const phone = document.getElementById('newClientPhone').value.trim();
        const password = document.getElementById('newClientPassword').value.trim();
        const errorDiv = document.getElementById('clientError');
        if (!name || !phone || !password) { errorDiv.textContent = "يرجى ملء جميع الحقول"; return; }
        if (phone.length !== 11) { errorDiv.textContent = "⚠️ رقم الهاتف يجب أن يكون 11 رقم"; return; }
        
        const params = new URLSearchParams();
        params.append('action', 'createClient');
        params.append('adminPhone', currentUser.phone);
        params.append('adminPassword', currentUser.password);
        params.append('clientName', name);
        params.append('clientPhone', phone);
        params.append('clientPassword', password);

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            const data = await res.json();
            if (data.success) { showClients(); showToast('✅ تم إنشاء الحساب!', 'success'); }
            else { errorDiv.textContent = data.msg; }
        } catch (e) { errorDiv.textContent = 'فشل الاتصال'; }
    }

    async function deleteClient(phone) {
        if (!confirm('هل أنت متأكد من حذف هذا العميل؟')) return;
        try {
            const params = new URLSearchParams();
            params.append('action', 'deleteClient');
            params.append('phone', phone);
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            showClients();
            showToast('✅ تم حذف العميل', 'success');
        } catch (e) { 
            showToast('⚠️ فشل الحذف', 'error');
        }
    }

    // ============================================================
    //  🖥️ دوال مساعدة
    // ============================================================
    function closeModal() { 
        document.getElementById('modal').classList.add('hidden'); 
    }

    function showToast(message, type) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' ' + type : '');
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    document.getElementById('passwordInput').addEventListener('keypress', function(e) { 
        if (e.key === 'Enter') doLogin(); 
    });
    document.getElementById('phoneInput').addEventListener('keypress', function(e) { 
        if (e.key === 'Enter') document.getElementById('passwordInput').focus(); 
    });

    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'a')) {
            e.preventDefault();
        }
        if (e.key === 'Escape') closeModal();
    });

    document.addEventListener('DOMContentLoaded', function() {
        checkSession();
    });
</script>

</body>
</html>
