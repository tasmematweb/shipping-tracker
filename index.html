        /* رأس الصندوق */

        }

        .tracking-subscribe .header h2 {
            font-size: 22px;

        }

        .tracking-subscribe .header h2 i {
            color: #0076ff;

        .total-badge {
            background: #eef3f8;

            border-radius: 30px;

        .total-badge span {

        /* حقل البحث */
        .search-box {

            margin-bottom: 25px;

        .search-box input {

        .search-box input:focus {

        .search-box .search-btn {

        .search-box .search-btn:hover {

        /* حاوية الطلبات - قابلة للتمرير */
        .orders-container {

        /* بطاقة الطلب - نفس تنسيق الـ subscribe الداخلي */

        .order-card .track-btn {

        @media (max-width: 700px) {

        /* حالة عدم وجود طلبات */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        /* المودال الخاص بالتتبع */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: fadeIn 0.25s ease;
        }

        .modal-overlay .modal-box {
            background: white;
            border-radius: 20px;
            padding: 30px 25px 25px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .modal-overlay .modal-box .close-modal {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
            transition: 0.2s;
            background: none;
            border: none;
        }

        .modal-overlay .modal-box .close-modal:hover {
            color: #333;
            transform: rotate(90deg);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* تنسيق التتبع داخل المودال */
        .timeline-item {
            border-right: 3px solid #0076ff;
            padding: 12px 16px 12px 0;
            margin-right: 10px;
            margin-bottom: 14px;
            background: #f8fafc;
            border-radius: 0 10px 10px 0;
            transition: 0.2s;
        }
        .timeline-item:hover {
            background: #f0f6fe;
        }
        .timeline-item .time {
            color: #999;
            font-size: 13px;
        }
        .timeline-item .event {
            font-weight: 700;
            color: #0d2137;
            margin: 5px 0;
        }
        .timeline-item .location {
            color: #666;
            font-size: 14px;
        }
        .timeline-item .problem {
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }

        .loading-spinner {
            text-align: center;
            padding: 30px 0;
        }
        .loading-spinner .spinner {
            border: 4px solid #e8ecf0;
            border-top: 4px solid #0076ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0d2137;
            color: white;
            padding: 12px 30px;
            border-radius: 14px;
            font-size: 15px;
            z-index: 99999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: toastAnim 0.3s ease;
            font-family: 'Cairo', sans-serif;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #28a745;
        }
        .toast.error {
            background: #dc3545;
        }
        @keyframes toastAnim {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* إخفاء العناصر */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="tracking-subscribe" id="trackingContainer">
        <!-- رأس الصندوق -->
        <div class="header">
            <h2><i class="fas fa-boxes"></i> شحناتي</h2>
            <div class="total-badge">📦 إجمالي: <span id="totalCount">0</span></div>
        </div>

        <!-- حقل البحث -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ابحث باسم العميل أو رقم الهاتف..." oninput="performSearch()">
            <button class="search-btn" onclick="performSearch()"><i class="fas fa-search"></i> بحث</button>
        </div>

        <!-- حاوية الطلبات -->
        <div class="orders-container" id="ordersContainer">
            <!-- سيتم ملؤها بواسطة JavaScript -->
            <div class="empty-state">
                <div class="icon">📭</div>
                <p>لا توجد طلبات لعرضها</p>
            </div>
        </div>
    </div>

    <!-- مودال التتبع -->
    <div id="trackingModal" class="modal-overlay hidden">
        <div class="modal-box">
            <button class="close-modal" onclick="closeTrackingModal()">✕</button>
            <div id="trackingContent">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>جاري تحميل مسار الشحنة...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  البيانات الوهمية للطلبات - تحاكي البيانات الحقيقية
        // ============================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbyZYhdpkYQH-ZxM8te39VoEnoKJjx2vY5VzvgHg18y6FadPRMdpbZyTW2YuHByyI-ha/exec";

        let allOrders = []; // سيتم تخزين كل الطلبات
        let filteredOrders = [];

        // ============================================================
        //  جلب الطلبات من الـ API (محاكاة أو حقيقية)
        // ============================================================
        async function fetchOrders() {
            try {
                // نستخدم نفس الـ endpoint الخاص بجلب الطلبات
                // لكننا سنمرر بيانات عميل وهمية أو نستخدم طلب عام
                // هنا نستخدم طلب myShipments مع رقم هاتف افتراضي لتجربة العرض
                // يمكنك تعديل الرقم حسب رغبتك
                const testPhone = "01012345678"; // رقم تجريبي
                const testPassword = "123456";

                const res = await fetch(`${API_URL}?action=myShipments&phone=${testPhone}&password=${testPassword}`);
                const data = await res.json();

                if (data.success && data.shipments && data.shipments.length > 0) {
                    allOrders = data.shipments;
                } else {
                    // إذا لم توجد بيانات حقيقية، نستخدم بيانات وهمية للعرض
                    allOrders = getMockOrders();
                }
            } catch (e) {
                console.warn("فشل جلب البيانات، استخدام بيانات وهمية", e);
                allOrders = getMockOrders();
            }

            // نعرض الطلبات
            filteredOrders = [...allOrders];
            renderOrders(filteredOrders);
            document.getElementById('totalCount').textContent = allOrders.length;
        }

        // ============================================================
        //  بيانات وهمية للعرض في حالة عدم وجود اتصال
        // ============================================================
        function getMockOrders() {
            return [{

                trackingNumber: "JEG123456789",

                lastUpdate: "2026-07-27 14:30"
            }, {

                receiverPhone2: "01234567890",
                governorate: "الجيزة",

                notes: "يوجد جراج بجوار البناية",

                status: "تم التسليم",
                lastUpdate: "2026-07-26 18:15"
            }, {
                id: "SH-1003",
                receiverName: "محمد إبراهيم",

                amount: "780",
                weight: "3.2",
                notes: "برجاء التواصل قبل التوصيل",
                trackingNumber: "JEG555555555",
                status: "جاري التجهيز",
                lastUpdate: "2026-07-27 09:00"
            }, {
                id: "SH-1004",
                receiverName: "نورا حسن",
                receiverPhone: "01234567890",
                receiverPhone2: "01111111111",
                governorate: "الشرقية",
                city: "العبور",
                address: "مدينة العبور، الحي الثاني، بجوار كشري الوالي",
                amount: "320",
                weight: "1.0",
                notes: "شحنة عاجلة",
                trackingNumber: "",
                status: "في انتظار التتبع",
                lastUpdate: "2026-07-26 22:00"
            }, {
                id: "SH-1005",
                receiverName: "خالد يوسف",
                receiverPhone: "01099887766",
                receiverPhone2: "",
                governorate: "المنوفية",
                city: "شبين الكوم",
                address: "شارع الجمهورية، بجوار البنك الأهلي",
                amount: "650",
                weight: "4.5",
                notes: "التسليم قبل الساعة 2 ظهراً",
                trackingNumber: "JEG99887766",
                status: "تعذر التوصيل",
                lastUpdate: "2026-07-27 11:45"
            }, {
                id: "SH-1006",
                receiverName: "فاطمة الزهراء",
                receiverPhone: "01122334455",
                receiverPhone2: "01066778899",
                governorate: "القليوبية",
                city: "بنها",
                address: "شارع الجامعة، عمارة 8، الدور الثالث",
                amount: "210",
                weight: "0.8",
                notes: "يوجد كود للدخول: 1234",
                trackingNumber: "JEG22334455",
                status: "تم الاستلام",
                lastUpdate: "2026-07-25 16:20"
            }];
        }

        // ============================================================
        //  عرض الطلبات
        // ============================================================
        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>لا توجد طلبات تطابق بحثك</p>
                    </div>
                `;
                return;
            }

            let html = '';
            orders.forEach(order => {
                // تحديد حالة التتبع
                let statusClass = 'info';
                let statusText = order.status || 'في انتظار التحديث';

                if (statusText.includes('تم التسليم') || statusText.includes('Delivered')) {
                    statusClass = '';
                    statusText = '✅ تم التسليم';
                } else if (statusText.includes('تعذر') || statusText.includes('خطأ') || statusText.includes('رفض')) {
                    statusClass = 'error';
                    statusText = '❌ ' + statusText;
                } else if (statusText.includes('الطريق') || statusText.includes('تتبع')) {
                    statusClass = 'loading';
                    statusText = '🚚 ' + statusText;
                } else if (statusText.includes('استلام') || statusText.includes('جاري التجهيز')) {
                    statusClass = 'info';
                    statusText = '📦 ' + statusText;
                } else {
                    statusClass = 'loading';
                }

                // التحقق من وجود رقم تتبع
                const hasTracking = order.trackingNumber && order.trackingNumber.length > 3;

                html += `
                    <div class="order-card" id="card-${order.id}">
                        <div class="card-header">
                            <span class="name">👤 ${order.receiverName || 'غير معروف'}</span>
                            <span class="phone">📱 ${order.receiverPhone || ''}</span>
                            <span class="amount">💰 ${order.amount || '0'} ج.م</span>
                        </div>
                        <div class="order-details">
                            <span class="detail-item"><i class="fas fa-map-marker-alt"></i> ${order.governorate || ''} - ${order.city || ''}</span>
                            <span class="detail-item"><i class="fas fa-home"></i> ${order.address || ''}</span>
                            ${order.weight ? `<span class="detail-item"><i class="fas fa-weight-hanging"></i> ${order.weight} كجم</span>` : ''}
                            ${order.notes ? `<span class="detail-item"><i class="fas fa-pencil-alt"></i> ${order.notes}</span>` : ''}
                            <span class="detail-item"><i class="fas fa-hashtag"></i> رقم الشحنة: ${order.id}</span>
                        </div>
                        <div class="status-row ${statusClass}">
                            <span class="status-label">📍 الحالة:</span>
                            <span class="status-value">${statusText}</span>
                        </div>
                        ${hasTracking ? `<button class="track-btn" onclick="trackShipment('${order.trackingNumber}')"><i class="fas fa-map-pin"></i> تتبع</button>` : 
                        `<button class="track-btn" style="background:#888;cursor:not-allowed;box-shadow:none;" disabled><i class="fas fa-ban"></i> لا يوجد تتبع</button>`}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        //  وظيفة البحث
        // ============================================================
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!query) {
                filteredOrders = [...allOrders];
                renderOrders(filteredOrders);
                return;
            }

            filteredOrders = allOrders.filter(order => {
                const nameMatch = (order.receiverName || '').toLowerCase().includes(query);
                const phoneMatch = (order.receiverPhone || '').includes(query);
                const phone2Match = (order.receiverPhone2 || '').includes(query);
                const idMatch = (order.id || '').toLowerCase().includes(query);
                const cityMatch = (order.city || '').toLowerCase().includes(query);
                const govMatch = (order.governorate || '').toLowerCase().includes(query);
                return nameMatch || phoneMatch || phone2Match || idMatch || cityMatch || govMatch;
            });

            renderOrders(filteredOrders);
        }

        // ============================================================
        //  دالة التتبع - تعرض المودال وتجلب التفاصيل
        // ============================================================
        async function trackShipment(billCode) {
            const modal = document.getElementById('trackingModal');
            const content = document.getElementById('trackingContent');
            modal.classList.remove('hidden');

            content.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>جاري تتبع الشحنة ${billCode}...</p>
                </div>
            `;

            try {
                const res = await fetch(`${API_URL}?action=track&billCode=${billCode}`);
                const data = await res.json();

                if (data.code === "1" && data.data && data.data[0]) {
                    let html = `<h3 style="margin-bottom:16px;text-align:center;font-size:20px;"><i class="fas fa-map-marked-alt" style="color:#0076ff;"></i> مسار الشحنة: ${billCode}</h3>`;

                    const currentStatus = data.data[0].status || '';
                    const details = data.data[0].details || [];

                    let foundDelivered = false;
                    for (const d of details) {
                        if ((d.desc || '').includes('تم التسليم')) { foundDelivered = true; break; }
                    }

                    let displayStatus = currentStatus,
                        statusBg = '#e8f5e9',
                        statusBorder = '#2e7d32',
                        statusColor = '#2e7d32';

                    if (foundDelivered || currentStatus.includes('تم التسليم')) {
                        displayStatus = '✅ تم التسليم';
                    } else if (currentStatus.includes('خطأ') || currentStatus.includes('Error') || currentStatus.includes('❌')) {
                        displayStatus = '❌ ' + currentStatus.replace(/❌️?/g, '').replace(/خطأ/g, '').trim();
                        if (!displayStatus || displayStatus === '❌') displayStatus = '❌ خطأ في التوصيل';
                        statusBg = '#ffeaea';
                        statusBorder = '#dc3545';
                        statusColor = '#dc3545';
                    }

                    html += `
                        <div style="background:${statusBg};padding:12px 16px;border-radius:12px;margin-bottom:18px;border-right:4px solid ${statusBorder};">
                            <strong style="color:${statusColor};font-size:15px;">📍 الحالة الحالية:</strong>
                            <span style="color:${statusColor};font-weight:700;font-size:16px;margin-right:8px;">${displayStatus}</span>
                        </div>
                    `;

                    if (details.length === 0) {
                        html += `<p style="text-align:center;color:#999;padding:20px;">لا توجد تفاصيل تتبع متاحة</p>`;
                    } else {
                        for (const d of details) {
                            let desc = (d.desc || '').replace(/\([0-9]{10,11}\)/g, '').replace(/[0-9]{10,11}/g, '').replace(/J&T/gi, '').replace(/courier/gi, '').replace(/Express/gi, '');
                            let location = d.scanNetworkName || '',
                                city = d.scanNetworkCity || '';
                            let locationText = city && !location.includes(city) ? city + (location ? ' - ' + location : '') : location;
                            locationText = locationText.replace(/[0-9]/g, '').trim();

                            let problemText = d.probleDescription || '';
                            if (problemText) {
                                // ترجمة بسيطة
                                problemText = await translateText(problemText);
                            }

                            html += `
                                <div class="timeline-item">
                                    <div class="time">🕐 ${d.scanTime || ''}</div>
                                    <div class="event">📌 ${desc}</div>
                                    <div class="location">📍 ${locationText}</div>
                                    ${problemText ? `<div class="problem">⚠️ ${problemText}</div>` : ''}
                                </div>
                            `;
                        }
                    }

                    content.innerHTML = html;
                } else {
                    content.innerHTML = `
                        <h3 style="margin-bottom:16px;text-align:center;font-size:20px;"><i class="fas fa-map-marked-alt" style="color:#0076ff;"></i> تتبع الشحنة</h3>
                        <div style="text-align:center;padding:20px;color:#dc3545;">
                            <div style="font-size:48px;margin-bottom:12px;">❌</div>
                            <p>${data.msg || data.error || 'فشل تتبع الشحنة'}</p>
                        </div>
                    `;
                }
            } catch (e) {
                content.innerHTML = `
                    <h3 style="margin-bottom:16px;text-align:center;font-size:20px;"><i class="fas fa-map-marked-alt" style="color:#0076ff;"></i> تتبع الشحنة</h3>
                    <div style="text-align:center;padding:20px;color:#dc3545;">
                        <div style="font-size:48px;margin-bottom:12px;">📡</div>
                        <p>فشل الاتصال بخدمة التتبع</p>
                    </div>
                `;
            }
        }

        // ============================================================
        //  ترجمة النصوص (بسيطة)
        // ============================================================
        async function translateText(text) {
            if (!text) return text;
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data[0]) {
                    let translated = data[0].map(item => item[0]).join('');
                    translated = translated.replace(/،\s*،/g, '،');
                    translated = translated.replace(/\s{2,}/g, ' ');
                    translated = translated.replace(/،\s*$/, '');
                    translated = translated.replace(/\b\d{3,}\b/g, '');
                    return translated.trim() || text;
                }
                return text;
            } catch (error) {
                return text;
            }
        }

        // ============================================================
        //  إغلاق المودال
        // ============================================================
        function closeTrackingModal() {
            document.getElementById('trackingModal').classList.add('hidden');
        }

        // ============================================================
        //  عرض رسائل (toast)
        // ============================================================
        function showToast(message, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast' + (type ? ' ' + type : '');
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        //  تحميل الصفحة
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            fetchOrders();
        });

        // إغلاق المودال عند الضغط على الخلفية
        document.getElementById('trackingModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTrackingModal();
            }
        });

        // إغلاق المودال عند الضغط على ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeTrackingModal();
            }
        });
    </script>

</body>
</html>
