<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LeVance · بشمهندسه هديل</title>
    <!-- Font Awesome 6 (مجاني) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Tajawal (نبيتي) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #fcf6e8;
            color: #2d1f12;
            min-height: 100vh;
            padding: 0 0 3rem 0;
        }

        /* ===== ألوان ذهبية/نبيتي ===== */
        :root {
            --gold: #f5b81b;
            --gold-light: #ffe49e;
            --gold-dark: #b8860b;
            --brown: #2d1f12;
            --brown-light: #5a3f2a;
            --cream: #fff7e5;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            --radius: 28px;
        }

        /* ===== صفحة الهبوط ===== */
        .landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            background: radial-gradient(circle at 30% 20%, #fce9b1, #f3d27e);
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        .landing::before {
            content: "✨";
            position: absolute;
            font-size: 12rem;
            opacity: 0.1;
            top: -30px;
            left: -20px;
            transform: rotate(-15deg);
        }
        .landing::after {
            content: "✦";
            position: absolute;
            font-size: 10rem;
            opacity: 0.08;
            bottom: -20px;
            right: -10px;
            transform: rotate(10deg);
        }
        .landing h1 {
            font-size: 5.2rem;
            font-weight: 800;
            color: var(--brown);
            background: rgba(255, 255, 220, 0.7);
            backdrop-filter: blur(6px);
            padding: 0.8rem 3.5rem;
            border-radius: 100px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            border: 2px solid var(--gold);
            position: relative;
            z-index: 2;
        }
        .landing p {
            margin-top: 1.8rem;
            font-size: 1.5rem;
            background: var(--brown);
            color: var(--gold);
            padding: 0.6rem 2.8rem;
            border-radius: 60px;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #1f130a;
            position: relative;
            z-index: 2;
        }
        .landing .enter-btn {
            margin-top: 3rem;
            background: var(--brown);
            color: var(--gold);
            border: none;
            padding: 1rem 4rem;
            font-size: 2rem;
            font-weight: 700;
            border-radius: 80px;
            cursor: pointer;
            box-shadow: 0 8px 0 #1a100a;
            transition: 0.15s ease;
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
        }
        .landing .enter-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #1a100a;
            background: #3d2b1a;
        }
        .landing .enter-btn i {
            font-size: 1.8rem;
        }

        /* ===== التطبيق الرئيسي ===== */
        .main-app {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        /* ===== الشريط العلوي ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--brown);
            padding: 0.7rem 2.5rem;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            margin-bottom: 2.8rem;
            flex-wrap: wrap;
            gap: 0.6rem;
            border-bottom: 4px solid var(--gold);
        }
        .top-bar .brand {
            display: flex;
            align-items: baseline;
            gap: 0.3rem;
        }
        .top-bar .brand .hl {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--brown);
            background: var(--gold);
            padding: 0.1rem 1.2rem;
            border-radius: 60px;
            letter-spacing: 1px;
            box-shadow: 0 2px 0 #b8860b;
        }
        .top-bar .brand .levance {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 2px 0 #b8860b;
        }
        .top-bar .login-btn {
            background: var(--gold);
            color: var(--brown);
            border: none;
            padding: 0.6rem 2.2rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b8860b;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .top-bar .login-btn:hover {
            background: #f0c44a;
            transform: scale(0.97);
        }

        /* ===== شبكة المنتجات ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin: 1.5rem 0 2.5rem;
        }
        .product-card {
            background: white;
            border-radius: var(--radius);
            padding: 1.2rem 1rem 1.8rem;
            box-shadow: var(--shadow);
            border: 2px solid var(--gold-light);
            transition: 0.25s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
        }
        .product-card:hover {
            border-color: var(--gold);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(190, 140, 20, 0.2);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 24px;
            background: #f5e7ce;
            border: 2px solid #eacd91;
            transition: 0.2s;
        }
        .product-card:hover img {
            border-color: var(--gold);
        }
        .product-card h3 {
            margin: 0.9rem 0 0.2rem;
            font-size: 1.5rem;
            color: var(--brown);
            font-weight: 700;
        }
        .product-card .price {
            font-weight: 800;
            color: var(--gold-dark);
            font-size: 1.4rem;
            background: var(--cream);
            padding: 0.1rem 1.4rem;
            border-radius: 60px;
            display: inline-block;
            margin: 0.3rem 0;
        }
        .product-card .colors,
        .product-card .sizes {
            font-size: 0.9rem;
            background: #f5e7ce;
            padding: 0.2rem 1.4rem;
            border-radius: 60px;
            color: var(--brown-light);
            margin: 0.2rem 0;
            font-weight: 500;
        }
        .product-card .discount-badge {
            background: #c0392b;
            color: white;
            font-weight: 700;
            padding: 0.2rem 1.5rem;
            border-radius: 60px;
            font-size: 0.9rem;
            display: inline-block;
            margin: 0.3rem 0;
            box-shadow: 0 2px 0 #7a2a1f;
        }
        .product-card .add-btn {
            background: var(--gold);
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 60px;
            font-weight: 700;
            color: var(--brown);
            cursor: pointer;
            box-shadow: 0 4px 0 #b8860b;
            transition: 0.1s;
            margin-top: auto;
            width: 100%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .product-card .add-btn:hover {
            background: #e5a90e;
            transform: scale(0.97);
        }

        /* ===== سلة ===== */
        .cart-section {
            background: var(--cream);
            border-radius: var(--radius);
            padding: 1.8rem 2.2rem;
            margin-top: 2.5rem;
            border: 2px solid var(--gold-light);
            box-shadow: var(--shadow);
        }
        .cart-section h3 {
            color: var(--brown);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.8rem;
        }
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 0.5rem 0 1.2rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            border: 1px solid var(--gold);
            font-weight: 500;
        }
        .cart-item button {
            background: none;
            border: none;
            color: #a94442;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .cart-item button:hover {
            color: #7a2a2a;
            transform: scale(1.1);
        }
        .checkout-btn {
            background: var(--brown);
            color: var(--gold);
            border: none;
            padding: 0.9rem 3rem;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 0 #1f130a;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
        }
        .checkout-btn:hover {
            background: #3d2b1a;
            transform: scale(0.98);
        }

        /* ===== لوحة الأدمن ===== */
        .admin-panel {
            display: none;
            background: #fcf3dd;
            border-radius: var(--radius);
            padding: 2.2rem;
            margin-top: 2.5rem;
            border: 3px solid var(--gold);
            box-shadow: var(--shadow);
        }
        .admin-panel h2 {
            color: var(--brown);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }
        .admin-panel .admin-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }
        .admin-panel .admin-row>* {
            flex: 1 1 180px;
        }
        .admin-panel input,
        .admin-panel textarea {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 60px;
            border: 2px solid var(--gold-dark);
            background: white;
            font-size: 1rem;
            transition: 0.2s;
        }
        .admin-panel input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(245, 184, 27, 0.2);
        }
        .admin-btn {
            background: var(--gold);
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            font-weight: 700;
            color: var(--brown);
            cursor: pointer;
            box-shadow: 0 4px 0 #b8860b;
            transition: 0.1s;
            font-size: 1.1rem;
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .admin-btn:hover {
            background: #e5a90e;
            transform: scale(0.97);
        }

        /* ===== مودال تسجيل الدخول ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: #fff7e5;
            padding: 2.8rem 2.5rem;
            border-radius: 60px;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3);
            border: 3px solid var(--gold);
            text-align: center;
            position: relative;
        }
        .modal-content .close-modal {
            position: absolute;
            top: 12px;
            left: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--brown);
            cursor: pointer;
            opacity: 0.6;
            transition: 0.1s;
        }
        .modal-content .close-modal:hover {
            opacity: 1;
            transform: rotate(90deg);
        }
        .modal-content h2 {
            color: var(--brown);
            margin-bottom: 1.8rem;
            font-weight: 800;
        }
        .modal-content input {
            width: 100%;
            padding: 0.9rem 1.5rem;
            margin: 0.7rem 0;
            border: 2px solid var(--gold-dark);
            border-radius: 60px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
        }
        .modal-content input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(245, 184, 27, 0.2);
        }
        .modal-content .login-submit {
            background: var(--gold);
            border: none;
            padding: 0.9rem;
            width: 100%;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--brown);
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 5px 0 #b8860b;
            transition: 0.1s;
        }
        .modal-content .login-submit:hover {
            background: #e5a90e;
            transform: scale(0.98);
        }
        .modal-content .hint {
            margin-top: 0.8rem;
            color: #7a5a2e;
            font-weight: 500;
        }

        /* ===== رسالة منبثقة ===== */
        .message-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--brown);
            color: var(--gold);
            padding: 1rem 2.8rem;
            border-radius: 80px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            border: 2px solid var(--gold);
            backdrop-filter: blur(4px);
            text-align: center;
            min-width: 200px;
        }

        /* ===== استجابة ===== */
        @media (max-width: 700px) {
            .landing h1 {
                font-size: 2.8rem;
                padding: 0.6rem 1.5rem;
            }
            .landing p {
                font-size: 1.1rem;
                padding: 0.4rem 1.5rem;
            }
            .landing .enter-btn {
                font-size: 1.4rem;
                padding: 0.7rem 2.2rem;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 0.8rem 1.2rem;
            }
            .top-bar .brand .levance {
                font-size: 2rem;
            }
            .top-bar .brand .hl {
                font-size: 1.6rem;
            }
            .main-app {
                padding: 0 0.8rem;
            }
            .admin-panel .admin-row {
                flex-direction: column;
            }
            .modal-content {
                padding: 2rem 1.5rem;
            }
        }

        /* ===== أيقونات وأزرار مساعدة ===== */
        .fa-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* زر رائع */
        .btn-glow {
            transition: 0.2s;
        }
        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(245, 184, 27, 0.4);
        }
    </style>
</head>
<body>

    <!-- ======================== صفحة الهبوط ======================== -->
    <div class="landing" id="landingPage">
        <h1>بشمهندسه هديل</h1>
        <p>✦ LeVance ✦</p>
        <button class="enter-btn" id="enterBtn">
            <i class="fas fa-arrow-left"></i> دخول
        </button>
    </div>

    <!-- ======================== التطبيق الرئيسي ======================== -->
    <div class="main-app" id="mainApp">

        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="brand">
                <span class="hl">H.L</span>
                <span class="levance">LeVance</span>
            </div>
            <button class="login-btn" id="loginModalBtn">
                <i class="fas fa-user-circle"></i> تسجيل الدخول
            </button>
        </div>

        <!-- شبكة المنتجات -->
        <div id="productList" class="products-grid"></div>

        <!-- السلة -->
        <div class="cart-section">
            <h3><i class="fas fa-shopping-cart"></i> سلة المشتريات</h3>
            <div id="cartItems" class="cart-items"></div>
            <button class="checkout-btn" id="checkoutBtn">
                <i class="fas fa-truck"></i> إتمام الطلب
            </button>
        </div>

        <!-- لوحة الأدمن (تظهر بعد تسجيل الدخول) -->
        <div class="admin-panel" id="adminPanel">
            <h2><i class="fas fa-crown" style="color:var(--gold);"></i> لوحة الأدمن</h2>
            <div class="admin-row">
                <input type="text" id="productName" placeholder="اسم المنتج" />
                <input type="text" id="productPrice" placeholder="السعر (مثال: 150)" />
                <input type="text" id="productDiscount" placeholder="الخصم (مثال: 20%)" />
            </div>
            <div class="admin-row">
                <input type="text" id="productColors" placeholder="الألوان (أحمر, أزرق)" />
                <input type="text" id="productSizes" placeholder="المقاسات (S, M, L)" />
            </div>
            <input type="text" id="productImage" placeholder="رابط الصورة (URL)" />
            <button class="admin-btn" id="addProductBtn">
                <i class="fas fa-plus-circle"></i> إضافة منتج
            </button>
            <p style="margin-top:1rem; color:var(--brown-light);">
                <i class="fas fa-info-circle"></i> يتم رفع المنتج فوراً للعملاء
            </p>
        </div>
    </div>

    <!-- ======================== مودال تسجيل الدخول ======================== -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="close-modal" id="closeLoginModal">&times;</button>
            <h2><i class="fas fa-lock" style="color:var(--gold);"></i> تسجيل الدخول</h2>
            <input type="text" id="loginName" placeholder="اسم العميل" />
            <input type="text" id="loginPhone" placeholder="رقم الهاتف" />
            <button class="login-submit" id="loginSubmitBtn">
                <i class="fas fa-sign-in-alt"></i> دخول
            </button>
            <div class="hint">(استخدم 111 / 111 للدخول كأدمن)</div>
        </div>
    </div>

    <!-- ======================== رسالة منبثقة ======================== -->
    <div class="message-popup" id="messagePopup">
        <span id="popupMessage">مرحباً!</span>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- البيانات ----------
            let products = [{
                id: 1,
                name: 'فستان أنيق',
                price: 120,
                discount: '10%',
                colors: 'أحمر, ذهبي',
                sizes: 'S, M, L',
                image: 'https://via.placeholder.com/400x240/f5b81b/2d1f12?text=LeVance'
            }, {
                id: 2,
                name: 'حذاء كلاسيك',
                price: 85,
                discount: '',
                colors: 'أسود, بني',
                sizes: '38, 39, 40',
                image: 'https://via.placeholder.com/400x240/f5b81b/2d1f12?text=LeVance'
            }, {
                id: 3,
                name: 'ساعة يدوية',
                price: 210,
                discount: '15%',
                colors: 'فضي, ذهبي',
                sizes: 'متوسط',
                image: 'https://via.placeholder.com/400x240/f5b81b/2d1f12?text=LeVance'
            }];

            let cart = [];
            let currentUser = null; // { name, phone, address }

            // عناصر DOM
            const landing = document.getElementById('landingPage');
            const mainApp = document.getElementById('mainApp');
            const enterBtn = document.getElementById('enterBtn');
            const productList = document.getElementById('productList');
            const cartItems = document.getElementById('cartItems');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const adminPanel = document.getElementById('adminPanel');
            const loginModal = document.getElementById('loginModal');
            const loginModalBtn = document.getElementById('loginModalBtn');
            const closeLoginModal = document.getElementById('closeLoginModal');
            const loginSubmitBtn = document.getElementById('loginSubmitBtn');
            const loginName = document.getElementById('loginName');
            const loginPhone = document.getElementById('loginPhone');
            const messagePopup = document.getElementById('messagePopup');
            const popupMessage = document.getElementById('popupMessage');

            // إدخالات الأدمن
            const productName = document.getElementById('productName');
            const productPrice = document.getElementById('productPrice');
            const productDiscount = document.getElementById('productDiscount');
            const productColors = document.getElementById('productColors');
            const productSizes = document.getElementById('productSizes');
            const productImage = document.getElementById('productImage');
            const addProductBtn = document.getElementById('addProductBtn');

            // ========== FUNCTIONS ==========

            // عرض المنتجات
            function renderProducts() {
                if (!productList) return;
                if (products.length === 0) {
                    productList.innerHTML =
                        `<p style="grid-column:1/-1; text-align:center; color:var(--brown); font-size:1.4rem;">لا توجد منتجات حالياً</p>`;
                    return;
                }
                productList.innerHTML = products.map(p => {
                    const discountHtml = p.discount ? `<span class="discount-badge">خصم ${p.discount}</span>` : '';
                    return `
                        <div class="product-card" data-id="${p.id}">
                            <img src="${p.image || 'https://via.placeholder.com/400x240/f5b81b/2d1f12?text=LeVance'}" alt="${p.name}" loading="lazy" />
                            <h3>${p.name}</h3>
                            <div class="price">$${p.price}</div>
                            ${discountHtml}
                            <div class="colors"><i class="fas fa-palette"></i> ${p.colors || 'ألوان متعددة'}</div>
                            <div class="sizes"><i class="fas fa-ruler"></i> ${p.sizes || 'مقاسات مختلفة'}</div>
                            <button class="add-btn" data-id="${p.id}"><i class="fas fa-cart-plus"></i> أضف للسلة</button>
                        </div>
                    `;
                }).join('');

                // أحداث إضافة للسلة
                document.querySelectorAll('.add-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const id = parseInt(this.dataset.id);
                        const product = products.find(p => p.id === id);
                        if (product) {
                            cart.push({ ...product });
                            renderCart();
                            showPopup(`✅ تم إضافة "${product.name}" إلى السلة`);
                        }
                    });
                });
            }

            // عرض السلة
            function renderCart() {
                if (!cartItems) return;
                if (cart.length === 0) {
                    cartItems.innerHTML = `<p style="color:var(--brown-light); font-size:1.1rem;">السلة فارغة</p>`;
                    return;
                }
                cartItems.innerHTML = cart.map((item, idx) => `
                    <div class="cart-item">
                        <span><i class="fas fa-tag" style="color:var(--gold-dark);"></i> ${item.name}</span>
                        <span>$${item.price}</span>
                        <button data-index="${idx}"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `).join('');

                document.querySelectorAll('.cart-item button[data-index]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const index = parseInt(this.dataset.index);
                        const removed = cart[index]?.name || '';
                        cart.splice(index, 1);
                        renderCart();
                        showPopup(`🗑️ تم حذف "${removed}" من السلة`);
                    });
                });
            }

            // عرض رسالة منبثقة
            function showPopup(msg) {
                popupMessage.textContent = msg;
                messagePopup.style.display = 'block';
                setTimeout(() => {
                    messagePopup.style.display = 'none';
                }, 3500);
            }

            // طلب العنوان (إتمام الطلب)
            function requestAddress() {
                if (cart.length === 0) {
                    showPopup('⚠️ السلة فارغة! أضف منتجات أولاً.');
                    return;
                }

                // إذا كان المستخدم مسجل مسبقاً نعرض بياناته
                let name = currentUser?.name || '';
                let phone = currentUser?.phone || '';
                let address = currentUser?.address || '';

                // نطلب البيانات عبر prompt مع إمكانية التعديل
                const newName = prompt('👤 أدخل اسمك:', name) || name;
                const newPhone = prompt('📱 أدخل رقم هاتفك:', phone) || phone;
                const governorate = prompt('🏙️ المحافظة:') || '';
                const center = prompt('📍 المركز:') || '';
                const street = prompt('🏠 اسم الشارع:') || '';
                const fullAddress = `${governorate} - ${center} - ${street}`;

                if (!newName || !newPhone || !fullAddress.trim()) {
                    showPopup('❌ يرجى إكمال جميع الحقول');
                    return;
                }

                // تسجيل / تحديث حساب العميل
                if (!currentUser) {
                    currentUser = { name: newName, phone: newPhone, address: fullAddress };
                    showPopup(`🎉 تم تسجيل حساب جديد للعميل ${newName}`);
                } else {
                    currentUser.name = newName;
                    currentUser.phone = newPhone;
                    currentUser.address = fullAddress;
                    showPopup(`✅ تم تحديث بيانات العميل ${newName}`);
                }

                // تفريغ السلة بعد الطلب
                cart = [];
                renderCart();
                showPopup(`🙏 شكراً ${newName}! تم إرسال طلبك إلى: ${fullAddress}`);
            }

            // تسجيل الدخول (أدمن أو عميل)
            function handleLogin() {
                const name = loginName.value.trim();
                const phone = loginPhone.value.trim();

                if (name === '111' && phone === '111') {
                    // أدمن
                    adminPanel.style.display = 'block';
                    showPopup('👑 مرحباً أدمن! يمكنك إدارة المنتجات.');
                    loginModal.style.display = 'none';
                    loginName.value = '';
                    loginPhone.value = '';
                    return;
                } else {
                    // عميل عادي
                    if (name && phone) {
                        if (currentUser && currentUser.name === name && currentUser.phone === phone) {
                            showPopup(`👋 أهلاً بعودتك ${name}! تم ملء بياناتك تلقائياً.`);
                        } else {
                            currentUser = { name, phone, address: '' };
                            showPopup(`✨ تم تسجيل دخولك كعميل جديد ${name}`);
                        }
                        loginModal.style.display = 'none';
                        loginName.value = '';
                        loginPhone.value = '';
                    } else {
                        showPopup('⚠️ يرجى إدخال الاسم ورقم الهاتف');
                    }
                }
            }

            // إضافة منتج (أدمن)
            function addProduct() {
                const name = productName.value.trim();
                const price = parseFloat(productPrice.value);
                const discount = productDiscount.value.trim() || '';
                const colors = productColors.value.trim() || 'ألوان متعددة';
                const sizes = productSizes.value.trim() || 'مقاسات متعددة';
                const image = productImage.value.trim() || 'https://via.placeholder.com/400x240/f5b81b/2d1f12?text=LeVance';

                if (!name || isNaN(price) || price <= 0) {
                    showPopup('⚠️ يرجى إدخال اسم المنتج وسعر صحيح');
                    return;
                }

                const newProduct = {
                    id: Date.now(),
                    name,
                    price,
                    discount,
                    colors,
                    sizes,
                    image,
                };
                products.push(newProduct);
                renderProducts();
                // تفريغ الحقول
                productName.value = '';
                productPrice.value = '';
                productDiscount.value = '';
                productColors.value = '';
                productSizes.value = '';
                productImage.value = '';
                showPopup(`✅ تم إضافة المنتج "${name}" بنجاح`);
            }

            // ========== EVENT LISTENERS ==========

            // زر دخول من صفحة الهبوط
            enterBtn.addEventListener('click', function() {
                landing.style.display = 'none';
                mainApp.style.display = 'block';
                renderProducts();
                renderCart();
                // إذا كان المستخدم مسجل مسبقاً نعرض ترحيب
                if (currentUser) {
                    showPopup(`👋 مرحباً ${currentUser.name}`);
                }
            });

            // فتح مودال تسجيل الدخول
            loginModalBtn.addEventListener('click', function() {
                loginModal.style.display = 'flex';
            });

            // إغلاق المودال
            closeLoginModal.addEventListener('click', function() {
                loginModal.style.display = 'none';
            });

            // إغلاق المودال عند الضغط خارج المحتوى
            window.addEventListener('click', function(e) {
                if (e.target === loginModal) loginModal.style.display = 'none';
            });

            // زر تسجيل الدخول
            loginSubmitBtn.addEventListener('click', handleLogin);

            // إتمام الطلب
            checkoutBtn.addEventListener('click', requestAddress);

            // إضافة منتج (أدمن)
            addProductBtn.addEventListener('click', addProduct);

            // ========== التهيئة ==========
            renderProducts();
            renderCart();
            adminPanel.style.display = 'none';

            // إذا تم تسجيل الدخول كأدمن سابقاً (لا نعيد فتح اللوحة)
            // نعرض رسالة ترحيب إذا كان المستخدم مسجل
            if (currentUser) {
                setTimeout(() => {
                    showPopup(`👋 مرحباً ${currentUser.name}`);
                }, 500);
            }

        })();
    </script>

</body>
</html>
