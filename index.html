<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Clock & Archer Scroll</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية الصفحة بيضاء بالكامل */
            background-color: #ffffff;
            /* ارتفاع كافٍ للتمرير والتحكم في المشهدين */
            height: 700vh;
            overflow-x: hidden;
            font-family: sans-serif;
        }

        /* ------------------ 1. قسم الساعة المعلقة ------------------ */
        .hanging-wrapper {
            position: absolute;
            top: 45vh;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .wall-nail {
            width: 18px;
            height: 18px;
            background-color: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00d2ff, 0 0 24px #00d2ff;
            margin-bottom: -2px;
            z-index: 2;
        }

        .hanging-string {
            width: 3px;
            height: 65px;
            background: linear-gradient(to bottom, #00d2ff, rgba(0, 210, 255, 0.4));
            box-shadow: 0 0 10px #00d2ff;
        }

        .clock-frame-box {
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #00d2ff;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.4),
                inset 0 0 20px rgba(0, 210, 255, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clock-container {
            width: 380px;
            height: 380px;
            max-width: 80vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ------------------ 2. قسم الرامي والهدف (تحت الساعة) ------------------ */
        .archer-section {
            position: absolute;
            top: 230vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 850px;
            background: #08090d;
            border: 3px solid #ffd700;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .archer-container {
            width: 100%;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible !important;
        }

        /* توهجات النيون */
        .neon-blue {
            filter: drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 15px #00d2ff);
        }

        .neon-gold {
            filter: drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 14px #ffd700);
        }

        .neon-white {
            filter: drop-shadow(0 0 5px #ffffff) drop-shadow(0 0 12px rgba(255,255,255,0.8));
        }
    </style>
</head>
<body>

    <!-- 1. البرواز المعلق والساعة -->
    <div class="hanging-wrapper">
        <div class="wall-nail"></div>
        <div class="hanging-string"></div>

        <div class="clock-frame-box">
            <div class="clock-container">
                <svg viewBox="-70 -70 440 440">
                    <circle cx="150" cy="150" r="135" fill="none" stroke="#00d2ff" stroke-width="3.5" class="neon-blue" />
                    <g id="ticks" stroke="#00d2ff" stroke-linecap="round" class="neon-blue"></g>
                    <g id="hour-hand" transform="rotate(295 150 150)">
                        <polygon points="146,150 154,150 151,85 149,85" fill="#00d2ff" stroke="#00d2ff" stroke-width="1" class="neon-blue" />
                    </g>
                    <g id="minute-hand" transform="rotate(355 150 150)">
                        <line x1="150" y1="185" x2="150" y2="40" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" class="neon-blue" />
                    </g>
                    <circle cx="150" cy="150" r="8" fill="#00d2ff" stroke="#00d2ff" stroke-width="2" class="neon-blue" />
                </svg>
            </div>
        </div>
    </div>

    <!-- 2. قسم الرامي والهدف تحت الساعة -->
    <div class="archer-section">
        <div class="archer-container">
            <svg viewBox="0 0 800 400">
                <!-- خط الأرضية المضيء -->
                <line x1="30" y1="340" x2="770" y2="340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" class="neon-white" />

                <!-- 1. رامي السهام (Stickman) -->
                <g id="stickman" class="neon-gold">
                    <!-- الرأس وعصابة الرأس -->
                    <circle cx="120" cy="140" r="22" fill="#ffd700" stroke="#ffffff" stroke-width="2" />
                    <line x1="95" y1="135" x2="145" y2="135" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                    
                    <!-- الجسد والأرجل -->
                    <line x1="120" y1="162" x2="120" y2="250" stroke="#ffd700" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="250" x2="90" y2="340" stroke="#ffd700" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="250" x2="150" y2="340" stroke="#ffd700" stroke-width="5" stroke-linecap="round" />

                    <!-- الذراع الممسكة بالقوس -->
                    <line x1="120" y1="180" x2="175" y2="185" stroke="#ffd700" stroke-width="4.5" stroke-linecap="round" />

                    <!-- القوس المضيء -->
                    <path d="M 175,120 Q 205,185 175,250" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round" />
                    <!-- وتر القوس -->
                    <path id="bow-string" d="M 175,120 L 175,185 L 175,250" fill="none" stroke="#ffffff" stroke-width="1.5" />
                </g>

                <!-- 2. السهم المنطلق متحرك بحسب السكرول -->
                <g id="arrow-group" class="neon-white">
                    <line id="arrow-body" x1="130" y1="185" x2="195" y2="185" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
                    <!-- رأس السهم -->
                    <polygon id="arrow-head" points="195,180 207,185 195,190" fill="#ffffff" />
                    <!-- ريش السهم الخلفي -->
                    <line id="feather1" x1="130" y1="185" x2="122" y2="178" stroke="#ffd700" stroke-width="2.5" />
                    <line id="feather2" x1="130" y1="185" x2="122" y2="192" stroke="#ffd700" stroke-width="2.5" />
                </g>

                <!-- 3. لوحة الهدف (Target Board) -->
                <g id="target-board" class="neon-white">
                    <!-- أرجل اللوحة -->
                    <line x1="680" y1="220" x2="630" y2="340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                    <line x1="680" y1="220" x2="730" y2="340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
                    <line x1="680" y1="220" x2="680" y2="340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

                    <!-- دوائر الهدف المضيئة -->
                    <circle cx="680" cy="185" r="55" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="6,4" />
                    <circle cx="680" cy="185" r="38" fill="none" stroke="#ffd700" stroke-width="3" class="neon-gold" />
                    <circle cx="680" cy="185" r="22" fill="none" stroke="#ffffff" stroke-width="3" />
                    <circle cx="680" cy="185" r="8" fill="#ffd700" class="neon-gold" />
                </g>
            </svg>
        </div>
    </div>

    <script>
        // ---- 1. رسم شُرط الساعة ----
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const length = isMajor ? 12 : 6;
            const strokeWidth = isMajor ? 3 : 1.5;
            const opacity = isMajor ? 1 : 0.75;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", 20 + length);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("opacity", opacity);
            line.setAttribute("transform", `rotate(${angle} 150 150)`);

            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        // عناصر أنيميشن السهم والرامي
        const bowString = document.getElementById('bow-string');
        const arrowGroup = document.getElementById('arrow-group');

        let targetFraction = 0;
        let currentFraction = 0;

        // تحديث نسبة التمرير العامة للصفحة
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            targetFraction = Math.min(Math.max(scrollTop / maxScroll, 0), 1);
        });

        // حلقة تحريك انسيابية
        function animate() {
            currentFraction += (targetFraction - currentFraction) * 0.08;

            // أ) حركة عقارب الساعة
            const minuteAngle = 355 + (currentFraction * 360 * 12);
            const hourAngle = 295 + (currentFraction * 360);
            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

            // ب) حركة السهم والرامي بالتمرير
            // يبدأ انطلاق السهم بعد منتصف التمرير للوصول لقسم الرامي
            let archerProgress = (currentFraction - 0.25) / 0.65;
            archerProgress = Math.min(Math.max(archerProgress, 0), 1);

            if (archerProgress < 0.2) {
                // سحب وتر القوس للخلف قبل الإطلاق
                const pull = (archerProgress / 0.2) * 25;
                const stringX = 175 - pull;
                bowString.setAttribute('d', `M 175,120 L ${stringX},185 L 175,250`);
                arrowGroup.setAttribute('transform', `translate(${-pull}, 0)`);
            } else {
                // إطلاق السهم طائراً حتى يستقر داخل الهدف
                const releaseProgress = (archerProgress - 0.2) / 0.8;
                bowString.setAttribute('d', `M 175,120 L 175,185 L 175,250`);
                
                // المسافة من يد الرامي إلى منتصف الهدف
                const startX = -25;
                const targetX = 490; // يصل لقلب الهدف بالضبط
                const currentX = startX + (releaseProgress * (targetX - startX));
                
                arrowGroup.setAttribute('transform', `translate(${currentX}, 0)`);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
