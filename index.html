<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Scroll Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية بيضاء بالكامل */
            background-color: #ffffff;
            /* ارتفاع كبير للصفحة للسماح بالنزول والطلوع */
            height: 500vh;
            overflow-x: hidden;
        }

        /* تثبيت الساعة في منتصف الشاشة دائماً */
        .clock-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            /* تأثير التوهج النيون للساعة بأكملها */
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6));
        }

        /* توهج النيون الأزرق */
        .neon-glow {
            filter: drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 15px #00d2ff);
        }

        .white-glow {
            filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
        }
    </style>
</head>
<body>

    <!-- الساعة في منتصف الشاشة -->
    <div class="clock-container">
        <svg viewBox="0 0 300 300">
            <!-- خلفية قرص الساعة الأسود -->
            <circle cx="150" cy="150" r="135" fill="#03070d" stroke="#00d2ff" stroke-width="3" class="neon-glow" />

            <!-- علامات الدقائق والساعات -->
            <g id="ticks" stroke="#00d2ff" stroke-linecap="round" class="neon-glow"></g>

            <!-- عقرب الساعات (الأبيض) -->
            <g id="hour-hand" transform="rotate(295 150 150)">
                <polygon points="146,150 154,150 151,85 149,85" fill="#ffffff" class="white-glow" />
            </g>

            <!-- عقرب الدقائق (الأزرق النيون الممتد) -->
            <g id="minute-hand" transform="rotate(355 150 150)">
                <line x1="150" y1="185" x2="150" y2="40" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" class="neon-glow" />
            </g>

            <!-- المركز (دائرة الوصل النيون) -->
            <circle cx="150" cy="150" r="8" fill="#03070d" stroke="#00d2ff" stroke-width="3.5" class="neon-glow" />
        </svg>
    </div>

    <script>
        // رسم شُرط/علامات الساعة (60 شرطة)
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const length = isMajor ? 12 : 6;
            const strokeWidth = isMajor ? 2.8 : 1.2;
            const opacity = isMajor ? 1 : 0.75;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", 20 + length);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("opacity", opacity);
            line.setAttribute("transform", `rotate(${angle} 150 150)`);

            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        // ربط دوران العقارب بحركة التمرير (النزول والطلوع)
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScroll;

            // عقرب الدقائق يدور 12 دورة كاملة عند التمرير من الأعلى للأسفل
            const minuteAngle = 355 + (scrollFraction * 360 * 12);
            // عقرب الساعات يدور دورة واحدة كاملة
            const hourAngle = 295 + (scrollFraction * 360);

            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 150 150)`);
        });
    </script>
</body>
</html>
