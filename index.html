<script>

        { id: 'SH-004', name: 'فاطمة حسن', phone: '01098765432', city: 'الشرقية', amount: '150', status: 'قيد التوصيل', tracking: 'JEG555555555', governorate: 'الشرقية', address: 'شارع الزراعة', notes: '' },
        { id: 'SH-005', name: 'خالد سعيد', phone: '01187654321', city: 'القاهرة', amount: '450', status: 'تم التسليم', tracking: 'JEG444444444', governorate: 'القاهرة', address: 'شارع المعادي', notes: 'شقة 3' },

        { id: 'SH-007', name: 'عمر محمود', phone: '01056781234', city: 'الجيزة', amount: '380', status: 'تم التسليم', tracking: 'JEG333333333', governorate: 'الجيزة', address: 'شارع فيصل', notes: 'الدور الثاني' },
        { id: 'SH-008', name: 'ليلى كريم', phone: '01123457890', city: 'القليوبية', amount: '120', status: 'قيد التوصيل', tracking: '', governorate: 'القليوبية', address: 'شارع بنها', notes: '' },
        { id: 'SH-009', name: 'يوسف ناصر', phone: '01267890123', city: 'القاهرة', amount: '290', status: 'تم التسليم', tracking: 'JEG222222222', governorate: 'القاهرة', address: 'شارع العباسية', notes: 'الباب الخلفي' },
        { id: 'SH-010', name: 'منى شريف', phone: '01034567890', city: 'الإسكندرية', amount: '175', status: 'قيد التوصيل', tracking: 'JEG111111111', governorate: 'الإسكندرية', address: 'شارع الرمل', notes: '' }
    ];

    let trackingCache = {};
    let allShipments = [...shipments];
    let currentFiltered = [];

    // ============================================================
    //  عرض الشحنات
    // ============================================================
    function renderShipments(data) {
        const container = document.getElementById('shipmentsContainer');
        const countEl = document.getElementById('resultCount');

        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>لا توجد شحنات مطابقة للبحث</p>
                </div>
            `;
            countEl.classList.remove('show');
            return;
        }

        countEl.textContent = `✅ تم العثور على ${data.length} شحنة`;
        countEl.classList.add('show');

        container.innerHTML = data.map((s, index) => {
            let statusClass = 'status-waiting';
            if (s.status === 'تم التسليم') statusClass = 'status-done';
            else if (s.status === 'قيد التوصيل') statusClass = 'status-tracking';

            const hasTracking = s.tracking && s.tracking.length > 3;
            const highlight = index === 0 ? ' highlight' : '';

            return `
                <div class="shipment-item${highlight}" onclick="toggleDetails(this)" data-id="${s.id}">
                    <div class="row">
                        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                            <span class="name">${s.name}</span>
                            <span class="phone">${s.phone}</span>
                            ${hasTracking ? `<button class="track-btn" onclick="event.stopPropagation(); trackShipment('${s.tracking}')">تتبع</button>` : ''}
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span class="amount">${s.amount} ج.م</span>
                            <span class="status-badge ${statusClass}">${s.status}</span>
                        </div>
                    </div>
                    <div class="status-row">
                        <span class="label">📍 الحالة:</span>
                        <span class="value">${hasTracking ? '⏳ جاري التحميل...' : 'لم يتم التحديد بعد'}</span>
                    </div>
                    <div class="details">
                        <div class="info"><strong>رقم الشحنة:</strong> ${s.id}</div>
                        <div class="info"><strong>المحافظة:</strong> ${s.governorate || ''}</div>
                        <div class="info"><strong>المدينة:</strong> ${s.city || ''}</div>
                        <div class="info"><strong>العنوان:</strong> ${s.address || ''}</div>
                        ${s.notes ? `<div class="info"><strong>ملاحظات:</strong> ${s.notes}</div>` : ''}
                        ${s.tracking ? `<div class="info"><strong>رقم التتبع:</strong> ${s.tracking}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleDetails(element) {
        const details = element.querySelector('.details');
        if (details) details.classList.toggle('open');
    }

    // ============================================================
    //  البحث
    // ============================================================
    function filterShipments() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        
        if (!query) {
            renderShipments(allShipments);
            return;
        }

        const filtered = allShipments.filter(s => {
            const name = s.name.toLowerCase();
            const phone = s.phone.toLowerCase();
            const id = s.id.toLowerCase();
            const city = (s.city || '').toLowerCase();
            return name.includes(query) || phone.includes(query) || id.includes(query) || city.includes(query);
        });

        currentFiltered = filtered;
        renderShipments(filtered);
        
        // تمرير لأول نتيجة
        const firstResult = document.querySelector('.shipment-item.highlight');
        if (firstResult) {
            firstResult.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderShipments(allShipments);
        document.getElementById('searchInput').focus();
    }

    // ============================================================
    //  تتبع شحنة فردية
    // ============================================================
    async function trackShipment(trackingNumber) {
        if (!trackingNumber || trackingNumber.length < 3) {
            showToast('⚠️ رقم التتبع غير صحيح', 'error');
            return;
        }

        document.getElementById('modal').classList.add('show');
        document.getElementById('modalBody').innerHTML = '<div style="text-align:center;padding:30px;"><div style="border:4px solid #e8ecf0;border-top:4px solid #0076ff;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto 10px;"></div><p>جاري تتبع الشحنة...</p></div>';

        try {
            // محاكاة طلب التتبع (بدون API حقيقي)
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            const details = [
                { time: '2026-07-27 10:30', desc: 'تم استلام الشحنة من المرسل', location: 'مدينة العبور' },
                { time: '2026-07-27 12:00', desc: 'تم الفرز والتجهيز', location: 'مركز الفرز الرئيسي' },
                { time: '2026-07-27 14:45', desc: 'الشحنة في طريقها للتوصيل', location: 'في الطريق' }
            ];

            let html = `<h3><i class="fas fa-map-marked-alt"></i> مسار الشحنة</h3>
                <div style="background:#e8f5e9;padding:10px 16px;border-radius:10px;margin-bottom:16px;border-right:4px solid #2e7d32;">
                    <strong style="color:#2e7d32;">📍 الحالة الحالية:</strong>
                    <span style="color:#2e7d32;font-weight:700;">في الطريق للتوصيل</span>
                </div>`;

            details.forEach(d => {
                html += `<div class="timeline-item">
                    <div class="time">🕐 ${d.time}</div>
                    <div class="event">📌 ${d.desc}</div>
                    <div class="location">📍 ${d.location}</div>
                </div>`;
            });

            document.getElementById('modalBody').innerHTML = html;

        } catch (e) {
            document.getElementById('modalBody').innerHTML = `
                <h3><i class="fas fa-map-marked-alt"></i> تتبع الشحنة</h3>
                <div style="text-align:center;padding:20px;color:#dc3545;">
                    <div style="font-size:48px;margin-bottom:12px;">❌</div>
                    <p>فشل تتبع الشحنة</p>
                </div>
            `;
        }
    }

    // ============================================================
    //  تتبع جميع الشحنات (زر تتبع الكل)
    // ============================================================
    function trackAll() {
        const hasTracking = allShipments.filter(s => s.tracking && s.tracking.length > 3);
        if (hasTracking.length === 0) {
            showToast('⚠️ لا توجد شحنات بها رقم تتبع', 'error');
            return;
        }
        showToast(`📍 جاري تتبع ${hasTracking.length} شحنة...`, 'success');
        
        // محاكاة تحديث الحالات
        hasTracking.forEach((s, index) => {
            setTimeout(() => {
                const card = document.querySelector(`.shipment-item[data-id="${s.id}"]`);
                if (card) {
                    const statusRow = card.querySelector('.status-row .value');
                    if (statusRow) {
                        statusRow.textContent = '✅ في الطريق';
                        statusRow.style.color = '#0d47a1';
                    }
                }
            }, index * 300);
        });
    }

    // ============================================================
    //  دوال مساعدة
    // ============================================================
    function closeModal() {
        document.getElementById('modal').classList.remove('show');
    }

    function showToast(message, type) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' ' + type : '');
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ============================================================
    //  أحداث
    // ============================================================
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') filterShipments();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    // ============================================================
    //  تحميل الصفحة
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        renderShipments(allShipments);
    });
</script>

</body>
</html>
