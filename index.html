<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Clock, Archer & Growth Chart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* خلفية بيضاء بالكامل */
            background-color: #ffffff;
            height: 700vh;
            overflow-x: hidden;
            font-family: sans-serif;
            position: relative;
        }

        /* ---------------- 1. الساعة المعلقة في منتصف شاشة البداية ---------------- */
        .hanging-wrapper {
            position: absolute;
            top: 50vh;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .wall-nail {
            width: 18px;
            height: 18px;
            background-color: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00d2ff, 0 0 24px #00d2ff;
            margin-bottom: -2px;
            z-index: 2;
        }

        .hanging-string {
            width: 3px;
            height: 65px;
            background: linear-gradient(to bottom, #00d2ff, rgba(0, 210, 255, 0.4));
            box-shadow: 0 0 10px #00d2ff;
        }

        .clock-frame-box {
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #00d2ff;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.4),
                inset 0 0 20px rgba(0, 210, 255, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الحجم الكبير للساعة (460px) */
        .clock-container {
            width: 460px;
            height: 460px;
            max-width: 85vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------------- 2. قسم الرامي متناسق باللون الأزرق النيون ---------------- */
        .archer-section {
            position: absolute;
            top: 230vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 900px;
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #00d2ff;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.4),
                inset 0 0 20px rgba(0, 210, 255, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .archer-container {
            width: 100%;
            height: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------------- 3. قسم مؤشر الرسم البياني (تم تكبيره وإخفاء الخلفية السوداء) ---------------- */
        .chart-section {
            position: absolute;
            top: 410vh;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px; /* تم تكبير العرض */
            background-color: rgba(255, 255, 255, 0.95);
            border: 4px solid #00d2ff;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.4),
                inset 0 0 20px rgba(0, 210, 255, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .chart-container {
            width: 100%;
            height: 500px; /* تم تكبير الارتفاع */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible !important;
        }

        /* توهج النيون الأزرق الموحد */
        .neon-blue {
            filter: drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 15px #00d2ff);
        }

        .outer-aura {
            filter: drop-shadow(0 0 12px #00d2ff) drop-shadow(0 0 25px #00d2ff);
        }
    </style>
</head>
<body>

    <!-- 1. البرواز المعلق والساعة الحجم الكبير (460px) -->
    <div class="hanging-wrapper">
        <div class="wall-nail"></div>
        <div class="hanging-string"></div>

        <div class="clock-frame-box">
            <div class="clock-container">
                <svg viewBox="-70 -70 440 440">
                    <circle cx="150" cy="150" r="135" fill="none" stroke="#00d2ff" stroke-width="3.5" class="outer-aura" />
                    <g id="ticks" stroke="#00d2ff" stroke-linecap="round" class="neon-blue"></g>
                    <g id="hour-hand" transform="rotate(295 150 150)">
                        <polygon points="146,150 154,150 151,85 149,85" fill="#00d2ff" stroke="#00d2ff" stroke-width="1" class="neon-blue" />
                    </g>
                    <g id="minute-hand" transform="rotate(355 150 150)">
                        <line x1="150" y1="185" x2="150" y2="40" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" class="neon-blue" />
                    </g>
                    <circle cx="150" cy="150" r="8" fill="#00d2ff" stroke="#00d2ff" stroke-width="2" class="neon-blue" />
                </svg>
            </div>
        </div>
    </div>

    <!-- 2. قسم الرامي والهدف (3 أسهم متتالية) -->
    <div class="archer-section">
        <div class="archer-container">
            <svg viewBox="0 0 800 400">
                <line x1="30" y1="340" x2="770" y2="340" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" class="neon-blue" />

                <g id="stickman" class="neon-blue">
                    <g id="quiver-group">
                        <path d="M 98,170 L 112,230 L 102,232 L 88,172 Z" fill="rgba(0, 210, 255, 0.25)" stroke="#00d2ff" stroke-width="2" />
                        <line id="q-arrow-3" x1="91" y1="171" x2="82" y2="150" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
                        <line id="q-arrow-2" x1="95" y1="171" x2="89" y2="145" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
                        <line id="q-arrow-1" x1="99" y1="171" x2="96" y2="140" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
                    </g>

                    <circle cx="120" cy="140" r="22" fill="#00d2ff" stroke="#00d2ff" stroke-width="2" />
                    <line x1="95" y1="135" x2="145" y2="135" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
                    <line x1="120" y1="162" x2="120" y2="250" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="250" x2="90" y2="340" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="250" x2="150" y2="340" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" />
                    <line x1="120" y1="180" x2="175" y2="185" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" />
                    <path d="M 175,120 Q 205,185 175,250" fill="none" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                    <path id="bow-string" d="M 175,120 L 175,185 L 175,250" fill="none" stroke="#00d2ff" stroke-width="2" />
                </g>

                <g id="arrows-container" class="neon-blue">
                    <g id="arrow-1" style="opacity: 0;">
                        <line x1="130" y1="176" x2="195" y2="176" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" />
                        <polygon points="195,170 210,176 195,182" fill="#00d2ff" />
                        <line x1="130" y1="176" x2="120" y2="168" stroke="#00d2ff" stroke-width="2.5" />
                        <line x1="130" y1="176" x2="120" y2="184" stroke="#00d2ff" stroke-width="2.5" />
                    </g>
                    <g id="arrow-2" style="opacity: 0;">
                        <line x1="130" y1="185" x2="195" y2="185" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                        <polygon points="195,179 210,185 195,191" fill="#00d2ff" />
                        <line x1="130" y1="185" x2="120" y2="177" stroke="#00d2ff" stroke-width="3" />
                        <line x1="130" y1="185" x2="120" y2="193" stroke="#00d2ff" stroke-width="3" />
                    </g>
                    <g id="arrow-3" style="opacity: 0;">
                        <line x1="130" y1="194" x2="195" y2="194" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" />
                        <polygon points="195,188 210,194 195,200" fill="#00d2ff" />
                        <line x1="130" y1="194" x2="120" y2="186" stroke="#00d2ff" stroke-width="2.5" />
                        <line x1="130" y1="194" x2="120" y2="202" stroke="#00d2ff" stroke-width="2.5" />
                    </g>
                </g>

                <g id="target-board" class="neon-blue">
                    <line x1="680" y1="220" x2="630" y2="340" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                    <line x1="680" y1="220" x2="730" y2="340" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" />
                    <line x1="680" y1="220" x2="680" y2="340" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" />
                    <circle cx="680" cy="185" r="55" fill="none" stroke="#00d2ff" stroke-width="3.5" stroke-dasharray="6,4" />
                    <circle cx="680" cy="185" r="38" fill="none" stroke="#00d2ff" stroke-width="3" />
                    <circle cx="680" cy="185" r="22" fill="none" stroke="#00d2ff" stroke-width="3" />
                    <circle cx="680" cy="185" r="8" fill="#00d2ff" />
                </g>
            </svg>
        </div>
    </div>

    <!-- 3. قسم الرسم البياني الصاعد (بدون خلفية سوداء وبشكل أكبر وأسرع) -->
    <div class="chart-section">
        <div class="chart-container">
            <svg viewBox="0 0 800 420">
                <defs>
                    <!-- نمط شبكة أزرق نيون خفيف بدون خلفية سوداء -->
                    <pattern id="blue-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 210, 255, 0.22)" stroke-width="1.2" />
                    </pattern>
                </defs>

                <!-- إطار الشبكة الخفيفة والمضيئة فقط (تم إلغاء اللون الأسود) -->
                <rect x="15" y="15" width="770" height="390" rx="20" fill="url(#blue-grid)" stroke="#00d2ff" stroke-width="2" stroke-dasharray="8,6" opacity="0.8" />

                <!-- خط الرسم البياني المتعرج والصاعد -->
                <path id="chart-path" 
                      d="M 50 370 L 110 325 L 135 340 L 200 270 L 235 295 L 310 195 L 345 220 L 440 115 L 475 140 L 560 55 L 595 80 L 710 25" 
                      fill="none" 
                      stroke="#00d2ff" 
                      stroke-width="7" 
                      stroke-linecap="round" 
                      stroke-linejoin="round" 
                      class="neon-blue" />

                <!-- رأس السهم المضيء الصاعد -->
                <g id="chart-arrow-head" class="neon-blue">
                    <path d="M 0 0 L -28 -14 L -20 0 L -28 14 Z" fill="#00d2ff" />
                </g>
            </svg>
        </div>
    </div>

    <script>
        // ---- 1. رسم شُرط الساعة ----
        const ticksGroup = document.getElementById('ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isMajor = i % 5 === 0;
            const length = isMajor ? 12 : 6;
            const strokeWidth = isMajor ? 3 : 1.5;
            const opacity = isMajor ? 1 : 0.75;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", "150");
            line.setAttribute("y1", "20");
            line.setAttribute("x2", "150");
            line.setAttribute("y2", 20 + length);
            line.setAttribute("stroke-width", strokeWidth);
            line.setAttribute("opacity", opacity);
            line.setAttribute("transform", `rotate(${angle} 150 150)`);

            ticksGroup.appendChild(line);
        }

        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');

        // عناصر قسم الرامي
        const bowString = document.getElementById('bow-string');
        const targetBoard = document.getElementById('target-board');
        const qArrow1 = document.getElementById('q-arrow-1');
        const qArrow2 = document.getElementById('q-arrow-2');
        const qArrow3 = document.getElementById('q-arrow-3');
        const arrow1 = document.getElementById('arrow-1');
        const arrow2 = document.getElementById('arrow-2');
        const arrow3 = document.getElementById('arrow-3');

        // عناصر قسم الرسم البياني
        const chartPath = document.getElementById('chart-path');
        const chartArrowHead = document.getElementById('chart-arrow-head');
        const totalChartLength = chartPath.getTotalLength();

        chartPath.style.strokeDasharray = totalChartLength;
        chartPath.style.strokeDashoffset = totalChartLength;

        let targetFraction = 0;
        let currentFraction = 0;

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            targetFraction = Math.min(Math.max(scrollTop / maxScroll, 0), 1);
        });

        function getShotState(progress, start, end) {
            if (progress < start) return { phase: 'waiting', p: 0 };
            if (progress >= end) return { phase: 'done', p: 1 };
            return { phase: 'active', p: (progress - start) / (end - start) };
        }

        // حلقة التحريك التفاعلية
        function animate() {
            currentFraction += (targetFraction - currentFraction) * 0.12;

            // أ) حركة عقارب الساعة
            const minuteAngle = 355 + (currentFraction * 360 * 12);
            const hourAngle = 295 + (currentFraction * 360);
            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 150 150)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 150 150)`);

            // ب) حركة إطلاق 3 أسهم بالتتابع
            let archerProgress = (currentFraction - 0.15) / 0.18;
            archerProgress = Math.min(Math.max(archerProgress, 0), 1);

            const s1 = getShotState(archerProgress, 0.00, 0.33);
            const s2 = getShotState(archerProgress, 0.33, 0.66);
            const s3 = getShotState(archerProgress, 0.66, 1.00);

            const shots = [s1, s2, s3];
            const arrows = [arrow1, arrow2, arrow3];

            qArrow1.style.opacity = s1.phase === 'waiting' ? '1' : '0';
            qArrow2.style.opacity = s2.phase === 'waiting' ? '1' : '0';
            qArrow3.style.opacity = s3.phase === 'waiting' ? '1' : '0';

            let currentBowPull = 0;
            let targetHitImpact = false;
            const startX = -30;
            const targetHitX = 485;

            shots.forEach((s, idx) => {
                const arrow = arrows[idx];
                if (s.phase === 'waiting') {
                    arrow.style.opacity = '0';
                } else if (s.phase === 'active') {
                    arrow.style.opacity = '1';
                    if (s.p < 0.25) {
                        let pull = (s.p / 0.25) * 28;
                        currentBowPull = pull;
                        arrow.setAttribute('transform', `translate(${-pull}, 0)`);
                    } else {
                        let flightP = (s.p - 0.25) / 0.75;
                        let currentX = startX + (flightP * (targetHitX - startX));
                        arrow.setAttribute('transform', `translate(${currentX}, 0)`);
                        if (flightP >= 0.88) targetHitImpact = true;
                    }
                } else if (s.phase === 'done') {
                    arrow.style.opacity = '1';
                    arrow.setAttribute('transform', `translate(${targetHitX}, 0)`);
                }
            });

            const stringX = 175 - currentBowPull;
            bowString.setAttribute('d', `M 175,120 L ${stringX},185 L 175,250`);

            if (targetHitImpact) {
                targetBoard.setAttribute('transform', `translate(6, 0)`);
            } else {
                targetBoard.setAttribute('transform', `translate(0, 0)`);
            }

            // ج) تحريك خط السهم الصاعد بشكل أسرع (تم تقليل المدى الزمني لتسريع الحركة)
            let chartProgress = (currentFraction - 0.36) / 0.14;
            chartProgress = Math.min(Math.max(chartProgress, 0), 1);

            const drawLength = chartProgress * totalChartLength;
            chartPath.style.strokeDashoffset = totalChartLength - drawLength;

            if (drawLength > 0) {
                chartArrowHead.style.opacity = '1';
                const pt = chartPath.getPointAtLength(drawLength);
                const ptPrev = chartPath.getPointAtLength(Math.max(0, drawLength - 3));
                const angle = Math.atan2(pt.y - ptPrev.y, pt.x - ptPrev.x) * (180 / Math.PI);

                chartArrowHead.setAttribute('transform', `translate(${pt.x}, ${pt.y}) rotate(${angle})`);
            } else {
                chartArrowHead.style.opacity = '0';
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
